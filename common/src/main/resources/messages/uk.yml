# \u00BB — це » (подвійна >>), ANSI та UTF-8 інтерпретують його по-різному... через це ви можете навіть побачити ?
prefix: "&bCult &8\u00BB"
command-aliases: [cult, cultac, grim, grimac]

alerts-enabled: "%prefix% &fСповіщення увімкнено"
alerts-disabled: "%prefix% &fСповіщення вимкнено"
verbose-enabled: "%prefix% &fРежим verbose увімкнено"
verbose-disabled: "%prefix% &fРежим verbose вимкнено"
brands-enabled: "%prefix% &fПоказ брендів увімкнено"
brands-disabled: "%prefix% &fПоказ брендів вимкнено"
client-brand-format: "%prefix% &f%player% зайшов з клієнтом %brand%"
console-specify-target: "%prefix% &cЗ консолі потрібно вказати ціль!"
reloading: "%prefix% &7Перезавантаження конфігурації..."
reloaded: "%prefix% &fКонфігурацію перезавантажено."
reload-failed: "%prefix% &cНе вдалося перезавантажити конфігурацію."
player-not-found: "%prefix% &cГравець має виняток з перевірок або не в мережі!"
sender-not-found: "%prefix% &cЩоб використати цю команду, у вас не має бути винятку з перевірок!"
spectate-return: "<click:run_command:/%command% stopspectating><hover:show_text:\"/%command% stopspectating\">\n%prefix% &fНатисніть тут, щоб повернутися на попереднє місце\n</hover></click>"
cannot-spectate-return: "%prefix% &cЦе можна зробити лише після спостереження за гравцем"
cannot-run-on-self: "%prefix% &cВи не можете використати цю команду на собі!"
upload-log: "%prefix% &fНалагоджувальний лог завантажено: %url%"
upload-log-start: "%prefix% &fЗавантаження логу... зачекайте"
upload-log-not-found: "%prefix% &cНе вдалося знайти цей лог"
upload-log-upload-failure: "%prefix% &cПід час завантаження логу щось пішло не так, подробиці в консолі"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Під час обробки пакетів сталася помилка. Зверніться до адміністрації."
run-as-player: "%prefix% &cЦю команду можуть використовувати лише гравці!"
run-as-player-or-console: "%prefix% &cЦю команду можуть використовувати лише гравці або консоль!"
webhook-not-enabled: "Вебхуки Discord не ввімкнені!"
webhook-test-message: "тестове повідомлення"
webhook-test-succeeded: "Тест вебхука Discord пройшов успішно!"
webhook-test-failed: "Тест вебхука Discord не вдався!"

# Допустимі плейсхолдери:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - кількість порушень
# %verbose% - додаткова інформація від перевірки, наприклад відхилення; не всі перевірки її додають
# Назва перевірки веде на /%command% info check.
alerts-format: "%prefix% &f%player% &bпровалив <hover:show_text:\"&b%check_name%%experimental%\n&8Опис: &f%description%\n&7Натисніть, щоб дізнатися більше\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bпровалив <hover:show_text:\"&b%check_name%%experimental%\n&8Опис: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "&bПрофіль гравця &f%player%"
    - "&bПінг: &f%ping%"
    - "&bВерсія: &f%version%"
    - "&bБренд клієнта: &f%brand%"
    - "&bГоризонтальна чутливість: &f%h_sensitivity%%"
    - "&bВертикальна чутливість: &f%v_sensitivity%%"
    - "&bFastMath увімкнено: &f%fast_math%"
    - "&7======================"
# /cult profile для гравця, якого немає на цьому екземплярі: остання збережена сесія.
# %player% %status% %server% %version% %brand% %timeago%
profile-stored:
    - "&7======================"
    - "&bПрофіль гравця &f%player% &7(остання сесія)"
    - "&bСтатус: &f%status%"
    - "&bСервер: &f%server%"
    - "&bВерсія: &f%version%"
    - "&bБренд клієнта: &f%brand%"
    - "&bВостаннє в мережі: &f%timeago% тому"
    - "&7======================"
profile-unknown-player: "%prefix% &c%player% не в мережі на цьому екземплярі й не має збережених сесій."
# /cult debug channels <гравець> — %player%, %count%, %channel%
debug-channels-header: "%prefix% &bВідкриті канали плагінів у &f%player%&b: &f%count%"
debug-channels-entry: "&8- &f%channel%"
debug-channels-none: "%prefix% &bУ &f%player% &bнемає відкритих каналів плагінів"
# /cult debug mods <гравець> — %player%, %count%, %type%, %mod%, %name%, %version%
debug-mods-header: "%prefix% &bМоди Lunar Client у &f%player%&b: &f%count%"
debug-mods-type: "&b%type%:"
debug-mods-entry: "&8- &f%name% &7(%mod%) &8%version%"
debug-mods-not-lunar: "%prefix% &f%player% &bне підключений до Apollo. Apollo повідомляє про моди лише для Lunar Client."
debug-mods-unavailable: "%prefix% &bНемає звіту Apollo про моди для &f%player%&b. Apollo повідомляє про моди лише для Lunar Client."
debug-client-brand: "%prefix% &bБренд клієнта: &f%brand%"
help:
    - "&7======================"
    - "/%command% alerts &f- &7Увімкнути/вимкнути сповіщення"
    - "/%command% alerts scope [server|global] &f- &7Показати або задати, чиї сповіщення ви бачите"
    - "/%command% brands &f- &7Увімкнути/вимкнути показ брендів"
    - "/%command% findplayer [brand=...] &f- &7Список брендів клієнтів онлайн або хто використовує певний"
    - "/%command% profile <гравець> &f- &7Переглянути інформацію про гравця"
    - "/%command% help &f- &7Показати цю довідку"
    - "/%command% info check <перевірка> &f- &7Пояснити перевірку"
    - "/%command% info checks [група] &f- &7Список усіх перевірок"
    - "/%command% debug <гравець> &f- &7Вивід передбачень для розробників"
    - "/%command% perf &f- &7Мс на передбачення для розробників"
    - "/%command% reload &f- &7Перезавантажує конфігурацію"
    - "/%command% observe [on|off] &f- &7Показати або перемкнути режим observe-only"
    - "/%command% spectate <гравець> &f- &7Спостерігати за гравцем"
    - "/%command% verbose &f- &7Показує вам кожне спрацювання, без буферів"
    - "/%command% log [0-255] &f- &7Завантажує налагоджувальний лог спрацювань передбачення"
    - "/%command% history <гравець> &f- &7Список сесій (новіші вгорі)"
    - "/%command% history <гравець> page <N> &f- &7Перейти на сторінку N списку сесій"
    - "/%command% history <гравець> session <N|latest> [-d] [-v] &f- &7Деталі сесії (новіші порушення вгорі)"
    - "/%command% history <гравець> session <N|latest> page <N> [-d] [-v] &f- &7Деталі сесії, сторінка порушень N"
    - "/%command% cloud &f- &7Стан вивантаження в хмару: сокети, утримувані кадри та лічильники"
