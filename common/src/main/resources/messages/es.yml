# \u00BB es » (doble >>), ANSI y UTF-8 interpreta esto diferente... puede que incluso veas "?" debido a esto.
prefix: "&bCult &8\u00BB"
command-aliases: [cult, cultac, grim, grimac]

alerts-enabled: "%prefix% &fAlertas habilitadas"
alerts-disabled: "%prefix% &fAlertas deshabilitadas"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% se ha unido usando %brand%"
console-specify-target: "%prefix% &c¡Debes especificar a alguien siendo la consola!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &c¡El jugador esta excluido o fuera de linea!"
sender-not-found: "%prefix% &c¡No puedes usar este comando si estás exento!"
spectate-return: "<click:run_command:/%command% stopspectating><hover:show_text:\"/%command% stopspectating\">\n%prefix% &fClick aquí para volver a la localización previa\n</hover></click>"
cannot-spectate-return: "%prefix% &cSolo puedes hacer esto despues de espectar a un jugador"
cannot-run-on-self: "%prefix% &cNo puedes usar este comando en ti mismo!"
upload-log: "%prefix% &fSubido el registro de depuración a: %url%"
upload-log-start: "%prefix% &fSubiendo registros... por favor espera"
upload-log-not-found: "%prefix% &cNo se pudo encontrar ese registro"
upload-log-upload-failure: "%prefix% &cAlgo salio mal mientras subíamos ese registro, mira la consola para mas información"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
run-as-player: "%prefix% &c¡Este comando solo puede ser utilizado por jugadores!"
run-as-player-or-console: "%prefix% &c¡Este comando solo puede ser utilizado por jugadores o la consola!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Placeholders validos:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violaciones
# %verbose% - información extra de la comprobación como compensaciones. No todas añadirán informacion.
alerts-format: "%prefix% &f%player% &bfalló <hover:show_text:\"&b%check_name%%experimental%\n&8Descripción: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfailed <hover:show_text:\"&b%check_name%%experimental%\n&8Descripción: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "&bPerfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersión: &f%version%"
    - "&bMarca del cliente: &f%brand%"
    - "&bSensibilidad horizontal: &f%h_sensitivity%%"
    - "&bSensibilidad vertical: &f%v_sensitivity%%"
    - "&bFastMath habilitado: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/%command% alerts &f- &7Alternar alertas"
    - "/%command% alerts scope [server|global] &f- &7Show or set whose alerts you see"
    - "/%command% brands &f- &7Toggle brands"
    - "/%command% findplayer [brand=...] &f- &7List client brands online, or who uses one"
    - "/%command% profile <player> &f- &7Mostrar informacion del jugador"
    - "/%command% help &f- &7Mostrar este mensaje de ayuda"
    - "/%command% debug <player> &f- &7Salida de predicciones para desarrolladores"
    - "/%command% perf &f- &7ms/predicción para los desarrolladores"
    - "/%command% reload &f- &7Recarga la configuración"
    - "/%command% observe [on|off] &f- &7Muestra o cambia el modo observe-only"
    - "/%command% spectate <player> &f- &7Espectar a un jugador"
    - "/%command% verbose &f- &7Te muestra todo aviso, sin buffers"
    - "/%command% log [0-255] &f- &7Sube un registro de depuración para avisos de predicciones"
    - "/%command% history <player> &f- &7Lista de sesiones (más nuevas primero)"
    - "/%command% history <player> page <N> &f- &7Saltar a la página N de la lista de sesiones"
    - "/%command% history <player> session <N|latest> [-d] [-v] &f- &7Detalle de la sesión (violaciones más recientes primero)"
    - "/%command% history <player> session <N|latest> page <N> [-d] [-v] &f- &7Detalle de la sesión, página N de violaciones"
    - "/%command% cloud &f- &7Estado de la subida a la nube: sockets, frames retenidos y contadores"
    - "/%command% findings <player> [count] &f- &7Hallazgos recientes de la nube para un jugador"
    - "/%command% top [check] [minutes] &f- &7Jugadores con los hallazgos de la nube más seguros"
    - "/%command% label <player> <cheat|clean> <high|extreme> <24h|3d|7d|30d> [note] &f- &7Etiqueta a un jugador en el registro de etiquetas de la nube (también list, revoke)"
    - "&7======================"

# === /cult history ===
# UI de historial basada en sesiones. Todas las líneas siguientes son plantillas
# MiniMessage configurables. Los hovers predeterminados viven en etiquetas inline
# <hover:show_text:'...'> y en las claves de fragmentos de hover de abajo; quita
# el hover inline para usar el fallback del renderer.

cult-history-load-failure: "%prefix% &c¡El subsistema de historial no se pudo cargar! Revisa la consola del servidor en busca de errores."
cult-history-disabled: "%prefix% &c¡El subsistema de historial está deshabilitado!"
cult-history-failed: "%prefix% &cError al cargar el historial: &7%error%"
cult-history-unknown-player: "%prefix% &cJugador desconocido: &f%player%"
cult-history-no-sessions: "%prefix% &7Sin historial de sesiones para &f%player%&7."
cult-history-session-not-found: "%prefix% &cSesión &f%ordinal%&c no encontrada para &f%player%&c."

# Lista de sesiones — placeholders válidos: %prefix% %player% %page% %max_pages%
cult-history-header: "%prefix% &bMostrando historial de sesiones de &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Línea de resumen de una sesión — placeholders válidos:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% se expande a cult-history-crashed-marker para sesiones cuya
# conexión cayó sin cierre limpio (caída del servidor, kill -9, RST de canal
# que no disparó UserDisconnectEvent). Cadena vacía para sesiones en curso o
# cerradas correctamente.
cult-history-session: "<hover:show_text:'&bSesión &7%session_uuid%<newline>&7Haz clic o ejecuta &e%detail_command%<newline>&7para ver los detalles de la sesión.'>%prefix% &8[&b%cult_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSesión &f%ordinal%&b, duración &f%duration%&b, con &c%violations%&b violaciones &8[&c%unique_checks%&8]%crashed_marker% &8(&7hace %timeago%&8)</hover>"

# Marcador en línea sustituido en %crashed_marker% para sesiones cuyo
# closed_at == last_activity (es decir, marcadas por el barrido de cierre del
# siguiente arranque, no por la ruta de desconexión). Incluye un espacio
# inicial para que el marcador se lea natural cuando aparece y desaparezca
# limpiamente cuando está vacío.
cult-history-crashed-marker: " &8(&ccaída&8)"

# Detalle de sesión — placeholders válidos:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
cult-history-detail-header: "%prefix% &bMostrando detalle de la sesión &f%ordinal% &bde &f%player%&b:"
cult-history-detail-meta1: "%prefix% &bCult: &f%cult_version%&b, Servidor: &f%server_name%&b, Duración: &f%duration%&b, Fecha: &7hace %timeago%"
cult-history-detail-meta2: "%prefix% &bCliente: &f%client_version%&b, Marca: &f%client_brand%"
cult-history-detail-violations-header: "%prefix% &bViolaciones: &8(%violations% en total, %unique_checks% únicas)"
cult-history-detail-empty: "%prefix% &7- (ninguna)"
# Fila agrupada (predeterminado) — placeholders válidos: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% se construye uniendo entradas cult-history-check-count con ", "
cult-history-detail-group: "<hover:show_text:'&bViolaciones en &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
cult-history-detail-group-hover: "&bViolaciones en &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
cult-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
cult-history-hover-description: " — &f%description%"
cult-history-detail-group-hover-verbose: " — &7%verbose%"
# Fila de violación bruta (--detailed) — placeholders válidos:
#   %prefix% %offset% %check% %description% %vl% %verbose%
cult-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
cult-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
cult-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Formato interno por check dentro de %checks_list% — placeholders válidos: %check_name% %count%
cult-history-check-count: "&f%check_name%&7 x&c%count%"

# A command names a player on another instance, or a staff member asks for network-wide alerts, while
# network.uri in config.yml is empty.
network-disabled-alerts: "%prefix% &cNetwork-wide alerts are not enabled on this server. Ask a server administrator to set network.type in the CultAC configuration."
# /cult alerts scope [server|global]: %scope% is server or global, %source% one of the alerts-scope-* texts below.
alerts-scope: "%prefix% &fAlert scope: &b%scope% &7(%source%)"
alerts-scope-set: "%prefix% &fAlert scope set to &b%scope%"
alerts-scope-chosen: "chosen"
alerts-scope-default: "default"
alerts-scope-local: "network-wide alerts are not enabled on this server"
# A command routed to another instance or engine generation. %instance% is the instance id, %player% the player,
# %location% the instance with its backend server, %reason% why it failed, %lines% and %kb% the output caps.
network-command-same-server: "&c%player% is on %location%; this command only works on the same server."
network-spectate-unreachable: "&c%player% is on %location%; spectating across servers needs CultAC on the proxy."
network-command-stopped: "&cThe command could not be forwarded to %instance%: network routing stopped."
network-command-not-forwarded: "&cThe command could not be forwarded to %instance%."
network-command-target-left: "&c%player% is no longer on %instance%."
network-command-failed: "&c%instance% could not run the command: %reason%"
network-command-line-too-large: "&7One line of output was too large to relay."
network-command-output-lost: "&cSome output from %instance% was lost."
network-command-unfinished: "&7%instance% did not report that the command finished; its output may be incomplete."
network-command-no-answer: "&c%instance% did not answer."
network-command-output-cut: "&cThe rest of the output from %instance% was cut: it is over %lines% lines or %kb% KB."
# /cult findplayer [brand=<text>]: the client brands online, or the players whose brand contains the text.
# Brands, %query%, %player% and %server% show as plain text. %count% is a number of players; findplayer-unknown
# names the players whose brand is not known yet.
findplayer-summary: "%prefix% &bClient brands in use &8· &f%count% &7online &8· &7click a brand to see who uses it"
findplayer-brand: "&8» &f%brand% &7(%count%)"
findplayer-brand-hover: "&7Show who uses %brand%"
findplayer-unknown: "unknown"
findplayer-results: "%prefix% &bPlayers whose brand contains &f%query% &8· &f%count% &7online"
findplayer-player: "&8» &f%player% &7on &f%server% &8· &7%brand%"
findplayer-player-hover: "&7Show %player%'s profile"
findplayer-more: "&7...and %count% more. Type more of the brand name to narrow it down."
findplayer-none: "%prefix% &7Nobody online uses a brand containing &f%query%&7."
findplayer-usage: "%prefix% &cTo search, type &f/%command% findplayer brand=lunar &cwith any part of a brand name, or leave it out to see every brand."

# Marcadores de esquema — ver el comentario de cabecera en config.yml.
config-flavor: V2
config-version: 3
