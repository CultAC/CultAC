# \u00BB is » (double >>), ANSI and UTF-8 interpret this differently... you may even see ? due to this
prefix: "&bCult &8\u00BB"
command-aliases: [cult, cultac, grim, grimac]

alerts-enabled: "%prefix% &fAlerts enabled"
alerts-disabled: "%prefix% &fAlerts disabled"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% joined using %brand%"
console-specify-target: "%prefix% &cYou must specify a target as the console!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cPlayer is exempt or offline!"
sender-not-found: "%prefix% &cYou cannot be exempt to use this command!"
spectate-return: "<click:run_command:/%command% stopspectating><hover:show_text:\"/%command% stopspectating\">\n%prefix% &fClick here to return to previous location\n</hover></click>"
cannot-spectate-return: "%prefix% &cYou can only do this after spectating a player"
cannot-run-on-self: "%prefix% &cYou cannot use this command on yourself!"
upload-log: "%prefix% &fUploaded debug to: %url%"
upload-log-start: "%prefix% &fUploading log... please wait"
upload-log-not-found: "%prefix% &cUnable to find that log"
upload-log-upload-failure: "%prefix% &cSomething went wrong while uploading this log, see console for more info"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
run-as-player: "%prefix% &cThis command can only be used by players!"
run-as-player-or-console: "%prefix% &cThis command can only be used by players or the console!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Valid placeholders:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - extra information from the check such as offsets, not all checks will add information
alerts-format: "%prefix% &f%player% &bfailed <hover:show_text:\"&b%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfailed &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "&bProfile for &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersion: &f%version%"
    - "&bClient Brand: &f%brand%"
    - "&bHorizontal Sensitivity: &f%h_sensitivity%%"
    - "&bVertical Sensitivity: &f%v_sensitivity%%"
    - "&bFastMath Enabled: &f%fast_math%"
    - "&7======================"
# /cult profile for a player this instance does not hold: the last stored session.
# %player% %status% %server% %version% %brand% %timeago%
profile-stored:
    - "&7======================"
    - "&bProfile for &f%player% &7(last session)"
    - "&bStatus: &f%status%"
    - "&bServer: &f%server%"
    - "&bVersion: &f%version%"
    - "&bClient Brand: &f%brand%"
    - "&bLast seen: &f%timeago% ago"
    - "&7======================"
# The player is online through another instance (proxy) that did not answer in time. %player% %instance%
profile-remote-unanswered: "%prefix% &f%player% &7is online on &f%instance%&7, which did not answer; showing their last session."
profile-unknown-player: "%prefix% &c%player% is not online on this instance and has no stored session."
# /cult debug channels <player> — %player%, %count%, %channel%
debug-channels-header: "%prefix% &b%player% has &f%count% &bplugin channels open"
debug-channels-entry: "&8- &f%channel%"
debug-channels-none: "%prefix% &f%player% &bhas no plugin channels open"
# /cult debug mods <player> — %player%, %count%, %type%, %mod%, %name%, %version%
debug-mods-header: "%prefix% &b%player% has &f%count% &bLunar Client mods"
debug-mods-type: "&b%type%:"
debug-mods-entry: "&8- &f%name% &7(%mod%) &8%version%"
debug-mods-not-lunar: "%prefix% &f%player% &bis not connected to Apollo; not a Lunar Client player"
debug-mods-unavailable: "%prefix% &cNo Apollo data for &f%player%&c; their server needs Apollo-Bukkit and the CultAC companion"
help:
    - "&7======================"
    - "/%command% alerts &f- &7Toggle alerts"
    - "/%command% brands &f- &7Toggle brands"
    - "/%command% profile <player> &f- &7View player info"
    - "/%command% help &f- &7View this help message"
    - "/%command% debug <player> &f- &7Developer Prediction output"
    - "/%command% debug channels <player> &f- &7Plugin channels the client opened"
    - "/%command% debug mods <player> &f- &7Lunar Client mods reported through Apollo"
    - "/%command% perf &f- &7Developer ms/prediction"
    - "/%command% reload &f- &7Reloads the config"
    - "/%command% observe [on|off] &f- &7Show or switch observe-only mode"
    - "/%command% spectate <player> &f- &7Spectate a player"
    - "/%command% verbose &f- &7Shows every flag to you, without buffers"
    - "/%command% log [0-255] &f- &7Uploads a debug log for prediction flags"
    - "/%command% history <player> &f- &7Session list (newest first)"
    - "/%command% history <player> page <N> &f- &7Jump to page N of the session list"
    - "/%command% history <player> session <N|latest> [-d] [-v] &f- &7Session detail (most recent violations first)"
    - "/%command% history <player> session <N|latest> page <N> [-d] [-v] &f- &7Session detail, violation page N"
    - "/%command% cloud &f- &7Cloud upload status: sockets, held frames and counters"
    - "/%command% findings <player> [count] &f- &7A player's latest cloud findings"
    - "/%command% top [check] [minutes] &f- &7Players with the most confident cloud findings"
    - "/%command% label <player> <cheat|clean> <high|extreme> <24h|3d|7d|30d> [note] &f- &7Label a player in the cloud's label ledger (also list, revoke)"
    - "&7======================"

# === /cult history ===
# Session-based history UI. All lines below are configurable MiniMessage templates.
# Default row hovers live in inline <hover:show_text:'...'> tags and the hover
# fragment keys below; remove the inline hover to use the renderer fallback.

cult-history-load-failure: "%prefix% &cHistory subsystem failed to load! Check server console for errors."
cult-history-disabled: "%prefix% &cHistory subsystem is disabled!"
cult-history-failed: "%prefix% &cFailed to load history: &7%error%"
cult-history-unknown-player: "%prefix% &cUnknown player: &f%player%"
cult-history-no-sessions: "%prefix% &7No session history for &f%player%&7."
cult-history-session-not-found: "%prefix% &cSession &f%ordinal%&c not found for &f%player%&c."

# Session list — valid placeholders: %prefix% %player% %page% %max_pages%
cult-history-header: "%prefix% &bShowing session history for &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Single session summary line — valid placeholders:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% expands to cult-history-crashed-marker for sessions
# whose connection went away without a graceful close (server crash,
# kill -9, channel RST that didn't fire UserDisconnectEvent). Empty
# string for ongoing or gracefully-closed sessions.
cult-history-session: "<hover:show_text:'&bSession &7%session_uuid%<newline>&7Click or run &e%detail_command%<newline>&7to view session details.'>%prefix% &8[&b%cult_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSession &f%ordinal%&b duration &f%duration%&b with &c%violations%&b violations &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% ago&8)</hover>"

# Inline marker substituted into %crashed_marker% on session lines whose
# closed_at == last_activity (i.e. stamped by the next-boot crash sweep
# rather than the disconnect path). Includes a leading space so the
# marker reads naturally when present and disappears when empty.
cult-history-crashed-marker: " &8(&ccrashed&8)"

# Session detail — valid placeholders:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
cult-history-detail-header: "%prefix% &bShowing &f%player%&b's session &f%ordinal%&b details:"
cult-history-detail-meta1: "%prefix% &bCult: &f%cult_version%&b, Server: &f%server_name%&b, Duration: &f%duration%&b, Date: &7%timeago% ago"
cult-history-detail-meta2: "%prefix% &bClient: &f%client_version%&b, Brand: &f%client_brand%"
cult-history-detail-violations-header: "%prefix% &bViolations: &8(%violations% total, %unique_checks% unique)"
cult-history-detail-empty: "%prefix% &7- (none)"
# A grouped row (default) — valid placeholders: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% is built by joining cult-history-check-count entries with ", "
cult-history-detail-group: "<hover:show_text:'&bViolations in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
cult-history-detail-group-hover: "&bViolations in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
cult-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
cult-history-hover-description: " — &f%description%"
cult-history-detail-group-hover-verbose: " — &7%verbose%"
# A single raw violation row (--detailed) — valid placeholders:
#   %prefix% %offset% %check% %description% %vl% %verbose%
cult-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
cult-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
cult-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Inner format for each check in a group's %checks_list% — valid placeholders: %check_name% %count%
cult-history-check-count: "&f%check_name%&7 x&c%count%"

# Schema markers — see header comment in config.yml.
config-flavor: V2
config-version: 3
