# » è » (doppia >>), ANSI e UTF-8 lo interpretano in modo diverso... si può anche vedere ? A causa di ciò
prefix: "&bCult &8\u00BB"
command-aliases: [cult, cultac, grim, grimac]

alerts-enabled: "%prefix% &fAlerts abilitati"
alerts-disabled: "%prefix% &fAlerts disabilitati"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% si è connesso usando %brand%"
console-specify-target: "%prefix% &cDevi specificare un destinatario come console!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cIl giocatore è esente o offline!"
sender-not-found: "%prefix% &cNon puoi usare questo comando se sei esente!"
spectate-return: "<click:run_command:/%command% stopspectating><hover:show_text:\"/%command% stopspectating\">\n%prefix% &fClicca qui per tornare alla posizione precedente\n</hover></click>"
cannot-spectate-return: "%prefix% &cPuoi farlo solo dopo aver osservato un giocatore"
cannot-run-on-self: "%prefix% &cNon puoi usare questo comando su te stesso!"
upload-log: "%prefix% &fDebug caricato su: %url%"
upload-log-start: "%prefix% &fCaricamento del registro... attendere prego"
upload-log-not-found: "%prefix% &cImpossibile trovare quel registro"
upload-log-upload-failure: "%prefix% &cQualcosa è andato storto durante il caricamento di questo registro, vedi la console per ulteriori informazioni"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
run-as-player: "%prefix% &cQuesto comando può essere utilizzato solo dai giocatori!"
run-as-player-or-console: "%prefix% &cQuesto comando può essere utilizzato solo dai giocatori o dalla console!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

alerts-format: "%prefix% &f%player% &bfallito <hover:show_text:\"&b%check_name%%experimental%\n&8Descrizione: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfallito <hover:show_text:\"&b%check_name%%experimental%\n&8Descrizione: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "&bProfilo per &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersione: &f%version%"
    - "&bBrand del Client: &f%brand%"
    - "&bSensibilità Orizzontale: &f%h_sensitivity%%"
    - "&bSensibilità Verticale: &f%v_sensitivity%%"
    - "&bFastMath Abilitato: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/%command% alerts &f- &7Attiva/disattiva gli alerts"
    - "/%command% alerts scope [server|global] &f- &7Show or set whose alerts you see"
    - "/%command% brands &f- &7Toggle brands"
    - "/%command% findplayer [brand=...] &f- &7List client brands online, or who uses one"
    - "/%command% profile <giocatore> &f- &7Visualizza le informazioni del giocatore"
    - "/%command% help &f- &7Visualizza questo messaggio di aiuto"
    - "/%command% debug <giocatore> &f- &7Output di previsione dello sviluppatore"
    - "/%command% perf &f- &7Ms/predizione dello sviluppatore"
    - "/%command% reload &f- &7Ricarica la configurazione"
    - "/%command% observe [on|off] &f- &7Mostra o cambia la modalità observe-only"
    - "/%command% spectate <giocatore> &f- &7Osserva un giocatore"
    - "/%command% verbose &f- &7Mostra ogni segnalazione a te, senza buffer"
    - "/%command% log [0-255] &f- &7Carica un registro di debug per le segnalazioni di previsione"
    - "/%command% history <player> &f- &7Lista delle sessioni (più recenti prima)"
    - "/%command% history <player> page <N> &f- &7Salta alla pagina N della lista delle sessioni"
    - "/%command% history <player> session <N|latest> [-d] [-v] &f- &7Dettaglio della sessione (violazioni più recenti prima)"
    - "/%command% history <player> session <N|latest> page <N> [-d] [-v] &f- &7Dettaglio della sessione, pagina N delle violazioni"
    - "/%command% cloud &f- &7Stato del caricamento sul cloud: socket, frame trattenuti e contatori"
    - "/%command% findings <player> [count] &f- &7Ultimi risultati del cloud per un giocatore"
    - "/%command% top [check] [minutes] &f- &7Giocatori con i risultati del cloud più sicuri"
    - "/%command% label <player> <cheat|clean> <high|extreme> <24h|3d|7d|30d> [note] &f- &7Etichetta un giocatore nel registro delle etichette del cloud (anche list, revoke)"
    - "&7======================"

# === /cult history ===
# UI cronologia basata sulle sessioni. Tutte le righe sotto sono template
# MiniMessage configurabili. Gli hover predefiniti sono nei tag inline
# <hover:show_text:'...'> e nelle chiavi frammento hover qui sotto; rimuovi
# l'hover inline per usare il fallback del renderer.

cult-history-load-failure: "%prefix% &cImpossibile caricare il sottosistema della cronologia! Controlla la console del server per errori."
cult-history-disabled: "%prefix% &cIl sottosistema cronologia è disabilitato!"
cult-history-failed: "%prefix% &cCaricamento cronologia fallito: &7%error%"
cult-history-unknown-player: "%prefix% &cGiocatore sconosciuto: &f%player%"
cult-history-no-sessions: "%prefix% &7Nessuna cronologia di sessioni per &f%player%&7."
cult-history-session-not-found: "%prefix% &cSessione &f%ordinal%&c non trovata per &f%player%&c."

# Lista sessioni — placeholder validi: %prefix% %player% %page% %max_pages%
cult-history-header: "%prefix% &bMostrando cronologia sessioni per &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Riga di riepilogo singola sessione — placeholder validi:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% si espande in cult-history-crashed-marker per sessioni la
# cui connessione è caduta senza chiusura pulita (crash del server, kill -9,
# RST del canale che non ha attivato UserDisconnectEvent). Stringa vuota per
# sessioni in corso o chiuse correttamente.
cult-history-session: "<hover:show_text:'&bSessione &7%session_uuid%<newline>&7Clicca o esegui &e%detail_command%<newline>&7per vedere i dettagli della sessione.'>%prefix% &8[&b%cult_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSessione &f%ordinal%&b, durata &f%duration%&b, con &c%violations%&b violazioni &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% fa&8)</hover>"

# Marcatore inline sostituito in %crashed_marker% per sessioni il cui
# closed_at == last_activity (cioè marcate dallo sweep di crash al successivo
# avvio, non dal percorso di disconnessione). Include uno spazio iniziale
# perché il marcatore si legga naturalmente quando presente e scompaia
# pulito quando vuoto.
cult-history-crashed-marker: " &8(&ccrash&8)"

# Dettaglio sessione — placeholder validi:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
cult-history-detail-header: "%prefix% &bDettaglio sessione &f%ordinal% &bdi &f%player%&b:"
cult-history-detail-meta1: "%prefix% &bCult: &f%cult_version%&b, Server: &f%server_name%&b, Durata: &f%duration%&b, Data: &7%timeago% fa"
cult-history-detail-meta2: "%prefix% &bClient: &f%client_version%&b, Marca: &f%client_brand%"
cult-history-detail-violations-header: "%prefix% &bViolazioni: &8(%violations% totali, %unique_checks% uniche)"
cult-history-detail-empty: "%prefix% &7- (nessuna)"
# Riga raggruppata (predefinito) — placeholder validi: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% è costruita unendo voci cult-history-check-count con ", "
cult-history-detail-group: "<hover:show_text:'&bViolazioni in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
cult-history-detail-group-hover: "&bViolazioni in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
cult-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
cult-history-hover-description: " — &f%description%"
cult-history-detail-group-hover-verbose: " — &7%verbose%"
# Riga di violazione singola (--detailed) — placeholder validi:
#   %prefix% %offset% %check% %description% %vl% %verbose%
cult-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
cult-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
cult-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Formato interno per ogni check in %checks_list% — placeholder validi: %check_name% %count%
cult-history-check-count: "&f%check_name%&7 x&c%count%"

# A command names a player on another instance, or a staff member asks for network-wide alerts, while
# network.uri in config.yml is empty.
network-disabled-command: "%prefix% &cNetwork-wide commands are not enabled on this server. Ask a server administrator to configure a messaging backend (Redis or NATS) in the CultAC configuration."
network-disabled-alerts: "%prefix% &cNetwork-wide alerts are not enabled on this server. Ask a server administrator to configure a messaging backend (Redis or NATS) in the CultAC configuration."
# /cult alerts scope [server|global]: %scope% is server or global, %source% one of the alerts-scope-* texts below.
alerts-scope: "%prefix% &fAlert scope: &b%scope% &7(%source%)"
alerts-scope-set: "%prefix% &fAlert scope set to &b%scope%"
alerts-scope-chosen: "chosen"
alerts-scope-default: "default"
alerts-scope-local: "network-wide alerts are not enabled on this server"
# A command routed to another instance or engine generation. %instance% is the instance id, %player% the player,
# %location% the instance with its backend server, %reason% why it failed, %lines% and %kb% the output caps.
network-command-same-server: "&c%player% is on %location%; this command only works on the same server."
network-spectate-unreachable: "&c%player% is on %location%; spectating across servers needs CultAC on the proxy."
network-command-stopped: "&cThe command could not be forwarded to %instance%: network routing stopped."
network-command-not-forwarded: "&cThe command could not be forwarded to %instance%."
network-command-target-left: "&c%player% is no longer on %instance%."
network-command-failed: "&c%instance% could not run the command: %reason%"
network-command-line-too-large: "&7One line of output was too large to relay."
network-command-output-lost: "&cSome output from %instance% was lost."
network-command-unfinished: "&7%instance% did not report that the command finished; its output may be incomplete."
network-command-no-answer: "&c%instance% did not answer."
network-command-output-cut: "&cThe rest of the output from %instance% was cut: it is over %lines% lines or %kb% KB."
# /cult findplayer [brand=<text>]: the client brands online, or the players whose brand contains the text.
# Brands, %query%, %player% and %server% show as plain text. %count% is a number of players; findplayer-unknown
# names the players whose brand is not known yet.
findplayer-summary: "%prefix% &bClient brands in use &8· &f%count% &7online &8· &7click a brand to see who uses it"
findplayer-brand: "&8» &f%brand% &7(%count%)"
findplayer-brand-hover: "&7Show who uses %brand%"
findplayer-unknown: "unknown"
findplayer-results: "%prefix% &bPlayers whose brand contains &f%query% &8· &f%count% &7online"
findplayer-player: "&8» &f%player% &7on &f%server% &8· &7%brand%"
findplayer-player-hover: "&7Show %player%'s profile"
findplayer-more: "&7...and %count% more. Type more of the brand name to narrow it down."
findplayer-none: "%prefix% &7Nobody online uses a brand containing &f%query%&7."
findplayer-usage: "%prefix% &cTo search, type &f/%command% findplayer brand=lunar &cwith any part of a brand name, or leave it out to see every brand."

# Marcatori di schema — vedi il commento di intestazione in config.yml.
config-flavor: V2
config-version: 3
