# \u00BB eşittir » (çift >>), ANSI ve UTF-8 bunu farklı yorumlar. bu nedenle ? bile görebilirsiniz
prefix: "&bCult &8\u00BB"
command-aliases: [cult, cultac, grim, grimac]

alerts-enabled: "%prefix% &fUyarılar aktif edildi."
alerts-disabled: "%prefix% &fUyarılar deaktif edildi."
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% adlı oyuncu %brand% kullanarak giriş yaptı."
console-specify-target: "%prefix% &cKonsol olarak bir hedef belirtmelisiniz!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cOyuncu bulunamadı veya aktif değil!"
sender-not-found: "%prefix% &cMuafsanız bu komutu kullanamazsınız!"
spectate-return: "<click:run_command:/%command% stopspectating><hover:show_text:\"/%command% stopspectating\">\n%prefix% &fBir önceki konuma dönmek için buraya tıklayın.\n</hover></click>"
cannot-spectate-return: "%prefix% &cBunu yalnızca bir oyuncuyu izledikten sonra yapabilirsiniz."
cannot-run-on-self: "%prefix% &cBu komutu kendi üzerinizde kullanamazsınız!"
upload-log: "%prefix% &fDebug şu adrese yüklendi: %url%"
upload-log-start: "%prefix% &fLog yükleniyor... lütfen bekleyin."
upload-log-not-found: "%prefix% &cLog bulunamadı."
upload-log-upload-failure: "%prefix% &cLog yüklenirken bir problem oluştu, lütfen konsolu kontrol edin."
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
run-as-player: "%prefix% &cBu komut yalnızca oyuncular tarafından kullanılabilir!"
run-as-player-or-console: "%prefix% &cBu komut yalnızca oyuncular veya konsol tarafından kullanılabilir!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Geçerli placeholderlar:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - ihlal uyarıları
# %verbose% - detaylı olarak verilen tüm uyarılar, checkler tüm bilgileri vermez
alerts-format: "%prefix% &b%player% &fadlı oyuncuda &f(x&c%vl%&f) &fadet <hover:show_text:\"&b%check_name%%experimental%\n&8Açıklama: &f%description%\">&b%check_name%%experimental%</hover> &ftespit edildi: &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &b%player% &fadlı oyuncuda &f(x&c%vl%&f) &fadet <hover:show_text:\"&b%check_name%%experimental%\n&8Açıklama: &f%description%\">&b%check_name%%experimental%</hover> &ftespit edildi: &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "&f%player% &badlı oyuncunun profili:"
    - "&bGecikme: &f%ping%"
    - "&bVersiyon: &f%version%"
    - "&bKullanılan Client: &f%brand%"
    - "&bDikey Hassasiyet: &f%h_sensitivity%%"
    - "&bYatay Hassasiyet: &f%v_sensitivity%%"
    - "&bFastMath Ayarı: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/%command% alerts &f- &7Uyarıları aktif/deaktif eder"
    - "/%command% alerts scope [server|global] &f- &7Show or set whose alerts you see"
    - "/%command% brands &f- &7Toggle brands"
    - "/%command% findplayer [brand=...] &f- &7List client brands online, or who uses one"
    - "/%command% profile (oyuncu) &f- &7Oyuncu profilini gösterir"
    - "/%command% help &f- &7Bu yardım mesajını gösterir"
    - "/%command% debug <player> &f- &7Geliştirici Debug'ını verir"
    - "/%command% perf &f- &7Geliştirici Performansını verir"
    - "/%command% reload &f- &7Configi yeniden yükler"
    - "/%command% observe [on|off] &f- &7Observe-only modunu gösterir veya değiştirir"
    - "/%command% spectate (oyuncu) &f- &7Bir oyuncuyu izlemenizi sağlar"
    - "/%command% verbose &f- &7Arabelleğe almadan tüm uyarıları görmenizi sağlar"
    - "/%command% log (0-255) &f- &7Uyarılar için bir debug logu çıktısı verir"
    - "/%command% history <player> &f- &7Oturum listesi (en yenisi başta)"
    - "/%command% history <player> page <N> &f- &7Oturum listesinin N. sayfasına atla"
    - "/%command% history <player> session <N|latest> [-d] [-v] &f- &7Oturum detayı (en yeni ihlaller başta)"
    - "/%command% history <player> session <N|latest> page <N> [-d] [-v] &f- &7Oturum detayı, ihlal sayfası N"
    - "/%command% cloud &f- &7Bulut yükleme durumu: soketler, bekletilen kareler ve sayaçlar"
    - "/%command% findings <player> [count] &f- &7Bir oyuncunun en son bulut bulguları"
    - "/%command% top [check] [minutes] &f- &7En güvenilir bulut bulgularına sahip oyuncular"
    - "/%command% label <player> <cheat|clean> <high|extreme> <24h|3d|7d|30d> [note] &f- &7Bir oyuncuyu bulutun etiket kaydında etiketle (ayrıca list, revoke)"
    - "&7======================"

# === /cult history ===
# Oturum tabanlı geçmiş arayüzü. Aşağıdaki tüm satırlar yapılandırılabilir
# MiniMessage şablonlarıdır. Varsayılan hover'lar inline
# <hover:show_text:'...'> taglerinde ve aşağıdaki hover parçası anahtarlarında
# bulunur; renderer fallback'ini kullanmak için inline hover'ı kaldır.

cult-history-load-failure: "%prefix% &cGeçmiş altsistemi yüklenemedi! Hatalar için sunucu konsolunu kontrol edin."
cult-history-disabled: "%prefix% &cGeçmiş alt sistemi devre dışı!"
cult-history-failed: "%prefix% &cGeçmiş yüklenemedi: &7%error%"
cult-history-unknown-player: "%prefix% &cBilinmeyen oyuncu: &f%player%"
cult-history-no-sessions: "%prefix% &7&f%player% &7için oturum geçmişi yok."
cult-history-session-not-found: "%prefix% &c&f%player% &ciçin &f%ordinal% &cnumaralı oturum bulunamadı."

# Oturum listesi — geçerli placeholder'lar: %prefix% %player% %page% %max_pages%
cult-history-header: "%prefix% &b&f%player% &biçin oturum geçmişi &8[&f%page%&7/&f%max_pages%&8]"
# Tek oturum özeti satırı — geçerli placeholder'lar:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# Bağlantısı düzgün kapanmadan kopan oturumlar (sunucu çökmesi, kill -9,
# UserDisconnectEvent tetiklemeyen channel RST gibi) için %crashed_marker%
# cult-history-crashed-marker olarak genişler. Devam eden veya düzgün
# kapatılmış oturumlarda boş string olur.
cult-history-session: "<hover:show_text:'&bOturum &7%session_uuid%<newline>&7Tıkla veya &e%detail_command% &7komutunu çalıştır<newline>&7oturum detaylarını görmek için.'>%prefix% &8[&b%cult_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bOturum &f%ordinal%&b, süre &f%duration%&b, &c%violations%&b ihlal &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% önce&8)</hover>"

# closed_at == last_activity olan oturumlar (yani disconnect yolu yerine bir
# sonraki başlatmanın crash-sweep'i tarafından damgalananlar) için
# %crashed_marker%'a yerleştirilen satır içi işaret. Var olduğunda doğal
# okunsun, yokken temiz kaybolsun diye başında bir boşluk içerir.
cult-history-crashed-marker: " &8(&cçöktü&8)"

# Oturum detayı — geçerli placeholder'lar:
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
cult-history-detail-header: "%prefix% &b&f%player% &boyuncusunun &f%ordinal% &bnumaralı oturum detayı:"
cult-history-detail-meta1: "%prefix% &bCult: &f%cult_version%&b, Sunucu: &f%server_name%&b, Süre: &f%duration%&b, Tarih: &7%timeago% önce"
cult-history-detail-meta2: "%prefix% &bİstemci: &f%client_version%&b, Marka: &f%client_brand%"
cult-history-detail-violations-header: "%prefix% &bİhlaller: &8(toplam %violations%, benzersiz %unique_checks%)"
cult-history-detail-empty: "%prefix% &7- (yok)"
# Gruplanmış satır (varsayılan) — geçerli placeholder'lar: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list%, cult-history-check-count girdileri ", " ile birleştirilerek oluşur
cult-history-detail-group: "<hover:show_text:'&b%bucket_start%–%bucket_end% aralığındaki ihlaller:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
cult-history-detail-group-hover: "&b%bucket_start%–%bucket_end% aralığındaki ihlaller:%bucket_hover_entries%"
cult-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
cult-history-hover-description: " — &f%description%"
cult-history-detail-group-hover-verbose: " — &7%verbose%"
# Tek ham ihlal satırı (--detailed) — geçerli placeholder'lar:
#   %prefix% %offset% %check% %description% %vl% %verbose%
cult-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
cult-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
cult-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# %checks_list% içinde her kontrol için iç biçim — geçerli placeholder'lar: %check_name% %count%
cult-history-check-count: "&f%check_name%&7 x&c%count%"

# A command names a player on another instance, or a staff member asks for network-wide alerts, while
# network.uri in config.yml is empty.
network-disabled-alerts: "%prefix% &cNetwork-wide alerts are not enabled on this server. Ask a server administrator to set network.type in the CultAC configuration."
# /cult alerts scope [server|global]: %scope% is server or global, %source% one of the alerts-scope-* texts below.
alerts-scope: "%prefix% &fAlert scope: &b%scope% &7(%source%)"
alerts-scope-set: "%prefix% &fAlert scope set to &b%scope%"
alerts-scope-chosen: "chosen"
alerts-scope-default: "default"
alerts-scope-local: "network-wide alerts are not enabled on this server"
# A command routed to another instance or engine generation. %instance% is the instance id, %player% the player,
# %location% the instance with its backend server, %reason% why it failed, %lines% and %kb% the output caps.
network-command-same-server: "&c%player% is on %location%; this command only works on the same server."
network-spectate-unreachable: "&c%player% is on %location%; spectating across servers needs CultAC on the proxy."
network-command-stopped: "&cThe command could not be forwarded to %instance%: network routing stopped."
network-command-not-forwarded: "&cThe command could not be forwarded to %instance%."
network-command-target-left: "&c%player% is no longer on %instance%."
network-command-failed: "&c%instance% could not run the command: %reason%"
network-command-no-answer: "&c%instance% did not answer."
network-command-output-cut: "&cThe rest of the output from %instance% was cut: it is over %lines% lines or %kb% KB."
# /cult findplayer [brand=<text>]: the client brands online, or the players whose brand contains the text.
# Brands, %query%, %player% and %server% show as plain text. %count% is a number of players; findplayer-unknown
# names the players whose brand is not known yet.
findplayer-summary: "%prefix% &bClient brands in use &8· &f%count% &7online &8· &7click a brand to see who uses it"
findplayer-brand: "&8» &f%brand% &7(%count%)"
findplayer-brand-hover: "&7Show who uses %brand%"
findplayer-unknown: "unknown"
findplayer-results: "%prefix% &bPlayers whose brand contains &f%query% &8· &f%count% &7online"
findplayer-player: "&8» &f%player% &7on &f%server% &8· &7%brand%"
findplayer-player-hover: "&7Show %player%'s profile"
findplayer-more: "&7...and %count% more. Type more of the brand name to narrow it down."
findplayer-none: "%prefix% &7Nobody online uses a brand containing &f%query%&7."
findplayer-usage: "%prefix% &cTo search, type &f/%command% findplayer brand=lunar &cwith any part of a brand name, or leave it out to see every brand."

# Şema işaretçileri — bkz. config.yml'deki başlık yorumu.
config-flavor: V2
config-version: 3
