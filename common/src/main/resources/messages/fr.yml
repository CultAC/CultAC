# \u00BB se traduit par » (double >>). Les interprétations diffèrent entre les normes ANSI et UTF-8... vous pouvez même voir ? en raison de cela
prefix: "&bCult &8\u00BB"
command-aliases: [cult, cultac, grim, grimac]

alerts-enabled: "%prefix% &fAlertes activées"
alerts-disabled: "%prefix% &fAlertes désactivées"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% a rejoint en utilisant %brand%"
console-specify-target: "%prefix% &cVous devez spécifier une cible en tant que console !"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cPlayer est ignoré ou hors ligne !"
sender-not-found: "%prefix% &cVous ne pouvez pas utiliser cette commande si vous êtes exempté !"
spectate-return: "<click:run_command:/%command% stopspectating><hover:show_text:\"/%command% stopspectating\">\n%prefix% &fClickez ici pour retourner à votre position d'origine\n</hover></click>"
cannot-spectate-return: "%prefix% &cVous pouvez faire cela uniquement en étant en spectateur"
cannot-run-on-self: "%prefix% &cVous ne pouvez pas utiliser cette commande sur vous-même !"
upload-log: "%prefix% &fLe fichier de débogage a été téléversé vers : %url%"
upload-log-start: "%prefix% &fTéléversement du journal... Veuillez patienter"
upload-log-not-found: "%prefix% &cUImpossible de trouver le journal de débogage"
upload-log-upload-failure: "%prefix% &cUne erreur est survenue lors du téléversement de ce journal, regardez la console pour plus d'information"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
run-as-player: "%prefix% &cCette commande ne peut être utilisée que par les joueurs !"
run-as-player-or-console: "%prefix% &cCette commande ne peut être utilisée que par les joueurs ou la console !"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Placeholders valides :
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - Informations supplémentaires sur les vérifivations comme les écarts, toutes les vérifications n'ajoutent pas d'information
alerts-format: "%prefix% &f<click:run_command:'/%command% spectate %player%'><hover:show_text:'/%command% spectate %player%'>%player%</hover></click> &ba échoué <hover:show_text:\"&b%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f<click:run_command:'/%command% spectate %player%'><hover:show_text:'/%command% spectate %player%'>%player%</hover></click> &ba échoué <hover:show_text:\"&b%check_name%%experimental%\n&8Description: &f%description%\">&f%check_name%%experimental%</hover> &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "&bProfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersion du client : &f%version%"
    - "&bNature du client : &f%brand%"
    - "&bSensibilité Horizontale : &f%h_sensitivity%%"
    - "&bSensibilité Verticale : &f%v_sensitivity%%"
    - "&bFastMath est activé : &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/%command% alerts &f- &7Activer/Désactiver les alertes"
    - "/%command% alerts scope [server|global] &f- &7Show or set whose alerts you see"
    - "/%command% brands &f- &7Toggle brands"
    - "/%command% findplayer [brand=...] &f- &7List client brands online, or who uses one"
    - "/%command% profile <player> &f- &7Voir le profil du joueur"
    - "/%command% help &f- &7Afficher l'aide"
    - "/%command% debug <player> &f- &7Afficher les informations de débogage du joueur"
    - "/%command% perf &f- &7Afficher les informations de performance"
    - "/%command% reload &f- &7Recharger la configuration"
    - "/%command% observe [on|off] &f- &7Afficher ou basculer le mode observe-only"
    - "/%command% net <target> status &f- &7Status of every CultAC server the target names"
    - "/%command% net <target> reload &f- &7Reload the config on every CultAC server the target names"
    - "/%command% net <target> observe [on|off] &f- &7Show or switch observe-only for the players the target names"
    - "/%command% net <target> punish [on|off] &f- &7Show or switch punishment commands for the players the target names"
    - "/%command% net <target> toggle [on|off] &f- &7Show or switch checking for the players the target names"
    - "/%command% net <target> check <check> <on|off> &f- &7Switch a check for the players the target names"
    - "/%command% net <target> update <build>|latest [channel] [--canary] &f- &7Install a build on every proxy the target names; this proxy updates last"
    - "/%command% spectate <player> &f- &7Regarder un joueur"
    - "/%command% verbose &f- &7Affiche chaqu'une de vos violations, sans tampons"
    - "/%command% log [0-255] &f- &7Téléverse un journal de débogage pour les indicateurs de prédiction"
    - "/%command% history <player> &f- &7Liste des sessions (les plus récentes en premier)"
    - "/%command% history <player> page <N> &f- &7Aller à la page N de la liste des sessions"
    - "/%command% history <player> session <N|latest> [-d] [-v] &f- &7Détail d'une session (violations les plus récentes en premier)"
    - "/%command% history <player> session <N|latest> page <N> [-d] [-v] &f- &7Détail d'une session, page N des violations"
    - "/%command% cloud &f- &7État de l'envoi vers le cloud : sockets, trames retenues et compteurs"
    - "/%command% findings <player> [count] &f- &7Derniers résultats du cloud pour un joueur"
    - "/%command% top [check] [minutes] &f- &7Joueurs aux résultats du cloud les plus sûrs"
    - "/%command% label <player> <cheat|clean> <high|extreme> <24h|3d|7d|30d> [note] &f- &7Étiqueter un joueur dans le registre d'étiquettes du cloud (aussi list, revoke)"
    - "&7======================"

# === /cult history ===
# UI d'historique basée sur les sessions. Toutes les lignes ci-dessous sont des
# modèles MiniMessage configurables. Les hovers par défaut vivent dans les tags
# inline <hover:show_text:'...'> et les clés de fragments de hover ci-dessous ;
# retirez le hover inline pour utiliser le fallback du renderer.

cult-history-load-failure: "%prefix% &cLe sous-système d'historique n'a pas pu être chargé ! Vérifiez la console du serveur pour les erreurs."
cult-history-disabled: "%prefix% &cLe sous-système d'historique est désactivé !"
cult-history-failed: "%prefix% &cÉchec du chargement de l'historique : &7%error%"
cult-history-unknown-player: "%prefix% &cJoueur inconnu : &f%player%"
cult-history-no-sessions: "%prefix% &7Pas d'historique de sessions pour &f%player%&7."
cult-history-session-not-found: "%prefix% &cSession &f%ordinal%&c introuvable pour &f%player%&c."

# Liste des sessions — placeholders valides : %prefix% %player% %page% %max_pages%
cult-history-header: "%prefix% &bAffichage de l'historique des sessions pour &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Ligne de résumé d'une session — placeholders valides :
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% s'étend en cult-history-crashed-marker pour les sessions
# dont la connexion a disparu sans fermeture propre (crash serveur, kill -9,
# RST de canal sans UserDisconnectEvent). Chaîne vide pour les sessions en
# cours ou closes proprement.
cult-history-session: "<hover:show_text:'&bSession &7%session_uuid%<newline>&7Cliquez ou exécutez &e%detail_command%<newline>&7pour afficher les détails de la session.'>%prefix% &8[&b%cult_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSession &f%ordinal%&b, durée &f%duration%&b, avec &c%violations%&b violations &8[&c%unique_checks%&8]%crashed_marker% &8(&7il y a %timeago%&8)</hover>"

# Marqueur en ligne substitué dans %crashed_marker% pour les sessions dont
# closed_at == last_activity (c.-à-d. estampillées par le balayage de crash
# au prochain démarrage, et non par le chemin de déconnexion). Inclut un
# espace de tête pour que le marqueur se lise naturellement quand il est
# présent et disparaisse proprement quand il est vide.
cult-history-crashed-marker: " &8(&ccrash&8)"

# Détail de session — placeholders valides :
#   %prefix% %player% %ordinal% %cult_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
cult-history-detail-header: "%prefix% &bDétail de la session &f%ordinal% &bde &f%player%&b :"
cult-history-detail-meta1: "%prefix% &bCult : &f%cult_version%&b, Serveur : &f%server_name%&b, Durée : &f%duration%&b, Date : &7il y a %timeago%"
cult-history-detail-meta2: "%prefix% &bClient : &f%client_version%&b, Marque : &f%client_brand%"
cult-history-detail-violations-header: "%prefix% &bViolations : &8(%violations% au total, %unique_checks% uniques)"
cult-history-detail-empty: "%prefix% &7- (aucune)"
# Ligne groupée (par défaut) — placeholders valides : %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% est construite en joignant les entrées cult-history-check-count avec ", "
cult-history-detail-group: "<hover:show_text:'&bViolations entre &f%bucket_start%–%bucket_end%&b :%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
cult-history-detail-group-hover: "&bViolations entre &f%bucket_start%–%bucket_end%&b :%bucket_hover_entries%"
cult-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
cult-history-hover-description: " — &f%description%"
cult-history-detail-group-hover-verbose: " — &7%verbose%"
# Ligne de violation brute (--detailed) — placeholders valides :
#   %prefix% %offset% %check% %description% %vl% %verbose%
cult-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
cult-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
cult-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Format interne pour chaque check dans %checks_list% — placeholders valides : %check_name% %count%
cult-history-check-count: "&f%check_name%&7 x&c%count%"

# A staff member asks for network-wide alerts while network.type in config.yml is unset.
network-disabled-alerts: "%prefix% &cNetwork-wide alerts are not enabled on this server. Ask a server administrator to set network.type in the CultAC configuration."
# /cult alerts scope [server|global]: %scope% is server or global, %source% one of the alerts-scope-* texts below.
alerts-scope: "%prefix% &fAlert scope: &b%scope% &7(%source%)"
alerts-scope-set: "%prefix% &fAlert scope set to &b%scope%"
alerts-scope-chosen: "chosen"
alerts-scope-default: "default"
alerts-scope-local: "network-wide alerts are not enabled on this server"
# A command routed to another instance or engine generation. %instance% is the instance id, %player% the player,
# %location% the instance with its backend server, %reason% why it failed, %lines% and %kb% the output caps.
network-command-same-server: "&c%player% is on %location%; this command only works on the same server."
network-spectate-unreachable: "&c%player% is on %location%; spectating across servers needs CultAC on the proxy."
network-command-stopped: "&cThe command could not be forwarded to %instance%: network routing stopped."
network-command-not-forwarded: "&cThe command could not be forwarded to %instance%."
network-command-target-left: "&c%player% is no longer on %instance%."
network-command-failed: "&c%instance% could not run the command: %reason%"
network-command-no-answer: "&c%instance% did not answer."
network-command-output-cut: "&cThe rest of the output from %instance% was cut: it is over %lines% lines or %kb% KB."
# /cult net <target> <command>: one command on several CultAC instances. %cmd% is the command, %target% the target as
# typed, %term% one of its names, %count% a number of instances, %instance% and %instances% instance ids, %line% one
# instance's answer, %sender% a staff name, %node% a permission node, %reason% why the command failed.
net-usage: "%prefix% &cUse /%command% net <target> <command>. A target is all, proxies, an instance id, a backend server or a pattern such as BRG_*, or several of them joined by commas. Commands: %commands%. Name an instance called proxies as id:proxies."
net-off: "%prefix% &eNetwork routing is off on this server, so network commands reach this server only."
net-busy: "%prefix% &cA network command is still running; try again in a few seconds."
net-invalid-term: "%prefix% &c%term% is not a valid target. Names take letters, digits and . _ - *; join several with commas, no spaces."
net-unknown: "%prefix% &cNo proxy or server is named %term%; nothing was sent."
net-no-match: "%prefix% &cNothing matches %term%; nothing was sent."
net-not-listed: "%prefix% &eNo proxy lists %term%; the setting applies when it appears."
net-syncing: "%prefix% &cThis server is still loading the network's shared settings; try again in a few seconds."
net-backend-term: "%prefix% &c%cmd% runs on CultAC instances only; %term% is a backend server."
net-sent: "%prefix% &7%cmd% sent to %count% instances (%target%)"
net-reply: "&b%instance% &8» &f%line%"
net-summary: "%prefix% &7%answered% of %expected% answered"
net-no-answer: "%prefix% &cDid not answer: &f%instances%"
net-older: "%prefix% &eOlder builds (cannot run network commands): &f%instances%"
# One instance's status. %toggle% is checking or dormant, %observe% observe-only or enforcing, %punish% punishing or
# punishments paused, %checks% the checks switched off. net-status-backends-line is a proxy's status for the players on
# %backends%, the backend servers named.
net-status-line: "&f%build% &8· &7%role% &8· &f%players% &7players, &f%inspected% &7inspected, &f%dormant% &7dormant &8· &7%toggle% &8· &7%observe% &8· &7%punish% &8· &7checks off: &f%checks% &8· &f%prediction% &7ms/prediction &8· &7up &f%uptime% &7(engine &f%engine_uptime%&7, %generations% generations)"
net-status-backends-line: "&f%build% &8· &7%role% &8· &7on &f%backends%&7: &f%players% &7players, &f%inspected% &7inspected &8· &7%toggle% &8· &7%observe% &8· &7%punish% &8· &7checks off: &f%checks%"
net-refused-permission: "&crefused: %sender% lacks %node% here"
net-refused-disabled: "&crefused: this server does not take network commands"
net-refused-not-accepted: "&crefused: this server does not take %cmd% over the network"
net-refused-unsupported: "&crefused: this server's build cannot run %cmd%"
net-refused-invalid: "&crefused: %cmd% does not take these arguments"
net-refused-busy: "&crefused: too many network commands are running here"
net-refused-rate: "&crefused: too many network commands from %instance% lately"
net-failed: "&cfailed: %reason%"
# Answers to reload, observe, punish and check; reload answers with reloaded or reload-failed. %players% is whom a
# command ran for, %state% a setting's value (with where it comes from for a bare observe or punish), %check% a check's
# name, %env% the environment variable pinning a setting.
net-pinned: "&enot changed: pinned by %env%"
net-observe-state: "&f%players%: %state%"
net-observe-applied: "&f%players%: now %state%"
net-observe-failed: "&c%players%: set to %state%, but reloading failed; see the console"
net-punish-state: "&f%players%: %state%"
net-punish-applied: "&f%players%: now %state%"
# Answers to toggle. %state% is checking or dormant (with where it comes from for a bare toggle), %count% how many
# players on this instance, or on the servers named, CultAC does not check.
net-toggle-state: "&f%players%: %state%"
net-toggle-off-applied: "&f%players%: now %state% &7(%count% players not checked)"
net-toggle-on-applied: "&f%players%: now %state% &7(%count% players not checked yet; checking starts again at their next server switch or reconnect)"
net-check-applied: "&f%check% %state% &7(%players%)"
net-check-unknown: "&cno check %check% here"
# /cult net <target> update. %build% is a build number (b150) or latest with its channel, %line% the loader's install
# line, %from% and %to% the builds of the loader and of the running engine.
net-update-accepted: "&7updating to %build%: downloading and verifying..."
net-update-done: "&a%line%"
net-update-failed: "&c%line%"
net-update-not-proxy: "&7skipped: only proxies install builds"
net-update-old-loader: "&cneeds a proxy restart (loader %from% → %to%)"
net-update-canary: "%prefix% &7canary %instance% first..."
net-update-self: "%prefix% &7%instance% updates itself last"
net-update-canary-failed: "%prefix% &ccanary %instance% did not activate %build%; the rest were not updated"
# /cult findplayer [brand=<text>]: the client brands online, or the players whose brand contains the text.
# Brands, %query%, %player% and %server% show as plain text. %count% is a number of players; findplayer-unknown
# names the players whose brand is not known yet.
findplayer-summary: "%prefix% &bClient brands in use &8· &f%count% &7online &8· &7click a brand to see who uses it"
findplayer-brand: "&8» &f%brand% &7(%count%)"
findplayer-brand-hover: "&7Show who uses %brand%"
findplayer-unknown: "unknown"
findplayer-results: "%prefix% &bPlayers whose brand contains &f%query% &8· &f%count% &7online"
findplayer-player: "&8» &f%player% &7on &f%server% &8· &7%brand%"
findplayer-player-hover: "&7Show %player%'s profile"
findplayer-more: "&7...and %count% more. Type more of the brand name to narrow it down."
findplayer-none: "%prefix% &7Nobody online uses a brand containing &f%query%&7."
findplayer-usage: "%prefix% &cTo search, type &f/%command% findplayer brand=lunar &cwith any part of a brand name, or leave it out to see every brand."

# Marqueurs de schéma — voir le commentaire d'en-tête dans config.yml.
config-flavor: V2
config-version: 5
