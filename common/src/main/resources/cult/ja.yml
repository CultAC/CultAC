# CultAC 固有の設定。
cult:
  checks:
    bedrock-movement:
      # Bedrock の検証誤差がこの値に達すると違反として検出します。
      # 垂直移動の誤差と、許容範囲を超えた水平入力を含みます。
      position-flag-threshold: 0.001

      # 現在は診断情報への表示にのみ使用されます。この値によって違反が検出されることはありません。
      velocity-flag-threshold: 0.001

      # Bedrock プレイヤーの位置補正を許可します。
      # 現在は接続時に適用されるため、変更を反映するには再接続が必要です。
      enable-setbacks: true

    fair-reach:
      # FairReach の追跡更新間隔 50 ms に対して許容する時間の変動幅です。
      # 単位はミリ秒です。15 にすると更新の時間枠は 35～65 ms になります。
      max-position-packet-jitter-ms: 15

      # 対象の位置更新を適用するまでの最大待機時間です。単位はミリ秒です。
      # クライアントが受信を確認した更新は、待機時間よりも早く適用されます。
      max-ping-compensation-ms: 300

      # 対象プレイヤーの取り得る最も近い当たり判定までの距離が
      # この値を超える攻撃をキャンセルします。単位はブロックです。
      max-reach: 3.1

    autoclicker-limit:
      # この平均クリック数を超えると、オートクリッカー検出の蓄積値が増加します。
      # 単位は毎秒のクリック数で、検査対象となる腕振り 50 回ごとに計算します。
      max-cps: 25

    omni-sprint:
      # 強制再同期を行うために必要な OmniSprint の蓄積値です。
      # 検出されるたびに 1 加算されます。
      buffer-threshold: 20

      # 各移動予測の完了後に OmniSprint の蓄積値から差し引く量です。
      buffer-decay: 0.5

    explosion:
      # 爆発による位置補正には、この検査で設定されている
      # 位置補正用の違反レベルを超えていることも必要です。

      # 位置補正を試みるために必要な、爆発による移動誤差の累積値です。
      max-advantage: 1

      # 累積誤差が max-advantage に達するのを待たずに位置補正を試みるための、
      # 1 回の爆発による誤差のしきい値です。
      immediate-setback-threshold: 0.01

      # 爆発への応答の誤差が Explosion.threshold を下回った場合、
      # 累積誤差にこの値を掛けます。1 に近いほど累積誤差の減少が遅くなります。
      setback-decay-multiplier: 0.98

      # この検査で保持する爆発の累積誤差の上限です。
      max-ceiling: 2

  prediction:
    # アイテム使用中の減速に対して移動が速すぎる状態が続いた場合に、使用を停止するための蓄積値です。
    # 0 以下にすると、このハンドラーによるアイテム使用の強制停止を無効にします。
    # スロット変更時の強制停止も無効になります。
    use-item-buffer: 20

    # ノックバックへの応答を待っている間に許容する、トランザクションの応答遅延、
    # または移動パケットが届かない時間の上限です。単位はミリ秒です。
    # 遅延による位置補正の前に、固定で 50 ms の猶予が加算されます。
    max-knockback-ping-ms: 1000

    # 移動パケットが届かなくなってから、遅延による位置補正を検討するまでの時間です。
    # 単位はミリ秒です。静止し続けることが不正であるとシミュレーションで判定された場合にのみ、
    # 位置補正を行います。
    max-freeze-time-ms: 5000

  networking:
    # パケットのバンドルに対応したクライアントで、バンドル境界を使って
    # リーチ検査用のエンティティ追跡を同期します。
    reach-use-bundle-delimiter: true

    # 他の生きているエンティティについて通知する体力を 1 HP に置き換えます。
    # 受信側プレイヤー自身の体力、現在の乗り物、および死亡したエンティティは変更しません。
    # cult.showhealth 権限を持つプレイヤーには実際の体力を送信します。
    spoof-health: false

  client-brand:
    # 受信したクライアントブランドから、この正規表現に最初に一致した部分を削除します。
    # 既定では末尾の " (Velocity)" を削除します。
    # 空文字列にすると無効になります。
    strip-pattern: ' \(Velocity\)$'

  diagnostics:
    # 現在は未使用です。この値を変更しても詳細アラートは自動的に有効になりません。
    auto-enable-verbose: false

    # テレポート、位置補正、再同期の診断情報をコンソールに出力します。
    teleports: false

    bedrock-movement:
      # Bedrock の詳細な移動レポートと関連する予測ログを有効にします。
      # 以下のフィルターと最小間隔が適用されます。
      enabled: false

      # 違反が検出されていない移動でも、検証誤差が min-offset に達した場合は
      # レポートに含めます。
      log-clean-offsets: false

      # 違反が検出されていない移動を報告するための、検証誤差の最小値です。
      # log-clean-offsets が true の場合にのみ使用されます。
      min-offset: 1.0e-7

      # 各プレイヤーの Bedrock 移動レポートの最小送信間隔です。単位は秒です。
      # 0 にすると待機時間をなくします。
      cooldown-seconds: 10

# スキーマ識別子です。変更しないでください。
config-flavor: V2
config-version: 1
