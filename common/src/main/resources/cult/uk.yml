# Налаштування, специфічні для CultAC.
cult:
  checks:
    bedrock-movement:
      # Фіксувати порушення, коли відхилення під час перевірки Bedrock досягає цього значення.
      # Враховуються помилка вертикального руху та надлишковий горизонтальний ввід.
      position-flag-threshold: 0.001

      # Зсувати позицію симуляції наступного тіку до позиції, яку повідомив клієнт,
      # не більше ніж на цю відстань за тік руху. Встановіть 0, щоб вимкнути.
      position-reconciliation-step: 0.0005

      # Зараз лише відображається в діагностиці; це значення не викликає спрацювань.
      velocity-flag-threshold: 0.001

      # Дозволити коригувальні відкати позиції для гравців Bedrock.
      # Зараз застосовується під час підключення; щоб зміни набули чинності, потрібно перепідключитися.
      enable-setbacks: true

    fair-reach:
      # Допустиме відхилення часу від інтервалу відстеження FairReach у 50 мс.
      # У мілісекундах; значення 15 дає вікно 35–65 мс.
      max-position-packet-jitter-ms: 15

      # Максимальне очікування перед застосуванням оновлення позиції цілі, у мілісекундах.
      # Оновлення, які клієнт підтвердив, застосовуються раніше.
      max-ping-compensation-ms: 300

      # Скасовувати атаки на гравців, найближчий можливий хітбокс яких далі, ніж ванільна
      # дальність гравця, що атакує (entity_interaction_range) плюс ця відстань, у блоках.
      reach-leniency: 0.1

    autoclicker-limit:
      # Середня кількість кліків за секунду, вище якої зростає буфер перевірки автоклікера.
      # Обчислюється за групами з 50 взмахів руки, які враховує перевірка.
      max-cps: 25

    omni-sprint:
      # Накопичене значення буфера OmniSprint, потрібне для примусової ресинхронізації.
      # Кожне виявлення додає 1 до буфера.
      buffer-threshold: 20

      # Скільки віднімається від буфера OmniSprint після кожного передбачення.
      buffer-decay: 0.5

    explosion:
      # Для відкату позиції через вибухи також потрібно перевищити
      # рівень порушень для відкату, заданий у цій перевірці.

      # Накопичена помилка руху від вибухів, потрібна для спроби відкату позиції.
      max-advantage: 1

      # Помилка від одного вибуху, потрібна для спроби відкату позиції
      # без очікування, поки накопичена помилка досягне max-advantage.
      immediate-setback-threshold: 0.01

      # Множити накопичену помилку на це значення, коли реакція на вибух
      # опускається нижче Explosion.threshold. Значення ближче до 1 зменшують її повільніше.
      setback-decay-multiplier: 0.98

      # Максимальна накопичена помилка від вибухів, яку зберігає перевірка.
      max-ceiling: 2

  prediction:
    # Стосується лише руху; перевищення цієї частки ніколи не додає порушень за чити.
    # Історія зберігається при припиненні й відновленні використання предмета та при відкатах позиції.
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # Порівнює реальний час, який сервер провів у використанні предмета (їжа, пиття,
    # натягування), з уповільненими тіками клієнта, заявленими за цей час. Борг понад
    # max-debt-ticks викликає спрацювання ItemUseBurst; значення за замовчуванням покриває
    # один запізнілий кадр клієнта (10 тіків) плюс округлення. Кредит дають лише зайві уповільнені тіки.
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # Відсоток кожного очікуваного тіку використання, який має бути оплачений уповільненим тіком.
      charge-percent: 95

    # Максимальний пінг транзакцій або тиша пакетів руху, яку допускають,
    # поки очікується відкидання (knockback), у мілісекундах.
    # Перед відкатом через затримку додається фіксований запас 50 мс.
    max-knockback-ping-ms: 1000

    # Час без пакетів руху, після якого перевіряється потреба у відкаті через затримку,
    # у мілісекундах. Відкат відбувається, лише якщо симуляція показує, що
    # стояти на місці гравець не міг.
    max-freeze-time-ms: 5000

  networking:
    # Замінювати здоров'я інших живих сутностей, яке бачить гравець, на 1 HP.
    # Не змінює власне здоров'я гравця, його поточного транспорту та мертвих сутностей.
    # Гравці з дозволом cult.showhealth отримують справжні значення здоров'я.
    spoof-health: false

  client-brand:
    # Видаляти перший збіг цього регулярного виразу з отриманих брендів клієнтів.
    # За замовчуванням видаляє суфікс " (Velocity)" у кінці.
    # Встановіть порожній рядок, щоб вимкнути.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:
    # Зараз не використовується: зміна цього значення не вмикає автоматично детальні сповіщення.
    auto-enable-verbose: false

    # Виводити в консоль діагностику телепортів, відкатів і ресинхронізацій.
    teleports: false

    bedrock-movement:
      # Увімкнути детальні звіти про рух Bedrock і пов'язані з ними
      # логи передбачень з урахуванням фільтрів і затримки нижче.
      enabled: false

      # Також звітувати про рухи без спрацювань, відхилення яких
      # досягає min-offset.
      log-clean-offsets: false

      # Мінімальне відхилення для звітів про рухи без спрацювань.
      # Використовується, лише якщо log-clean-offsets дорівнює true.
      min-offset: 1.0e-7

      # Мінімальний інтервал між звітами про рух Bedrock для кожного гравця,
      # у секундах. Встановіть 0, щоб прибрати затримку.
      cooldown-seconds: 10

# Маркери схеми. Не змінюйте.
config-flavor: V2
config-version: 3
