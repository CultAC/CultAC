# Настройки, добавленные в CultAC.
cult:
  checks:
    bedrock-movement:
      # Регистрировать нарушение, когда отклонение при проверке Bedrock достигает этого значения.
      # Учитываются ошибка вертикального движения и превышение допустимого горизонтального ввода.
      position-flag-threshold: 0.001

      # Сейчас значение только выводится в диагностике и не вызывает регистрации нарушений.
      velocity-flag-threshold: 0.001

      # Разрешить коррекцию позиции игроков Bedrock.
      # Сейчас применяется при подключении; для применения изменений нужно переподключиться.
      enable-setbacks: true

    fair-reach:
      # Допустимое отклонение времени от интервала отслеживания FairReach в 50 мс.
      # В миллисекундах; значение 15 задаёт окно 35–65 мс.
      max-position-packet-jitter-ms: 15

      # Максимальное ожидание перед применением обновления позиции цели, в миллисекундах.
      # Подтверждённые клиентом обновления применяются раньше.
      max-ping-compensation-ms: 300

      # Отменять атаки на игроков, если расстояние до их ближайшего возможного хитбокса
      # превышает это значение, в блоках.
      max-reach: 3.1

    autoclicker-limit:
      # Среднее число кликов в секунду, выше которого растёт буфер проверки автокликера.
      # Вычисляется по группам из 50 учитываемых проверкой взмахов руки.
      max-cps: 25

    omni-sprint:
      # Значение накопленного буфера OmniSprint, необходимое для принудительной синхронизации.
      # Каждое обнаружение добавляет 1 к буферу.
      buffer-threshold: 20

      # Значение, вычитаемое из буфера OmniSprint после каждого предсказания.
      buffer-decay: 0.5

    explosion:
      # Для коррекции позиции из-за взрывов также требуется превысить
      # уровень нарушений, заданный для коррекции в этой проверке.

      # Накопленная ошибка движения от взрывов, необходимая для попытки коррекции позиции.
      max-advantage: 1

      # Ошибка от одного взрыва, необходимая для попытки коррекции позиции
      # без ожидания, пока накопленная ошибка достигнет max-advantage.
      immediate-setback-threshold: 0.01

      # Умножать накопленную ошибку на это значение, когда отклонение реакции на взрыв
      # ниже Explosion.threshold. Значения ближе к 1 уменьшают ошибку медленнее.
      setback-decay-multiplier: 0.98

      # Максимальная накопленная ошибка взрывов, сохраняемая проверкой.
      max-ceiling: 2

  prediction:
    # Размер буфера, при котором использование предмета прекращается, если движение остаётся
    # слишком быстрым для положенного замедления. Значения <= 0 отключают принудительное
    # прекращение использования этим обработчиком, в том числе при смене слота.
    use-item-buffer: 20

    # Максимальный допустимый пинг транзакций или период без пакетов движения,
    # пока ожидается реакция на отбрасывание, в миллисекундах.
    # Перед коррекцией из-за задержки добавляется фиксированный запас в 50 мс.
    max-knockback-ping-ms: 1000

    # Время без пакетов движения до проверки необходимости коррекции из-за задержки,
    # в миллисекундах. Коррекция применяется, только если симуляция показывает,
    # что оставаться неподвижным было недопустимо.
    max-freeze-time-ms: 5000

  networking:
    # Использовать границы пакетов-групп для синхронизации отслеживания сущностей
    # при проверке дальности атаки у клиентов с поддержкой группировки пакетов.
    reach-use-bundle-delimiter: true

    # Заменять передаваемое здоровье других живых сущностей на 1 единицу здоровья.
    # Не менять здоровье наблюдателя, его текущего ездового существа и мёртвых сущностей.
    # Наблюдатели с cult.showhealth получают реальные значения здоровья.
    spoof-health: false

  client-brand:
    # Удалять первое совпадение этого регулярного выражения из полученных названий клиентов.
    # По умолчанию удаляется суффикс " (Velocity)" в конце строки.
    # Для отключения укажите пустую строку.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:
    # Сейчас не используется: изменение значения не включает подробные оповещения автоматически.
    auto-enable-verbose: false

    # Выводить в консоль диагностику телепортаций, коррекций позиции и повторной синхронизации.
    teleports: false

    bedrock-movement:
      # Включить подробные отчёты о движении Bedrock и связанные журналы предсказаний
      # с учётом фильтров и минимального интервала ниже.
      enabled: false

      # Также сообщать о движениях без нарушений, у которых отклонение при проверке
      # достигает min-offset.
      log-clean-offsets: false

      # Минимальное отклонение при проверке для отчётов о движениях без нарушений.
      # Используется только при log-clean-offsets: true.
      min-offset: 1.0e-7

      # Минимальный интервал между отчётами о движении Bedrock для каждого игрока, в секундах.
      # Укажите 0, чтобы убрать интервал ожидания.
      cooldown-seconds: 10

# Маркеры схемы. Не изменяйте.
config-flavor: V2
config-version: 1
