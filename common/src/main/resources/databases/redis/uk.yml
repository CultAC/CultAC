# ===========================================================================
#  Налаштування бекенду Redis.
#
#  Redis — насамперед сховище в оперативній пам'яті: якщо ви направляєте
#  туди історію, переконайтеся, що на сервері ввімкнене збереження AOF,
#  інакше історія зникне після перезапуску. Під час роботи потрібен Jedis;
#  якщо Jedis немає, бекенд вимикається, а routing переходить на запасний
#  варіант.
#
#  Не рекомендується як основне сховище історії. Призначений для
#  адміністраторів, у яких є лише Redis і потрібне хоч якесь робоче рішення.
# ===========================================================================

# Усі ключі знаходяться під `redis:`, щоб простір імен цього файлу не
# конфліктував із сусідніми файлами інших бекендів, коли Configuralize
# об'єднує їх в один спільний простір імен.
redis:
  host: "localhost"
  port: 6379

  # Номер логічної бази даних (за замовчуванням 0-15).
  database: 0

  # Необов'язкові облікові дані ACL. Залиште порожніми для Redis без автентифікації.
  user: ""
  password: ""

  # Додається на початок кожного ключа, який записує цей бекенд. Корисно, якщо
  # екземпляр Redis використовують інші застосунки. Залиште порожнім, щоб не додавати префікс.
  key-prefix: ""

  timeout-ms: 2000
  batch-flush-cap: 256

  # Якщо true, під час запуску в лог виводиться попередження, коли на цей
  # бекенд направлено історію порушень/сесій. Встановіть false, щоб вимкнути
  # попередження, після того як переконаєтеся, що збереження налаштоване.
  warn-on-history: true

  # Перевизначення просторів імен ключів. Використовуються як сегменти
  # префікса ключів (у Redis немає таблиць). Нижче — назви за замовчуванням.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Маркери схеми — див. заголовний коментар у config.yml.
config-flavor: V2
config-version: 1
