# ===========================================================================
#  Налаштування бекенду MongoDB.
#
#  Під час роботи потрібен синхронний драйвер MongoDB; якщо його немає,
#  бекенд вимикається сам, а routing переходить на запасний варіант.
# ===========================================================================

# Усі ключі знаходяться під `mongo:`, щоб простір імен цього файлу не
# конфліктував із сусідніми файлами інших бекендів, коли Configuralize
# об'єднує їх в один спільний простір імен.
mongo:
  # Рядок підключення MongoDB. Облікові дані кодуються в URL за стандартом
  # драйвера (mongodb://user:pass@host:port/?authSource=admin).
  connection-string: "mongodb://localhost:27017"

  # База даних для запису. Колекції всередині неї задаються блоком
  # `tables:` нижче.
  database: "cult"

  # Розмір bulkWrite() для кожного обробника. Драйвер Mongo сам керує пулом
  # з'єднань, тож цей параметр визначає пакетування записів, а не кількість
  # з'єднань.
  batch-flush-cap: 256

  # Перевизначення назв колекцій. Нижче — назви за замовчуванням.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Маркери схеми — див. заголовний коментар у config.yml.
config-flavor: V2
config-version: 1
