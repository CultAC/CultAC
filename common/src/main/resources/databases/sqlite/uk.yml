# ===========================================================================
#  Налаштування бекенду SQLite.
#
#  SQLite підходить лише для одного сервера. Для мережевих конфігурацій
#  перемкніть routing у database.yml на бекенд, що працює зі спільною
#  базою даних.
# ===========================================================================

# Усі ключі знаходяться під `sqlite:`, щоб простір імен цього файлу не
# конфліктував із сусідніми файлами інших бекендів (mysql:, postgres:,
# mongo:, redis:), коли Configuralize об'єднує їх в один спільний простір імен.
sqlite:
  # Шлях до файлу бази даних SQLite. Якщо шлях не абсолютний, він
  # відраховується від папки даних плагіна. Старий файл
  # `data/violations.sqlite` залишається недоторканим як страховка; це
  # новий файл, а не ALTER старого.
  path: "data/history.v1.db"

  # Режим WAL дозволяє паралельним читачам працювати одночасно із записом —
  # це критично для серверного плагіна, який читає /cult history під час
  # запису порушень.
  journal-mode: WAL

  # NORMAL — розумний баланс між надійністю запису та пропускною здатністю
  # в режимі WAL. FULL подвоює надійність ціною пропускної здатності.
  # OFF небезпечний.
  synchronous-mode: NORMAL

  # Скільки SQLite чекає на блокування, перш ніж здатися. Обробник записує
  # це в лог і відкидає подію при BackendException; збільшення значення
  # зменшує зайві відкидання на перевантажених дисках.
  busy-timeout-ms: 5000

  # Розмір кешу сторінок (у сторінках). Стандартний розмір сторінки SQLite —
  # 4096 байт, тож 10000 сторінок ≈ 40 МБ. Збільшіть для великих історій.
  cache-pages: 10000

  # Межа пакетного запису для кожного обробника. Кожен ring-обробник збирає
  # події в пакет PreparedStatement і фіксує його на endOfBatch АБО коли
  # пакет досягає цієї межі — залежно від того, що настане раніше. Більші
  # значення жертвують затримкою заради пропускної здатності при тривалих
  # сплесках.
  batch-flush-cap: 256

# Маркери схеми — див. заголовний коментар у config.yml.
config-flavor: V2
config-version: 1
