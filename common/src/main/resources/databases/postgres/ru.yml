# ===========================================================================
#  Настройки бекенда Postgres.
#
#  Postgres поддерживает мультисерверные развёртывания (несколько
#  экземпляров Cult пишут в одну центральную БД). Требует драйвер JDBC
#  Postgres в рантайме; если драйвера нет, бекенд сам отключается на
#  старте, а маршрут, ссылавшийся сюда, переключается на запасной.
# ===========================================================================

# Все ключи лежат под `postgres:`, чтобы пространство имён этого файла не
# конфликтовало с соседними файлами других бекендов, когда Configuralize
# объединяет их в общий namespace.
postgres:
  host: "localhost"
  port: 5432
  database: "cult"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Cult instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Дополнительные URL-параметры, дописываемые после `?`. Оставьте
  # пустым, если нет специфической необходимости.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Переопределения имён таблиц. Значения по умолчанию ниже.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Маркеры схемы — см. шапку config.yml.
config-flavor: V2
config-version: 2
