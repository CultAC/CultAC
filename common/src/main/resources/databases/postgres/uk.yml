# ===========================================================================
#  Налаштування бекенду Postgres.
#
#  Postgres підтримує мережеві конфігурації (кілька екземплярів Cult
#  пишуть в одну центральну БД). Під час роботи потрібен JDBC-драйвер
#  Postgres; якщо драйвера немає, бекенд вимикається під час запуску,
#  а routing, що вказував на цей бекенд, переходить на запасний варіант.
# ===========================================================================

# Усі ключі знаходяться під `postgres:`, щоб простір імен цього файлу не
# конфліктував із сусідніми файлами інших бекендів, коли Configuralize
# об'єднує їх в один спільний простір імен.
postgres:
  host: "localhost"
  port: 5432
  database: "cult"
  user: "postgres"
  password: ""

  # Налаштування пулу з'єднань HikariCP. Діють лише для SQL-бекендів,
  # які використовують Hikari всередині.
  pool-settings:
    # Максимальна кількість фізичних з'єднань з БД, які цей екземпляр Cult може тримати відкритими.
    maximum-pool-size: 5
    # Мінімальна кількість неактивних з'єднань, які тримаються готовими. Залиште рівним
    # maximum-pool-size для пулу фіксованого розміру або зменшіть, якщо у вашої БД жорсткі ліміти.
    minimum-idle: 5
    # Закривати з'єднання через стільки мілісекунд. 1800000 — стандартні для Hikari
    # 30 хвилин; ставте 0, лише якщо часом життя з'єднань керує ваша БД або проксі.
    maximum-lifetime-ms: 1800000
    # Періодично пінгувати неактивні з'єднання. 0 вимикає keepalive.
    keepalive-time-ms: 0
    # Скільки максимально чекати на з'єднання з пулу, перш ніж повернути помилку.
    connection-timeout-ms: 5000

  # Додаткові параметри URL, які додаються після `?`. Залиште порожнім, якщо
  # вам не потрібно щось конкретне.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Перевизначення назв таблиць. Нижче — назви за замовчуванням.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Маркери схеми — див. заголовний коментар у config.yml.
config-flavor: V2
config-version: 2
