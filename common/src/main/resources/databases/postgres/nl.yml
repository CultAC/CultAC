# ===========================================================================
#  Postgres-backendinstellingen.
#
#  Postgres ondersteunt multi-server-deployments (meerdere Cult-instances
#  die naar één centrale DB schrijven). Vereist het Postgres JDBC-stuur-
#  programma in runtime; als de driver ontbreekt, schakelt het backend
#  zichzelf uit bij het starten en valt routing dat hierheen wees terug op
#  zijn fallback.
# ===========================================================================

# Alle sleutels staan onder `postgres:` zodat de keyspace van dit bestand
# niet botst met zustertbestanden per backend wanneer Configuralize ze
# samenvoegt in één globale namespace.
postgres:
  host: "localhost"
  port: 5432
  database: "cult"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Cult instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Extra URL-parameters die na `?` worden toegevoegd. Laat leeg tenzij je
  # iets specifieks nodig hebt.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Overrides voor tabelnamen. Defaults hieronder.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Schemamarkers — zie de header-comment in config.yml.
config-flavor: V2
config-version: 2
