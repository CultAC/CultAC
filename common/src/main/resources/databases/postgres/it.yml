# ===========================================================================
#  Impostazioni del backend Postgres.
#
#  Postgres supporta deployment multi-server (più istanze Cult che
#  scrivono in un DB centrale). Richiede il driver JDBC Postgres a
#  runtime; se manca, il backend si disabilita all'avvio e il routing che
#  puntava qui ricade sul suo fallback.
# ===========================================================================

# Tutte le chiavi vivono sotto `postgres:` così il keyspace di questo file
# non collide con i file fratelli per backend quando Configuralize li
# unisce in un namespace globale.
postgres:
  host: "localhost"
  port: 5432
  database: "cult"
  user: "postgres"
  password: ""

  # HikariCP connection pool settings. These only apply to SQL backends
  # that use Hikari internally.
  pool-settings:
    # Maximum physical database connections this Cult instance can keep open.
    maximum-pool-size: 5
    # Minimum idle connections kept warm. Keep equal to maximum-pool-size
    # for a fixed-size pool, or lower it if your database has tight limits.
    minimum-idle: 5
    # Retire connections after this many milliseconds. 1800000 is Hikari's
    # default 30 minutes; use 0 only if your database/proxy handles lifetime.
    maximum-lifetime-ms: 1800000
    # Periodically ping idle connections. 0 disables keepalive.
    keepalive-time-ms: 0
    # Maximum time to wait for a connection from the pool before failing.
    connection-timeout-ms: 5000

  # Parametri URL extra appesi dopo `?`. Lascia vuoto se non hai bisogno
  # di qualcosa di specifico.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Override dei nomi tabella. Default sotto.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Marcatori di schema — vedi il commento di intestazione in config.yml.
config-flavor: V2
config-version: 2
