# ===========================================================================
#  Налаштування бекенду MySQL.
#
#  MySQL підтримує мережеві конфігурації (кілька екземплярів Cult пишуть
#  в одну центральну БД). Під час роботи потрібен драйвер MySQL Connector/J;
#  якщо драйвера немає, бекенд вимикається під час запуску й записує в лог
#  зрозумілу помилку, а routing, що вказував на цей бекенд, переходить на
#  інший налаштований варіант.
# ===========================================================================

# Усі ключі знаходяться під `mysql:`, щоб простір імен цього файлу не
# конфліктував із сусідніми файлами інших бекендів (sqlite:, postgres:,
# mongo:, redis:), коли Configuralize об'єднує їх в один спільний простір імен.
mysql:
  # Куди підключатися.
  host: "localhost"
  port: 3306
  database: "cult"
  user: "root"
  password: ""

  # Налаштування пулу з'єднань HikariCP. Діють лише для SQL-бекендів,
  # які використовують Hikari всередині.
  pool-settings:
    # Максимальна кількість фізичних з'єднань з БД, які цей екземпляр Cult може тримати відкритими.
    maximum-pool-size: 10
    # Мінімальна кількість неактивних з'єднань, які тримаються готовими. Залиште рівним
    # maximum-pool-size для пулу фіксованого розміру або зменшіть, якщо у вашої БД жорсткі ліміти.
    minimum-idle: 10
    # Закривати з'єднання через стільки мілісекунд. 1800000 — стандартні для Hikari
    # 30 хвилин; ставте 0, лише якщо часом життя з'єднань керує ваша БД або проксі.
    maximum-lifetime-ms: 1800000
    # Періодично пінгувати неактивні з'єднання. 0 вимикає keepalive.
    keepalive-time-ms: 0
    # Скільки максимально чекати на з'єднання з пулу, перш ніж повернути помилку.
    connection-timeout-ms: 5000

  # Додаткові параметри URL, які додаються після стандартного набору
  # (useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true).
  # Залиште порожнім, якщо вам не потрібно щось конкретне — стандартні значення
  # підходять для локальної тестової установки.
  extra-jdbc-params: ""

  # Межа пакетного запису для кожного обробника. Кожен ring-обробник збирає
  # події в пакет PreparedStatement і фіксує його на endOfBatch АБО коли пакет
  # досягає цієї межі — залежно від того, що настане раніше. Більші значення
  # жертвують затримкою заради пропускної здатності при тривалих сплесках.
  batch-flush-cap: 256

  # Перевизначення назв таблиць. Перейменуйте будь-яке з шести логічних
  # сховищ, щоб кілька екземплярів Cult могли ділити одну базу MySQL або щоб
  # відповідати наявній схемі іменування. Нижче — значення за замовчуванням.
  tables:
    meta: cult_meta
    checks: cult_checks
    players: cult_players
    sessions: cult_sessions
    violations: cult_violations
    settings: cult_settings

# Маркери схеми — див. заголовний коментар у config.yml.
config-flavor: V2
config-version: 2
