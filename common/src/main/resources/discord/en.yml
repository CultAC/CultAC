# For help with webhooks: https://support.discord.com/hc/en-us/articles/228383668

enabled: false
webhook: ""
# Set to true to bypass Discord's webhook URL format validation.
# This allows any valid HTTPS URL (useful for proxies or Matrix forwarders).
disable-webhook-validation: false
embed-title: "%player% has been detected for %check% [%violations%]"
embed-color: "#00FFFF"
include-timestamp: true
# The footer under the alert, and the icon beside it (an image URL, empty for none).
embed-footer-text: "%uuid% v%cult_version%"
embed-footer-url: ""
# The image at the top right of the alert; %uuid% is the flagged player.
embed-thumbnail-url: "https://crafthead.net/helm/%uuid%"
# Adds a "State" field with the client state Cult tracks at the alert (game mode, sprint, held items, ...),
# unless violation-content places %state%, which lists only the entries that are set.
include-state: true
# Replaces backticks in values (like client brands) so they don't break Discord's text formatting.
# Set to "`" to disable this replacement.
backtick-replacement-char: "ˋ" # Defaults to U+02CB
violation-content:
    - "**Version**: `%version%` **Brand**: `%brand%`"
    - "**Server**: `%server%` **World**: `%world%` **Location**: `%location%`"
    - "**TPS**: `%tps%` **Ping**: `%ping%/%keepalive_ping%` **Clock**: `%clock_behind%ms` **Time**: `%session_time%`"
    - "**xsens**: `%h_sensitivity%%` **ysens**: `%v_sensitivity%%`"
    - "**State**: %state%"
    - "**Checks**: %checks%"
    - "**Verbose**: %verbose%"

# Schema markers — see header comment in config.yml.
config-flavor: V2
config-version: 4
