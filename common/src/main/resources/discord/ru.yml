# Справка по вебхукам: https://support.discord.com/hc/ru/articles/228383668
enabled: false
webhook: ""
# Установите значение `true`, чтобы обойти проверку формата URL Discord.
# Это разрешает любой действительный HTTPS URL (полезно для прокси или Matrix forwarder).
disable-webhook-validation: false
embed-title: "%player% обнаружен проверкой %check% [%violations%]"
embed-color: "#00FFFF"
include-timestamp: true
# The footer under the alert, and the icon beside it (an image URL, empty for none).
embed-footer-text: "%uuid% v%cult_version%"
embed-footer-url: ""
# The image at the top right of the alert; %uuid% is the flagged player.
embed-thumbnail-url: "https://crafthead.net/helm/%uuid%"
# Adds a "State" field with the client state Cult tracks at the alert (game mode, sprint, held items, ...),
# unless violation-content places %state%, which lists only the entries that are set.
include-state: true
# Заменяет обратные кавычки (`) в значениях (например, в названиях клиентов), чтобы не нарушать форматирование текста в Discord.
# Установите значение "`", чтобы отключить эту замену.
backtick-replacement-char: "ˋ"
violation-content:
    - "**Версия**: `%version%` **Бренд**: `%brand%`"
    - "**Сервер**: `%server%` **Мир**: `%world%` **Позиция**: `%location%`"
    - "**TPS**: `%tps%` **Пинг**: `%ping%/%keepalive_ping%` **Часы**: `%clock_behind%ms` **Время**: `%session_time%`"
    - "**xsens**: `%h_sensitivity%%` **ysens**: `%v_sensitivity%%`"
    - "**Состояние**: %state%"
    - "**Проверки**: %checks%"
    - "**Подробности**: %verbose%"

# Маркеры схемы — см. шапку config.yml.
config-flavor: V2
config-version: 4
