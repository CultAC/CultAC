# Ajuda com webhooks: https://support.discord.com/hc/pt-br/articles/228383668
enabled: false
webhook: ""
# Defina como `true` para ignorar a validação de formato de URL do Discord.
# Isso permite qualquer URL HTTPS válida (útil para proxies ou encaminhadores do Matrix).
disable-webhook-validation: false
embed-title: "%player% foi detectado por %check% [%violations%]"
embed-color: "#00FFFF"
include-timestamp: true
# The footer under the alert, and the icon beside it (an image URL, empty for none).
embed-footer-text: "v%cult_version%"
embed-footer-url: ""
# The image at the top right of the alert; %uuid% is the flagged player.
embed-thumbnail-url: "https://crafthead.net/helm/%uuid%"
# Adds a "State" field with the client state Cult tracks at the alert (game mode, sprint, held items, ...),
# unless violation-content places %state%, which lists only the entries that are set.
include-state: true
# Substitui as aspas invertidas (`) nos valores (como marcas de clientes) para evitar a quebra de formatação de texto do Discord.
# Defina como "`" para desativar esta substituição.
backtick-replacement-char: "ˋ"
violation-content:
    - "**Jogador**: `%player%`"
    - "**UUID**: `%uuid%`"
    - "**Verificação**: `%check%`"
    - "**Versão do Cliente**: `%version%`"
    - "**Marca do Cliente**: `%brand%`"
    - "**Sensibilidade**: `H %h_sensitivity%% / V %v_sensitivity%%`"
    - "**Ping**: `%ping%`"
    - "**TPS**: `%tps%`"
    - "**Servidor**: `%server%`"
    - "**Mundo**: `%world% (%world_type%)`"

# Marcadores de esquema — ver o comentário do cabeçalho em config.yml.
config-flavor: V2
config-version: 5
