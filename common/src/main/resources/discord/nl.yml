# Hulp bij webhooks: https://support.discord.com/hc/nl/articles/228383668
enabled: false
webhook: ""
# Stel in op `true` om de URL-formaatcontrole van Discord te omzeilen.
# Dit staat elke geldige HTTPS-URL toe (handig voor proxy's of Matrix-forwarders).
disable-webhook-validation: false
embed-title: "%player% is gedetecteerd voor %check% [%violations%]"
embed-color: "#00FFFF"
include-timestamp: true
# The footer under the alert, and the icon beside it (an image URL, empty for none).
embed-footer-text: "%uuid% v%cult_version%"
embed-footer-url: ""
# The image at the top right of the alert; %uuid% is the flagged player.
embed-thumbnail-url: "https://crafthead.net/helm/%uuid%"
# Adds a "State" field with the client state Cult tracks at the alert (game mode, sprint, held items, ...),
# unless violation-content places %state%, which lists only the entries that are set.
include-state: true
# Vervangt backticks (`) in waarden (zoals clientmerken) om te voorkomen dat de tekstopmaak van Discord breekt.
# Stel in op "`" om deze vervanging uit te schakelen.
backtick-replacement-char: "ˋ"
violation-content:
    - "**Versie**: `%version%` **Merk**: `%brand%`"
    - "**Server**: `%server%` **Wereld**: `%world%` **Locatie**: `%location%`"
    - "**TPS**: `%tps%` **Ping**: `%ping%/%keepalive_ping%` **Klok**: `%clock_behind%ms` **Tijd**: `%session_time%`"
    - "**xsens**: `%h_sensitivity%%` **ysens**: `%v_sensitivity%%`"
    - "**Status**: %state%"
    - "**Controles**: %checks%"
    - "**Details**: %verbose%"

# Schemamarkers — zie de header-comment in config.yml.
config-flavor: V2
config-version: 4
