# CultAC configuratie
# Broncode: https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside en bijdragers, gelicentieerd onder GPLv3.
# Gewijzigde binaire bestanden, of plugins met gekopieerde Cult code, moeten privé zijn,
# of met volledige broncode beschikbaar voor kopers zonder extra kosten.

alerts:
    # Moeten er naast het uitzenden van waarschuwingen naar spelers ook waarschuwingen naar de console worden gestuurd?
    print-to-console: true
    # Dit bepaalt of/hoe waarschuwingen worden gedeeld tussen servers die zijn verbonden met je proxy.
    # Je moet 'bungee-plugin-message-channel' ingeschakeld hebben in je Velocity-configuratie als Velocity in gebruik is.
    proxy:
        # Moeten er waarschuwingen worden verzonden naar andere servers die verbonden zijn met je proxy?
        send: false
        # Moeten de waarschuwingen die worden ontvangen van andere servers worden aangekondigd op deze server?
        receive: false
    # Meldingsbereik voor staff die er geen koos met /cult alerts server|global: server of global.
    # global geldt alleen als netwerkbrede meldingen aan staan; anders wordt server gebruikt.
    default-scope: server

verbose:
    print-to-console: false

client-brand:
    # Dit betekent dat het merk niet wordt uitgezonden naar operators als het merk overeenkomt met de volgende regexen
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Verberg alle toeschouwers met de cult.spectator-toestemming, ongeacht of ze daadwerkelijk actief toeschouwer zijn
    hide-regardless: false
    # Maakt toeschouwers alleen verborgen in deze werelden, houdt leeg om alle werelden toe te laten
    allowed-worlds:
        - ""

# Hoe lang moeten spelers hebben voordat we ze schoppen voor timing-out? Standaard = 60 seconden
max-transaction-time: 60

# Als CultAC zelf faalt (het kan zich niet aan een speler koppelen of de clientversie wordt niet ondersteund),
# speelt de speler ongecontroleerd verder in plaats van verbroken te worden. Kicks voor pakketfloods,
# crash-exploits en pings die niet binnen max-transaction-time worden beantwoord blijven gelden.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Moet de standaard block resynchronization handler worden uitgeschakeld?
# Standaard leest Cult blokken van de serverwereld en stuurt ze naar de client om desync op te lossen.
# Als je plugins gebruikt die neppe packet-based blokken maken (die niet in de serverwereld bestaan),
# moet je dit op true zetten om te voorkomen dat Cult ze overschrijft met lucht/echte blokken.
# Dit forceert het gebruik van een "NoOp" (No Operation) handler tenzij er een aangepaste via de API wordt geleverd.
disable-default-resync-handler: false

# Moet het dubbele bewegingspakket worden geannuleerd?
# Mojang heeft dit probleem opgelost in 1.21. Dit was hun poging om de "bucket desync" op te lossen. https://bugs.mojang.com/browse/MC-12363
# Deze instelling geldt alleen voor 1.17-1.20.5 clients op 1.8 servers
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # Met hoeveel moeten we het totale voordeel vermenigvuldigen als de speler legitiem is?
    # Zo ziet de standaardconfiguratie eruit (x-as = seconden, y-as = 1/1000 blok): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Hoe groot moet de afwijking van de beweging van de speler zijn?
    # Gemeten in blokken van de mogelijke beweging
    # We houden rekening met Optifine door trig-tabellen te verwisselen, maar door dit te verlagen naar 0,001 zal FastMath
    # zal ervoor zorgen dat Cult wordt gemarkeerd als deze compensatie niet werkt...
    threshold: 0.001
    # Hoe groot is de overtreding in een tick voordat de speler onmiddellijk een terugslag krijgt?
    # -1 om uit te schakelen
    immediate-setback-threshold: 0.1
    # Hoe groot is het voordeel ten opzichte van alle teken voordat we een terugslag krijgen?
    # -1 om uit te schakelen
    max-advantage: 1
    # Na 50 seconden met de standaardinstellingen zal de speler van 4 blokken -> 1 blok voordeel gaan
    # Dit is om te voorkomen dat de speler te veel schendingen verzamelt en ze nooit allemaal kan opruimen
    # Standaard voordelenplatform (x-as = seconden, y-as = 1/1000 blok): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Drempelwaarde voor het schendingenniveau voor de terugslag
    # 1 voor het oude gedrag
    setback-violation-threshold: 1

# Controleert of een speler een blok is binnengegaan tijdens een beweging
Phase:
    setbackvl: 1 # Glitching in blokken kan muurklimmen mogelijk maken, plus deze controle is relatief stabiel
    decay: 0.005

# Op voorspelling gebaseerde NoSlow-controle
# Cult is verantwoordelijk voor buggy netcode hier... moeilijk om vals te spelen, zelfs als je met rechts klikt en de offhand-knop spamt
# Veel stabieler dan andere anticheats, maar rapporteer alsjeblieft alle falses... Ik heb hier een heleboel netcode-problemen opgelost.
NoSlow:
    # Hoeveel van een offset is "valsspelen"?
    # Standaard is dit lager dan andere offs
    # Flaggen met 0.03-0.2 consequent met NoSlow aan
    threshold: 0.001
    # Snel terugzetten op het eerste item om elk voordeel dat NoSlow geeft te verwijderen
    setbackvl: 5
    # Verval treedt op wanneer de speler een voorwerp gebruikt EN erdoor wordt vertraagd
    decay: 0.05

Knockback:
    # Met hoeveel moeten we het totale voordeel vermenigvuldigen als de speler legitiem is?
    setback-decay-multiplier: 0.999
    # Hoe groot moet de afwijking van de snelheid van de speler zijn?
    # Gemeten in blokken van de mogelijke snelheid
    threshold: 0.001
    # Hoe groot is de overtreding in een tick voordat de speler onmiddellijk een terugslag krijgt?
    # -1 om uit te schakelen
    immediate-setback-threshold: 0.1
    # Hoe groot is het voordeel ten opzichte van alle teken voordat we een terugslag krijgen?
    # -1 om uit te schakelen
    max-advantage: 1
    # Dit is om te voorkomen dat de speler te veel overtredingen verzamelt en ze nooit allemaal kan verwijderen
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # Milliseconden die de speler kan verzamelen om later te gebruiken als hij achterop raakt
    drift: 120

NegativeTimer:
    # Aantal milliseconden dat verloren gaat tijdens het bewegen voordat we moeten beginnen met flaggen
    drift: 1200

PacketOrderI:
    # Inschakelen als spelers worden gemarkeerd vanwege het gebruik van 1.7-animatiemods
    exempt-placing-while-digging: false

Reach:
    # Met hoeveel moeten we hitboxes uitbreiden? 0.0005 moet 3.0005+ bereik detecteren
    #
    # Er is 0.03 geforceerde uitbreiding met 1.9-1.18.1 (niet 1.18.2), of sommige client/server combinaties vanwege
    # protocol veranderingen en beperkingen. Deze controle is het krachtigst met 1.7/1.8 clients op 1.8 servers
    threshold: 0.0005
    # Moeten we hits annuleren waarvan we weten dat ze onmogelijk zijn?
    # 3.00-3.03 hits kunnen doorkomen, maar toch gemarkeerd worden, vanwege pakketvolgorderbeperkingen
    block-impossible-hits: true
    # Dit stuurt een extra pakket aan het eind van elke tick om de kans op het vangen van valsspelers te vergroten
    # Dit injecteert in de verbindingslijst van de server om een laatste pakket te sturen net voordat de server doorspoelt
    # Door dit in te schakelen zal het bandbreedtegebruik voor alle spelers toenemen
    # Dit zal de algehele serverprestaties niet verlagen
    # Door dit in te schakelen worden meer valsspelers gepakt
    # Als je dit uitgeschakeld laat, worden nog steeds valsspelers gepakt en zullen er geen valse positieven ontstaan
    # Tenzij je een 1.8 PvP server bent, wordt dit extra pakket niet aangeraden
    enable-post-packet: false

exploit:
    # Je kunt hoge snelheden krijgen als je sprint met een elytra, dit voorkomt de exploit als het op false staat
    # Mojang heeft de netcode verpest door elytra's client-sided te laten starten en elytra's server-sided te laten eindigen
    # Elytra's hebben 0.99 horizontale wrijving, dus het constant toevoegen van 0.2 horizontale snelheden resulteert in zeer hoge snelheden.
    allow-sprint-jumping-when-using-elytra: true
    # Deze optie verzacht de plaatsing van de speler op ghostblocks door de speler opnieuw te synchroniseren wanneer dit gebeurt
    allow-building-on-ghostblocks: true
    # Deze instelling, beïnvloed door de boolean hierboven, bepaalt de afstand om te controleren op ghostblocks
    # Het geldige bereik is beperkt van 2 tot 4
    distance-to-check-if-ghostblocks: 2

# Experimentele controles inschakelen
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Cult annuleert soms illegale pakketten zoals met timer, na X pakketten in een seconde geannuleerd, wanneer moeten
# we de speler gewoon schoppen? Dit is nodig omdat sommige pakket-begrenzers pakketten die door cult worden geannuleerd niet tellen
packet-spam-threshold: 100

# Cult kan afdwingen dat een speler die uit de vliegmodus is gezet niet meer dan X ms ping heeft
# Dit komt doordat Cult momenteel vliegende spelers niet controleert
# Om uit te schakelen, gebruik -1
max-ping-out-of-flying: 1000

# Maximale ping wanneer een vuurwerkboost van de speler wordt verwijderd.
# Dit voorkomt dat spelers met hoge latency oneindig één vuurwerkboost met een elytra kunnen gebruiken.
max-ping-firework-boost: 1000

# Schemamarkers — alleen aanpassen als je weet wat je doet.
#   config-flavor:  V2 = Cult 2.x-build, V3 = Cult 3.x. De plugin weigert een
#                   config te laden waarvan de flavor niet overeenkomt met de
#                   eigen build: een V3-config die door een V2-jar wordt
#                   geopend, faalt direct in plaats van stilletjes te mergen
#                   met de verkeerde sleutels.
#   config-version: wordt verhoogd bij elke incompatibele vormwijziging. Oude
#                   configs worden bij de volgende start automatisch
#                   gemigreerd door de meegeleverde updater.
# Cult vernieuwt gecachete permissies altijd wanneer een speler joint en wanneer
# Cult wordt herladen, ongeacht of LuckPerms is geïnstalleerd.
# LuckPerms-eventhooks vernieuwen gecachete Cult-permissies in normale setups ook meteen.
# Deze periodieke fallback is alleen nodig voor online permissiewijzigingen die niet
# door die events worden gedekt, zoals een aangepaste LuckPerms-context die
# signalContextUpdate niet aanroept, ontbrekende Fabric-contextupdates of een
# permissieprovider anders dan LuckPerms die live permissies wijzigt.
# Zet op -1 om polling uit te schakelen. Zet op een positieve waarde om elke X ticks te vernieuwen.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# Zorgt dat staffcommando's, tab-aanvulling en waarschuwingen werken op al je proxy's en servers.
# Installatiegids: docs/network.md in de broncode van CultAC. /cult reload past wijzigingen toe.
# Deze omgevingsvariabelen hebben voorrang op hun sleutels als ze gezet en niet leeg zijn:
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # Hoe je servers met elkaar praten:
  #   none         Uit. Commando's en waarschuwingen bereiken alleen spelers op deze server.
  #   redis        Via een Redis-server (Valkey, KeyDB en Dragonfly werken ook). Vul het onderdeel redis in.
  #   nats         Via een NATS-server. Vul het onderdeel nats in.
  #   redisbungee  Velocity-proxy's met RedisBungee. Gebruikt diens Redis-verbinding, verder hoef je niets in te vullen.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Meer dan één server? Scheid ze met komma's.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Alleen als je NATS-server accounts gebruikt: het pad naar je .creds-bestand.
    credentials-file: ""
    ssl: false
  # De naam van deze server op het netwerk. Elke server heeft een eigen naam nodig.
  # Laat leeg voor het proxy-id van RedisBungee, anders cloud.proxy-id, anders het IP en de poort van deze server.
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# CultAC-specifieke configuratie.
cult:
  # Sla alle controles over voor Bedrock-spelers (Geyser/Floodgate) of voor Java-spelers.
  # Standaard worden beide edities gecontroleerd.
  exempt-bedrock-players: false
  exempt-java-players: false

  checks:
    bedrock-movement:
      # Meld een overtreding zodra de Bedrock-validatieafwijking deze waarde bereikt.
      # Omvat verticale bewegingsfouten en te grote horizontale invoer.
      position-flag-threshold: 0.001

      # Verplaatst de simulatiepositie voor de volgende tick per bewegingstick maximaal
      # deze afstand naar de gemelde clientpositie. Stel in op 0 om uit te schakelen.
      position-reconciliation-step: 0.0005

      # Wordt momenteel alleen in diagnostiek weergegeven; deze waarde veroorzaakt geen overtredingsmeldingen.
      velocity-flag-threshold: 0.001

      # Sta positiecorrecties voor Bedrock-spelers toe.
      # Wordt momenteel bij het verbinden toegepast; wijzigingen vereisen opnieuw verbinden.
      enable-setbacks: true

    fair-reach:
      # Tijdsvariatie rond het volginterval van 50 ms van FairReach.
      # In milliseconden; 15 geeft een tijdvenster van 35–65 ms.
      max-position-packet-jitter-ms: 15

      # Maximale wachttijd voordat een positiewijziging van het doelwit wordt toegepast, in milliseconden.
      # Door de client bevestigde wijzigingen worden eerder toegepast.
      max-ping-compensation-ms: 300

      # Annuleer aanvallen op spelers als hun dichtstbijzijnde mogelijke hitbox verder ligt dan het
      # vanilla-bereik van de aanvaller (entity_interaction_range) plus deze afstand, in blokken.
      reach-leniency: 0.1

    autoclicker-limit:
      # Gemiddeld aantal klikken per seconde waarboven de autoclickerbuffer toeneemt.
      # Berekend over groepen van 50 meegetelde armzwaaien.
      max-cps: 25

    omni-sprint:
      # Opgebouwde OmniSprint-buffer die nodig is om hersynchronisatie af te dwingen.
      # Elke detectie verhoogt de buffer met 1.
      buffer-threshold: 20

      # Hoeveelheid die na elke voorspelling van de OmniSprint-buffer wordt afgetrokken.
      buffer-decay: 0.5

    explosion:
      # Positiecorrecties door explosies vereisen ook dat het overtredingsniveau
      # voor positiecorrecties van deze controle wordt overschreden.

      # Opgebouwde bewegingsfout door explosies die nodig is om een positiecorrectie te proberen.
      max-advantage: 1

      # Fout van één explosie die nodig is om een positiecorrectie te proberen,
      # zonder te wachten tot de opgebouwde fout max-advantage bereikt.
      immediate-setback-threshold: 0.01

      # Vermenigvuldig de opgebouwde fout met deze waarde zodra de afwijking van een
      # explosiereactie onder Explosion.threshold komt. Waarden dichter bij 1 bouwen de fout langzamer af.
      setback-decay-multiplier: 0.98

      # Maximale opgebouwde explosiefout die de controle bewaart.
      max-ceiling: 2

  prediction:
    # Regelt alleen bewegingscorrecties; het overschrijden van dit percentage telt nooit als cheatovertreding.
    # De geschiedenis blijft behouden bij het stoppen en hervatten van voorwerpgebruik
    # en bij positiecorrecties.
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # Vergelijkt de echte tijd waarin de server een voorwerp gebruikt (eten, drinken,
    # spannen) met de vertraagde clientticks in die tijd. Schuld boven max-debt-ticks
    # markeert ItemUseBurst; de standaard dekt één late clientframe (10 ticks) plus
    # afronding. Tegoed ontstaat alleen door extra vertraagde ticks.
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # Percentage van elke verwachte gebruikstick dat met een vertraagde tick betaald moet worden.
      charge-percent: 95

    # Maximaal toegestane transactieping of tijd zonder bewegingspakketten terwijl
    # terugslag in behandeling is, in milliseconden.
    # Voor een positiecorrectie wegens vertraging wordt een vaste marge van 50 ms toegevoegd.
    max-knockback-ping-ms: 1000

    # Tijd zonder bewegingspakketten voordat een positiecorrectie wegens vertraging
    # wordt overwogen, in milliseconden. De simulatie moet aantonen dat stilstaan
    # ongeldig was voordat een correctie wordt toegepast.
    max-freeze-time-ms: 5000

  networking:
    # Vervang de verzonden gezondheid van andere levende entiteiten door 1 HP.
    # Behoud de eigen gezondheid van de kijker, diens huidige rijdier en dode entiteiten.
    # Kijkers met cult.showhealth ontvangen de werkelijke gezondheidswaarden.
    spoof-health: false

  client-brand:
    # Verwijder de eerste overeenkomst van deze reguliere expressie uit ontvangen clientmerken.
    # Standaard wordt het achtervoegsel " (Velocity)" verwijderd.
    # Gebruik een lege tekenreeks om dit uit te schakelen.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:
    # Momenteel ongebruikt: deze waarde wijzigen schakelt uitgebreide meldingen niet automatisch in.
    auto-enable-verbose: false

    # Schrijf diagnostiek over teleportaties, positiecorrecties en hersynchronisatie naar de console.
    teleports: false

    bedrock-movement:
      # Schakel uitgebreide Bedrock-bewegingsrapporten en bijbehorende voorspellingslogboeken in,
      # met de onderstaande filters en minimale wachttijd.
      enabled: false

      # Rapporteer ook bewegingen zonder overtreding waarvan de validatieafwijking
      # min-offset bereikt.
      log-clean-offsets: false

      # Minimale validatieafwijking voor het rapporteren van bewegingen zonder overtreding.
      # Wordt alleen gebruikt als log-clean-offsets true is.
      min-offset: 1.0e-7

      # Minimale tijd tussen Bedrock-bewegingsrapporten per speler, in seconden.
      # Stel in op 0 om de wachttijd te verwijderen.
      cooldown-seconds: 10

config-flavor: V2
config-version: 20
