# CultAC Hauptkonfiguration
# Quellcode: https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside und Mitwirkende, lizenziert unter GPLv3.
# Modifizierte Binärdateien, oder Plugins mit kopiertem Cult-Code, müssen privat sein,
# oder mit vollständigem Quellcode für Käufer ohne zusätzliche Kosten verfügbar sein.

alerts:
    # Sollen die Warnungen nicht nur an die Spieler, sondern auch an die Konsole gesendet werden?
    print-to-console: true
    # Dies steuert, ob/wie Warnungen zwischen Servern, die mit Ihrem Proxy verbunden sind, geteilt werden.
    # Sie müssen 'bungee-plugin-message-channel' in Ihrer Velocity-Konfiguration aktiviert haben, wenn Velocity verwendet wird.
    proxy:
        # Sollen Warnungen an andere Server gesendet werden, die mit Ihrem Proxy verbunden sind?
        send: false
        # Sollen die von anderen Servern empfangenen Alarme diesem Server mitgeteilt werden?
        receive: false
    # Alarm-Bereich für Teammitglieder, die mit /cult alerts server|global keinen gewählt haben: server oder global.
    # global gilt nur, solange netzwerkweite Alarme aktiv sind; sonst wird server verwendet.
    default-scope: server

verbose:
    print-to-console: false

client-brand:
    # Das bedeutet, dass die Marke nicht an die Betreiber weitergegeben wird, wenn die Marke mit den folgenden Regexes übereinstimmt
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Alle Zuschauer mit der Berechtigung cult.spectator ausblenden, unabhängig davon, ob sie tatsächlich aktiv zuschauen
    hide-regardless: false
    # Die Zuschauer werden nur in diesen Welten versteckt, um alle Welten zuzulassen, bleiben sie leer.
    allowed-worlds:
        - ""

# Wie lange sollen Spieler Zeit haben, bis wir sie wegen Zeitüberschreitung rauswerfen? Standard = 60 Sekunden
max-transaction-time: 60

# Wenn CultAC selbst versagt (es kann sich nicht an einen Spieler anhängen oder die Client-Version wird nicht
# unterstützt), spielt der Spieler ungeprüft weiter, statt getrennt zu werden. Kicks wegen Paketfluten,
# Crash-Exploits und Pings, die nicht innerhalb von max-transaction-time beantwortet werden, gelten weiterhin.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Sollte der Standard-Handler für die Block-Resynchronisierung deaktiviert werden?
# Standardmäßig liest Cult Blöcke aus der Serverwelt und sendet sie an den Client, um Desyncs zu beheben.
# Wenn Sie Plugins verwenden, die gefälschte paketbasierte Blöcke erstellen (die in der Serverwelt nicht existieren),
# sollten Sie dies auf true setzen, um zu verhindern, dass Cult sie mit Luft/echten Blöcken überschreibt.
# Dies erzwingt die Verwendung eines "NoOp" (No Operation) Handlers, es sei denn, über die API wird ein eigener bereitgestellt.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # Mit wie viel soll der Gesamtvorteil multipliziert werden, wenn der Spieler legitim ist.
    # So sieht die Standardkonfiguration aus (x-Achse = Sekunden, y-Achse = 1/1000 Block): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Wie groß sollte der Abstand zur Bewegung des Spielers sein, um eine Verletzung zu erzeugen?
    # Gemessen in Blöcken von der möglichen Bewegung.
    # Wir berücksichtigen Optifine, indem wir die Triggertabellen wechseln, aber wenn wir dies auf 0,001 senken, wird FastMath reduziert.
    # Markierung des Anticheats, wenn diese Kompensation nicht funktioniert...
    threshold: 0.001
    # Wie groß ist der Verstoß in einem Tick, bevor der Spieler sofort zurückgesetzt wird?
    # -1 zum Deaktivieren
    immediate-setback-threshold: 0.1
    # Wie groß ist der Vorsprung gegenüber allen Ticks, bevor wir einen Rückschlag erleiden?
    # -1 zum Deaktivieren
    max-advantage: 1
    # Nach 50 Sekunden mit der Standardkonfiguration geht der Spieler von 4 Blöcken -> 1 Block Vorteil
    # Dies soll verhindern, dass der Spieler zu viele Verstöße sammelt und nie in der Lage ist, sie alle zu beseitigen.
    # Standard-Vorteilsgrenze (x-Achse = Sekunden, y-Achse = 1/1000 Block): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Schwellenwert für die Verletzungsstufe für den Rückschlag
    # 1 für das alte Verhalten
    setback-violation-threshold: 1

# Überprüft, ob ein Spieler während einer Bewegung einen Block betreten hat.
Phase:
    setbackvl: 1 # Glitching in Blöcken kann das Klettern an der Wand ermöglichen, außerdem ist dieser Check relativ stabil.
    decay: 0.005

# Prediction-based no slow check
# Cult ist verantwortlich für den fehlerhaften Netcode hier... schwer zu falsen, selbst wenn man Rechtsklick und Offhand-Taste spammt.
# Viel stabiler als andere Anticheats, aber bitte melde alle Falses... Ich habe hier eine Menge Netcode-Probleme behoben.
NoSlow:
    # Wie viel von einem Offset ist "schummeln"
    # Standardmäßig ist dieser Wert niedriger als andere Offs.
    # Flags um 0,03-0,2 konsequent mit NoSlow on
    threshold: 0.001
    # Schnell auf das erste Element zurücksetzen, um jeden Vorteil von NoSlow zu beseitigen
    setbackvl: 5
    # Verfall ist, wenn der Spieler einen Gegenstand benutzt UND dadurch verlangsamt wird
    decay: 0.05

Knockback:
    # Mit wie viel soll der Gesamtvorteil multipliziert werden, wenn der Spieler legitim ist.
    setback-decay-multiplier: 0.999
    # Wie groß sollte der Abstand zur Bewegung des Spielers sein, um eine Verletzung zu erzeugen?
    # Gemessen in Blöcken von der möglichen Bewegung.
    threshold: 0.001
    # Wie groß ist der Verstoß in einem Tick, bevor der Spieler sofort zurückgesetzt wird?
    # -1 zum Deaktivieren
    immediate-setback-threshold: 0.1
    # Wie groß ist der Vorsprung gegenüber allen Ticks, bevor wir einen Rückschlag erleiden?
    # -1 zum Deaktivieren
    max-advantage: 1
    # Dies soll verhindern, dass der Spieler zu viele Verstöße sammelt und nie in der Lage ist, sie alle zu beseitigen.
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # Millisekunden, die der Spieler akkumulieren kann, um sie später zu nutzen, wenn er zurückfällt.
    drift: 120

NegativeTimer:
    # Anzahl der Millisekunden, die während der Bewegung verloren gehen, bevor mit der Markierung begonnen werden sollte.
    drift: 1200

VehicleC:
    setbackvl: 25

PacketOrderI:
    # Aktivieren, wenn Spieler markiert werden, weil sie 1.7-Animationsmods verwenden
    exempt-placing-while-digging: false

Reach:
    # Um wie viel sollen wir die Hitboxen erweitern? 0,0005 sollte 3,0005+ Reichweite erkennen
    #
    # Es gibt eine 0,03 erzwungene Erweiterung mit 1.9-1.18.1 (nicht 1.18.2), oder einigen Client/Server-Kombinationen aufgrund von
    # Protokolländerungen und -beschränkungen. Diese Prüfung ist am stärksten mit 1.7/1.8 Clients auf 1.8 Servern.
    threshold: 0.0005
    # Sollten wir Treffer annullieren, von denen wir wissen, dass sie unmöglich sind?
    # 3.00-3.03-Treffer können aufgrund von Beschränkungen der Paketreihenfolge durchgehen, aber dennoch gekennzeichnet werden.
    block-impossible-hits: true
    # Dies sendet ein zusätzliches Paket am Ende jedes Ticks, um die Wahrscheinlichkeit zu erhöhen, dass Betrüger erwischt werden.
    # Dies injiziert in die Verbindungsliste des Servers, um ein letztes Paket zu senden, kurz bevor der Server geleert wird.
    # Aktivieren dieser Funktion erhöht die Bandbreitennutzung für alle Spieler.
    # Dies wird die Gesamtleistung des Servers nicht verringern.
    # Aktivieren Sie diese Option, um mehr Cheater zu erwischen.
    # Bleibt diese Funktion deaktiviert, werden immer noch Cheater erwischt und es kommt nicht zu Fehlalarmen.
    # Sofern es sich nicht um einen 1.8 PvP-Server handelt, wird dieses zusätzliche Paket nicht empfohlen.
    enable-post-packet: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Diese Option verhindert das Platzieren von Geisterblöcken auf weitere Geisterblöcke, indem der Spieler neu synchronisiert wird.
    allow-building-on-ghostblocks: true
    # Diese Option, abhängig von der oben genannten Einstellung, definiert wie weit man nach Geisterblöcken suchen soll
    # Ihr gültiger Bereich ist von 2 bis 4 begrenzt
    distance-to-check-if-ghostblocks: 2

# Aktiviert experimentelle Prüfungen
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Cult bricht manchmal illegale Pakete ab, z.B. mit Timer, nachdem X Pakete in einer Sekunde abgebrochen wurden, wann sollte
# wir den Spieler einfach kicken? Dies ist erforderlich, da einige Paketbegrenzer die von Cult abgebrochenen Pakete nicht zählen.
packet-spam-threshold: 100

# Cult kann erzwingen, dass ein Spieler, der aus dem Flugzustand gesetzt wurde, nicht mehr als X ms Ping haben darf
# Dies liegt daran, dass Cult derzeit fliegende Spieler nicht überprüft
# Zum Deaktivieren -1 verwenden
max-ping-out-of-flying: 1000

# Maximale Latenz, wenn ein Feuerwerks‑Boost vom Spieler entfernt wird.
# Dies verhindert, dass Spieler mit hoher Latenz einen einzigen Feuerwerks‑Boost mit Elytra unbegrenzt nutzen können.
max-ping-firework-boost: 1000

# Schema-Marker — nur ändern, wenn du weißt, was du tust.
#   config-flavor:  V2 = Cult-2.x-Build, V3 = Cult-3.x. Das Plugin lehnt eine
#                   Config ab, deren Flavor nicht zum eigenen Build passt —
#                   eine V3-Config, die von einer V2-Jar geladen wird, scheitert
#                   sofort, statt stillschweigend in falsche Schlüssel zu mergen.
#   config-version: wird bei jeder inkompatiblen Schemaänderung erhöht. Alte
#                   Configs werden beim nächsten Start automatisch vom
#                   mitgelieferten Updater migriert.
# Cult aktualisiert zwischengespeicherte Berechtigungen immer, wenn ein Spieler beitritt
# und wenn Cult neu geladen wird, unabhängig davon, ob LuckPerms installiert ist.
# LuckPerms-Event-Hooks aktualisieren zwischengespeicherte Cult-Berechtigungen
# in normalen Setups ebenfalls sofort.
# Dieser periodische Fallback wird nur für Online-Berechtigungsänderungen benötigt,
# die nicht von diesen Events abgedeckt werden, z. B. ein benutzerdefinierter
# LuckPerms-Kontext, der signalContextUpdate nicht aufruft, Lücken bei Fabric-Kontexten
# oder ein Nicht-LuckPerms-Berechtigungsanbieter, der Berechtigungen live ändert.
# Setze auf -1, um Polling zu deaktivieren. Setze einen positiven Wert, um alle X Ticks zu aktualisieren.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# Damit Team-Befehle, Tab-Vervollständigung und Warnungen auf all Ihren Proxys und Servern funktionieren.
# Anleitung: docs/network.md im Quellcode von CultAC. /cult reload übernimmt Änderungen.
# Diese Umgebungsvariablen haben Vorrang vor ihren Schlüsseln, wenn sie gesetzt und nicht leer sind:
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # Wie Ihre Server miteinander sprechen:
  #   none         Aus. Befehle und Warnungen erreichen nur Spieler auf diesem Server.
  #   redis        Über einen Redis-Server (Valkey, KeyDB und Dragonfly gehen auch). Füllen Sie den Abschnitt redis aus.
  #   nats         Über einen NATS-Server. Füllen Sie den Abschnitt nats aus.
  #   redisbungee  Velocity-Proxys mit RedisBungee. Nutzt dessen Redis-Verbindung, sonst ist nichts auszufüllen.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Mehrere Server trennen Sie mit Kommas.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Nur wenn Ihr NATS-Server Accounts nutzt: der Pfad zu Ihrer .creds-Datei.
    credentials-file: ""
    ssl: false
  # Der Name dieses Servers im Netzwerk. Jeder Server braucht seinen eigenen.
  # Leer lassen, um die RedisBungee-Proxy-ID zu nutzen, sonst cloud.proxy-id, sonst IP und Port dieses Servers.
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# CultAC-spezifische Konfiguration.
cult:
  # Überspringt alle Prüfungen für Bedrock-Spieler (Geyser/Floodgate) bzw. für Java-Spieler.
  # Standardmäßig werden beide Editionen geprüft.
  exempt-bedrock-players: false
  exempt-java-players: false

  checks:
    bedrock-movement:
      # Meldet einen Verstoß, sobald die Bedrock-Validierungsabweichung diesen Wert erreicht.
      # Berücksichtigt vertikale Bewegungsfehler und übermäßige horizontale Eingaben.
      position-flag-threshold: 0.001

      # Bewegt die Simulationsposition des nächsten Ticks pro Bewegungstick höchstens
      # um diesen Abstand zur gemeldeten Clientposition. 0 deaktiviert dies.
      position-reconciliation-step: 0.0005

      # Wird derzeit nur in Diagnosen angezeigt; dieser Wert löst keine Verstöße aus.
      velocity-flag-threshold: 0.001

      # Erlaubt Positionskorrekturen für Bedrock-Spieler.
      # Wird derzeit beim Verbindungsaufbau übernommen; Änderungen erfordern erneutes Verbinden.
      enable-setbacks: true

    fair-reach:
      # Zeitliche Abweichung um das 50-ms-Aktualisierungsintervall von FairReach.
      # In Millisekunden; 15 ergibt ein Zeitfenster von 35–65 ms.
      max-position-packet-jitter-ms: 15

      # Maximale Wartezeit vor der Übernahme einer Zielpositionsänderung, in Millisekunden.
      # Vom Client bestätigte Änderungen werden früher übernommen.
      max-ping-compensation-ms: 300

      # Bricht Angriffe auf Spieler ab, deren nächstmögliche Hitbox weiter entfernt ist als die
      # Vanilla-Reichweite des Angreifers (entity_interaction_range) plus diese Entfernung, in Blöcken.
      reach-leniency: 0.1

    autoclicker-limit:
      # Durchschnittliche Klicks pro Sekunde, oberhalb derer der Autoclicker-Puffer steigt.
      # Wird aus Gruppen von 50 berücksichtigten Armschwingungen berechnet.
      max-cps: 25

    omni-sprint:
      # Angesammelter OmniSprint-Puffer, ab dem eine Resynchronisierung erzwungen wird.
      # Jede Erkennung erhöht den Puffer um 1.
      buffer-threshold: 20

      # Betrag, der nach jeder Vorhersage vom OmniSprint-Puffer abgezogen wird.
      buffer-decay: 0.5

    explosion:
      # Positionskorrekturen wegen Explosionen erfordern außerdem, dass die für
      # Positionskorrekturen festgelegte Verstoßstufe der Prüfung überschritten wird.

      # Angesammelter Explosions-Bewegungsfehler, ab dem eine Positionskorrektur versucht wird.
      max-advantage: 1

      # Fehler einer einzelnen Explosion, ab dem eine Positionskorrektur versucht wird,
      # ohne darauf zu warten, dass der angesammelte Fehler max-advantage erreicht.
      immediate-setback-threshold: 0.01

      # Multipliziert den angesammelten Fehler mit diesem Wert, wenn die Abweichung
      # bei einer Explosion unter Explosion.threshold liegt. Werte näher an 1 bauen ihn langsamer ab.
      setback-decay-multiplier: 0.98

      # Maximaler angesammelter Explosionsfehler, den die Prüfung speichert.
      max-ceiling: 2

  prediction:
    # Regelt nur Bewegungskorrekturen; das Überschreiten dieses Anteils zählt nie als Cheat-Verstoß.
    # Der Verlauf bleibt beim Beenden und erneuten Starten der Gegenstandsnutzung
    # sowie bei Positionskorrekturen erhalten.
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # Vergleicht die echte Zeit, in der der Server einen Gegenstand benutzt (Essen,
    # Trinken, Spannen), mit den verlangsamten Client-Ticks in dieser Zeit. Schulden über
    # max-debt-ticks lösen ItemUseBurst aus; der Standard deckt einen verspäteten
    # Client-Frame (10 Ticks) plus Rundung ab. Guthaben entsteht nur durch zusätzliche verlangsamte Ticks.
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # Prozent jedes erwarteten Nutzungsticks, der mit einem verlangsamten Tick bezahlt werden muss.
      charge-percent: 95

    # Maximal tolerierter Transaktions-Ping oder Zeitraum ohne Bewegungspakete,
    # während Rückstoß aussteht, in Millisekunden.
    # Vor einer Latenzkorrektur werden zusätzlich fest 50 ms zugestanden.
    max-knockback-ping-ms: 1000

    # Zeit ohne Bewegungspakete, nach der eine Latenzkorrektur geprüft wird,
    # in Millisekunden. Eine Korrektur erfolgt nur, wenn die Simulation zeigt,
    # dass Stillstehen nicht zulässig war.
    max-freeze-time-ms: 5000

  networking:
    # Ersetzt die gemeldete Gesundheit anderer lebender Entitäten durch 1 HP.
    # Die eigene Gesundheit des Betrachters, sein Reittier und tote Entitäten bleiben unverändert.
    # Betrachter mit cult.showhealth erhalten die tatsächlichen Gesundheitswerte.
    spoof-health: false

  client-brand:
    # Entfernt den ersten Treffer dieses regulären Ausdrucks aus empfangenen Client-Kennungen.
    # Standardmäßig wird die abschließende Zeichenfolge " (Velocity)" entfernt.
    # Zum Deaktivieren eine leere Zeichenfolge verwenden.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:
    # Derzeit ungenutzt: Änderungen aktivieren ausführliche Meldungen nicht automatisch.
    auto-enable-verbose: false

    # Schreibt Diagnosen zu Teleportationen, Positionskorrekturen und Resynchronisierungen in die Konsole.
    teleports: false

    bedrock-movement:
      # Aktiviert ausführliche Bedrock-Bewegungsberichte und zugehörige Vorhersageprotokolle.
      # Es gelten die unten angegebenen Filter und Wartezeiten.
      enabled: false

      # Meldet auch Bewegungen ohne Verstoß, deren Validierungsabweichung
      # min-offset erreicht.
      log-clean-offsets: false

      # Minimale Validierungsabweichung für Berichte über Bewegungen ohne Verstoß.
      # Wird nur verwendet, wenn log-clean-offsets auf true steht.
      min-offset: 1.0e-7

      # Mindestabstand zwischen Bedrock-Bewegungsberichten je Spieler, in Sekunden.
      # Mit 0 wird die Wartezeit aufgehoben.
      cooldown-seconds: 10
# The version of the check names this server uses outside punishments.yml: the names each check's
# own settings are written under in this file (AttackEntityVisibility.setbackvl), the names in its
# permission nodes (cult.exempt.attackentityvisibility), and the names alerts, logs, placeholders
# and the API show.
# Cult never changes it. Raise it yourself, after you have renamed those settings and permission nodes:
#   1: AttackMobVisibility, bAttackMobVisibility. InteractEntityVisibility covers players too.
#   2: AttackEntityVisibility, bAttackEntityVisibility. InteractPlayerVisibility covers players,
#      InteractEntityVisibility everything else.
# A file without this line is read as version 1.
check-name-version: 2

config-flavor: V2
config-version: 20
