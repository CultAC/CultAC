# Configuration principale de CultAC
# Code source : https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside et contributeurs, sous licence GPLv3.
# Les binaires modifiés, ou les plugins contenant du code cult copié, doivent être privés,
# ou avec le code source complet disponible pour les acheteurs sans frais supplémentaires.

alerts:
    # En plus de diffuser des alertes aux joueurs, doivent-elles également être afffichées dans console ?
    print-to-console: true
    # Cela contrôle la manière dont les alertes sont partagées entre les serveurs connectés à votre proxy.
    # Vous devez avoir activé 'bungee-plugin-message-channel' dans la configuration de Velocity si Velocity est utilisé.
    proxy:
        # Les alertes doivent-elles être envoyées aux autres serveurs connectés à votre proxy ?
        send: false
        # Les alertes reçues des autres serveurs doivent-elles être annoncées sur ce serveur ?
        receive: false
    # Portée des alertes du staff qui n'en a pas choisi avec /cult alerts scope : server ou global.
    # global ne s'applique que si les alertes réseau sont actives ; sinon server est utilisé.
    default-scope: server

verbose:
    print-to-console: false

client-brand:
    # Cela signifie qu'il n'enverra pas la nature du client aux opérateurs si il correspond aux clients suivants
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Masquer tout les spectateurs ayant la permission cult.spectator, peu importe s'ils sont actuellement en train d'observer.
    hide-regardless: false
    # Les spectateurs seront cachés uniquement dans ces mondes, laissez vide pour les afficher dans tous les mondes.
    allowed-worlds:
        - ""

# Au bout de combien de temps les joueurs doivent-ils être expulsés en cas de perte de connexion ? Défault = 60 secondes
max-transaction-time: 60

# Si CultAC échoue lui-même (impossible de s'attacher à un joueur ou version du client non prise en charge),
# le joueur continue sans inspection au lieu d'être déconnecté. Les expulsions pour flood de paquets, exploits
# de crash et pings sans réponse au-delà de max-transaction-time s'appliquent toujours.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # De combien devons-nous multiplier l'avantage total lorsque le joueur est légitime ?
    # Voici à quoi ressemble la configuration par défaut (l'axe x = secondes, l'axe y = 1/1000 de bloc) : https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Quel est l'écart maximal par rapport au mouvement du joueur pour lequel nous devrions créer une violation ?
    # Mesuré en blocs par rapport au mouvement possible.
    # Nous prenons en compte Optifine en changeant les tables trigonométriques, mais en réduisant cela à 0.001, cela réduira les signalements de l'anticheat
    # sur FastMath si cette compensation ne fonctionne pas...
    threshold: 0.001
    # Quelle est la distance maximale d'une violation par tick avant que le joueur ne soit immédiatement renvoyé en arrière ?
    # -1 pour désactiver
    immediate-setback-threshold: 0.1
    # Quelle est la distance maximale d'une violation sur tout les ticks avant que l'anti-cheat commence à renvoyer en arrière ?
    # -1 pour désactiver
    max-advantage: 1
    # Après 50 secondes avec la configuration par défaut, le joueur passera de 4 blocs -> 1 bloc d'avantage
    # Cela vise à empêcher le joueur d'accumuler trop de violations et de ne jamais pouvoir toutes les réinitialiser.
    # Plafond d'avantage par défaut (l"axe x = secondes, l'axe y = 1/1000 de bloc)) : https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4

# Vérifications pour voir si un joueur est entré dans un bloc pendant un mouvement.
Phase:
    setbackvl: 1 # Rentrer dans des blocs peut permettre de cultper sur les murs, et cette vérification est relativement stable.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Vérification de no-slow basée sur la prédiction.
# Cult tient compte des problèmes de netcode ici... difficile à tromper même en spamant le clic droit et le bouton de la main secondaire.
# Bien plus stable que les autres anti-triche, mais veuillez signaler toute fausse détection... J'ai corrigé de nombreux problèmes de netcode ici.
NoSlow:
    # Quel est le niveau d'écart considéré comme "triche"
    # Par défaut, cela est inférieur à d'autres écarts.
    # Génère des avertissements avec des valeurs comprises entre 0,03 et 0,2 lors de l'utilisation de NoSlow
    threshold: 0.001
    # Renvoyer en arrière sur le premier objet pour éliminer tout avantage donné par NoSlow
    setbackvl: 5
    # Décroissance lorsque le joueur utilise un objet ET est ralenti par celui-ci.
    decay: 0.05

Knockback:
    # De combien devons-nous multiplier l'avantage total lorsque le joueur est légitime ?
    setback-decay-multiplier: 0.999
    # Quel est l'écart maximal par rapport au mouvement du joueur pour lequel nous devrions créer une violation ?
    # Mesuré en blocs par rapport au mouvement possible.
    threshold: 0.001
    # Quelle est la distance maximale d'une violation par tick avant que le joueur ne soit immédiatement renvoyé en arrière ?
    # -1 pour désactiver
    immediate-setback-threshold: 0.1
    # Quelle est la distance maximale d'une violation sur tout les ticks avant que l'anti-cheat commence à renvoyer en arrière ?
    # -1 pour désactiver
    max-advantage: 1
    # Cela vise à empêcher le joueur d'accumuler trop de violations et de ne jamais pouvoir toutes les réinitialiser.
    max-ceiling: 4


Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # Le nombre de millisecondes que le joueur peut accumuler pour une utilisation ultérieure lorsqu'il prend du retard.
    drift: 120

PacketOrderI:
    # Activer si les joueurs sont signalés pour l'utilisation de mods d'animation 1.7
    exempt-placing-while-digging: false

Reach:
    # De combien devrions-nous agrandir les hitboxes ? Une augmentation de 0,0005 devrait détecter une portée de 3,0005 ou plus.
    #
    # Il y a un agrandissement forcé de 0,03 avec les versions 1.9 à 1.18.1 (pas 1.18.2) ou certaines combinaisons client/serveur en raison
    # des changements et limitations du protocole. Cette vérification est particulièrement puissante avec les clients 1.7/1.8 sur les serveurs 1.8.
    threshold: 0.0005
    # Devons-nous annuler les coups que nous savons impossibles ?
    # Les coups entre 3,00 et 3,03 peuvent passer mais seront quand même signalés en raison des limitations de l'ordre des paquets.
    block-impossible-hits: true

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Cette option atténue le placement du joueur sur les ghostblocks en resynchronisant le joueur lorsque cela se produit.
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

# Active les vérifications expérimentales
experimental-checks: false

# Cult annule parfois des paquets illégaux, comme ceux liés au chronomètre, après avoir annulé X paquets en une seconde,
# à partir de combien de paquets annulés devrions-nous simplement expulser le joueur ?
# Cela est nécessaire car certains limiteurs de paquets ne comptent pas les paquets annulés par Cult.
packet-spam-threshold: 100

# Cult peut faire en sorte qu’un joueur sorti de l’état de vol n’ait pas plus de X ms de ping
# Cela est dû au fait que Cult ne vérifie pas encore les joueurs en vol
# Pour désactiver, utilisez -1
max-ping-out-of-flying: 1000

# Marqueurs de schéma — ne modifier qu'en sachant ce que l'on fait.
#   config-flavor:  V2 = build Cult 2.x, V3 = Cult 3.x. Le plugin refuse de
#                   charger une config dont le flavor ne correspond pas à son
#                   propre build : une config V3 ouverte par un jar V2 échoue
#                   immédiatement au lieu de fusionner silencieusement dans
#                   les mauvaises clés.
#   config-version: incrémenté à chaque changement de forme incompatible. Les
#                   anciennes configs sont migrées automatiquement par
#                   l'updater intégré au prochain démarrage.
# Cult actualise toujours les permissions mises en cache quand un joueur rejoint
# le serveur et quand Cult est rechargé, que LuckPerms soit installé ou non.
# Les hooks d'événements LuckPerms actualisent aussi immédiatement les permissions
# Cult mises en cache dans les configurations normales.
# Ce repli périodique n'est nécessaire que pour les changements de permissions en
# ligne non couverts par ces événements, comme un contexte LuckPerms personnalisé
# qui n'appelle pas signalContextUpdate, des lacunes de contexte sur Fabric ou un
# fournisseur de permissions autre que LuckPerms qui change les permissions en direct.
# Mettez -1 pour désactiver le sondage. Mettez une valeur positive pour actualiser tous les X ticks.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# Permet aux commandes du staff, à l'autocomplétion et aux alertes de fonctionner sur tous vos proxys et serveurs.
# Guide d'installation : docs/network.md dans le code source de CultAC. /cult reload applique les changements.
# Ces variables d'environnement sont prioritaires sur leurs clés lorsqu'elles sont définies et non vides :
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # Comment vos serveurs communiquent entre eux :
  #   none         Désactivé. Les commandes et les alertes n'atteignent que les joueurs de ce serveur.
  #   redis        Via un serveur Redis (Valkey, KeyDB et Dragonfly marchent aussi). Remplissez la section redis.
  #   nats         Via un serveur NATS. Remplissez la section nats.
  #   redisbungee  Proxys Velocity avec RedisBungee. Utilise sa connexion Redis, rien d'autre à remplir.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Pour indiquer plusieurs serveurs, séparez-les par des virgules.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Seulement si votre serveur NATS utilise des comptes : le chemin vers votre fichier .creds.
    credentials-file: ""
    ssl: false
  # Le nom de ce serveur sur le réseau. Chaque serveur a besoin du sien.
  # Laissez vide pour utiliser l'id de proxy RedisBungee, sinon cloud.proxy-id, sinon l'IP et le port de ce serveur.
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # owner/repo whose GitHub releases hold the builds. Empty is the repository this jar was built from.
  repository: ""
  # X.509 base64 Ed25519 key that build manifests must be signed with. Empty is CultAC's own build key.
  public-key: ""
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# The version of the check names this server uses outside punishments.yml: the names each check's
# own settings are written under in this file (AttackEntityVisibility.setbackvl), the names in its
# permission nodes (cult.exempt.attackentityvisibility), and the names alerts, logs, placeholders
# and the API show.
# Cult never changes it. Raise it yourself, after you have renamed those settings and permission nodes:
#   1: AttackMobVisibility, bAttackMobVisibility. InteractEntityVisibility covers players too.
#   2: AttackEntityVisibility, bAttackEntityVisibility. InteractPlayerVisibility covers players,
#      InteractEntityVisibility everything else.
#   3: MultiActionsC, D and H are InventoryA, B and C. MultiActionsI, J, K, L and S are one
#      check, InventoryD, whose verbose names the action. MultiActionsM, N, O, P, Q, R and T
#      are InventoryE to K. MultiActionsE, F and G are MultiActionsC, D and E.
# A file without this line is read as version 1.
check-name-version: 3

config-flavor: V2
config-version: 20
