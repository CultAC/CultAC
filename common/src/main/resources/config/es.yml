# La configuración principal de CultAC
# Código fuente: https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside y contribuyentes, licenciado bajo GPLv3.
# Binarios modificados o plugins con código de Cult deben ser privados o con
# el código fuente disponible para todos los compradores sin costo adicional.

alerts:
    # ¿Además de mandar las alertas a los jugadores, deberíamos mandarlas también a la consola?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: false
        # Should the alerts received from other servers be announced to this server?
        receive: false
    # Alcance de alertas del staff que no eligió uno con /cult alerts scope: server o global.
    # global solo aplica con las alertas de red activas; si no, se usa server.
    default-scope: server

verbose:
    print-to-console: false

client-brand:
    # Esto quiere decir que no se va a anunciar la marca del cliente si esta cumple alguno de los siguientes regexes:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Ocultar todos los espectadores con el permiso cult.spectator sin importar si realmente están espectando
    hide-regardless: false
    # ¿En qué mundos deberíamos ocultar los espectadores? Si está en blanco, se ocultaran en todos los mundos.
    allowed-worlds:
        - ""

# ¿Cuánto tiempo de espera debería pasar antes de expulsar un jugador por "tiempo de espera agotado"?
# Por defecto, este valor se encuentra en 60 segundos.
max-transaction-time: 60

# Si CultAC falla (no puede vincularse a un jugador o la versión del cliente no es compatible), el jugador
# sigue jugando sin inspección en lugar de ser desconectado. Las expulsiones por inundación de paquetes,
# exploits de crasheo y pings sin responder tras max-transaction-time siguen aplicándose.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    # Asi es como se ve la configuración por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    # Tomamos en cuenta a OptiFine cambiando las tablas trigonometricas, pero bajar esto a 0.001 reducirá
    # que FastMath marque el anti-cheat si esta compensación no funciona...
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.1
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 1
    # Después de 50 segundos con la configuración predeterminada, el jugador ira de 4 bloques -> 1 bloque de ventaja
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    # Tope de ventaja por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4

# Comprobaciones para ver si un jugador entro a un bloque durante un movimiento
Phase:
    setbackvl: 1 # Entrar a un bloque mediante bugs puede permitir subir paredes, además esta comprobación es relativamente estable.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Comprobación de NoSlow basado en predicciones
# Cult compensa por código de red con errores aquí... difícil de sacar un falso positivo incluso haciendo spam del
# clic derecho y la mano secundaria.
# Mucho mas estable que otros anti-cheats, pero por favor reportar todo falso positivo... he arreglado muchos
# problemas del código de red aquí.
NoSlow:
    # ¿Cuánta debería ser la compensacion como para que se considere trampa?
    # Por defecto esto es más bajo que otras compensaciones
    # Marca por 0.03-0.2 consistentemente con NoSlow activado
    threshold: 0.001
    # Retroceder rápidamente en el primer item para eliminar toda ventaja que NoSlow brinde
    setbackvl: 5
    # Decadencia cuando un jugador usa un item Y se ralentiza por el
    decay: 0.05

Knockback:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    setback-decay-multiplier: 0.999
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.1
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 1
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    max-ceiling: 4


Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # Milisegundos que el jugador puede acumular para ser usados mas tarde cuando se quedan por detrás
    drift: 120

NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 1200

PacketOrderI:
    # Habilitar si los jugadores están siendo marcados por usar mods de animación de la 1.7
    exempt-placing-while-digging: false

Reach:
    # Cuanto deberíamos expandir las hit-boxes? 0.0005 debería detectar un reach de 3.0005+
    #
    # Hay una expansion forzada de 0.03 con 1.9-1.18.1 (1.18.2 no) y algunas combinaciones de clientes/servidores
    # debido a cambios en el protocolo y limitaciones. Esta comprobación es más poderosa en clientes 1.7 y 1.8
    # conectados a un servidor 1.8
    threshold: 0.0005
    # ¿Deberíamos cancelar golpes que sabemos que son imposibles?
    # Golpes de 3.00-3.03 puede que aun asi pasen, pero se marcaran debido a limitaciones del orden de paquetes.
    block-impossible-hits: true

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Esta opción mitiga la colocación del jugador en bloques fantasma resincronizando al jugador cuando ocurre.
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

# Habilitar comprobaciones experimentales
experimental-checks: false

# Cult a veces cancela paquetes ilegal como los de Timer. Después de X paquetes en un solo segundo cancelados,
# cuando deberíamos simplemente expulsar al jugador? Esto es obligatorio ya que algunos limitadores de paquetes
# no cuentan los paquetes cancelados por Cult.
packet-spam-threshold: 100

# Cult puede hacer cumplir que un jugador que ha salido del estado de vuelo no tenga más de X ms de ping
# Esto se debe a que Cult actualmente no comprueba a los jugadores que están volando
# Para desactivar, usa -1
max-ping-out-of-flying: 1000

# Marcadores de esquema — toca solo si sabes lo que haces.
#   config-flavor:  V2 = build de Cult 2.x, V3 = Cult 3.x. El plugin se niega
#                   a cargar una config cuyo flavor no coincida con su propio
#                   build; una config V3 abierta por un jar V2 falla rápido en
#                   vez de fusionarse silenciosamente en claves equivocadas.
#   config-version: se incrementa con cada cambio de forma incompatible. Las
#                   configs antiguas se migran automáticamente con el updater
#                   incluido al siguiente arranque.
# Cult siempre actualiza los permisos en caché cuando un jugador entra y cuando
# Cult se recarga, tenga o no LuckPerms instalado.
# Los hooks de eventos de LuckPerms también actualizan inmediatamente los permisos
# de Cult en caché en configuraciones normales.
# Este respaldo periódico solo es necesario para cambios de permisos en línea no
# cubiertos por esos eventos, como un contexto personalizado de LuckPerms que no
# llame a signalContextUpdate, huecos de contexto en Fabric o un proveedor de
# permisos que no sea LuckPerms y cambie permisos en vivo.
# Usa -1 para desactivar el sondeo. Usa un valor positivo para actualizar cada X ticks.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# Hace que los comandos del staff, el autocompletado y las alertas funcionen en todos tus proxies y servidores.
# Guía de configuración: docs/network.md en el código fuente de CultAC. /cult reload aplica los cambios.
# Estas variables de entorno tienen prioridad sobre sus claves cuando están definidas y no vacías:
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # Cómo se comunican tus servidores entre sí:
  #   none         Desactivado. Los comandos y las alertas solo llegan a los jugadores de este servidor.
  #   redis        A través de un servidor Redis (Valkey, KeyDB y Dragonfly también sirven). Rellena la sección redis.
  #   nats         A través de un servidor NATS. Rellena la sección nats.
  #   redisbungee  Proxies Velocity con RedisBungee. Usa su conexión a Redis, no hay nada más que rellenar.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Para poner más de un servidor, sepáralos con comas.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Solo si tu servidor NATS usa cuentas: la ruta a tu archivo .creds.
    credentials-file: ""
    ssl: false
  # El nombre de este servidor en la red. Cada servidor necesita uno propio.
  # Déjalo vacío para usar el id de proxy de RedisBungee, si no cloud.proxy-id, y si no la IP y el puerto de este servidor.
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# Configuración específica de CultAC.
cult:
  # Omite todas las comprobaciones para los jugadores de Bedrock (Geyser/Floodgate) o de Java.
  # Por defecto se comprueban ambas ediciones.
  exempt-bedrock-players: false
  exempt-java-players: false

  checks:
    bedrock-movement:
      # Registra una infracción cuando la desviación de validación de Bedrock alcanza este valor.
      # Incluye el error de movimiento vertical y el exceso de entrada horizontal.
      position-flag-threshold: 0.001

      # Acerca la posición simulada del siguiente tick a la posición indicada por el cliente
      # hasta esta distancia por tick de movimiento. 0 lo desactiva.
      position-reconciliation-step: 0.0005

      # Actualmente solo aparece en los diagnósticos; este valor no genera infracciones.
      velocity-flag-threshold: 0.001

      # Permite corregir la posición de los jugadores de Bedrock.
      # Actualmente se aplica al conectarse; los cambios requieren volver a conectarse.
      enable-setbacks: true

    fair-reach:
      # Variación temporal alrededor del intervalo de seguimiento de 50 ms de FairReach.
      # En milisegundos; 15 establece una ventana de 35–65 ms.
      max-position-packet-jitter-ms: 15

      # Espera máxima antes de aplicar una actualización de posición del objetivo, en milisegundos.
      # Las actualizaciones confirmadas por el cliente se aplican antes.
      max-ping-compensation-ms: 300

      # Cancela ataques a jugadores cuya hitbox más cercana posible está más lejos que el alcance
      # vanilla del atacante (entity_interaction_range) más esta distancia, en bloques.
      reach-leniency: 0.1

    autoclicker-limit:
      # Promedio de clics por segundo por encima del cual aumenta el acumulador del autoclicker.
      # Se calcula en grupos de 50 movimientos de brazo válidos para la comprobación.
      max-cps: 25

    explosion:
      # Las correcciones de posición por explosiones también requieren superar
      # el nivel de infracciones establecido para la corrección en esta comprobación.

      # Error acumulado de movimiento por explosiones necesario para intentar corregir la posición.
      max-advantage: 1

      # Error de una sola explosión necesario para intentar corregir la posición
      # sin esperar a que el error acumulado alcance max-advantage.
      immediate-setback-threshold: 0.01

      # Multiplica el error acumulado por este valor cuando la desviación de la respuesta
      # a una explosión baja de Explosion.threshold. Los valores cercanos a 1 lo reducen más despacio.
      setback-decay-multiplier: 0.98

      # Error acumulado máximo de explosiones que conserva la comprobación.
      max-ceiling: 2

  prediction:
    # Solo regula las correcciones de movimiento; superar este porcentaje nunca registra infracciones por trampas.
    # El historial se conserva al dejar de usar un objeto, volver a usarlo o corregir la posición.
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # Compara el tiempo real que el servidor pasa usando un objeto (comer, beber,
    # cargar) con los ticks ralentizados que el cliente declara en ese tiempo. Una deuda
    # superior a max-debt-ticks marca ItemUseBurst; el valor por defecto cubre un frame
    # tardío del cliente (10 ticks) más redondeo. El crédito solo proviene de ticks ralentizados adicionales.
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # Porcentaje de cada tick de uso esperado que debe pagarse con un tick ralentizado.
      charge-percent: 95

    # Ping de transacciones o tiempo sin paquetes de movimiento máximo tolerado
    # mientras hay un retroceso pendiente, en milisegundos.
    # Se añaden 50 ms fijos antes de corregir la posición por latencia.
    max-knockback-ping-ms: 1000

    # Tiempo sin paquetes de movimiento antes de comprobar si corresponde una corrección
    # por latencia, en milisegundos. La simulación debe indicar que permanecer
    # inmóvil no era válido para que se corrija la posición.
    max-freeze-time-ms: 5000

  networking:
    # Sustituye la salud enviada de otras entidades vivas por 1 punto de salud.
    # Conserva la salud propia del observador, la de su montura actual y la de las entidades muertas.
    # Los observadores con cult.showhealth reciben los valores de salud reales.
    spoof-health: false

  client-brand:
    # Elimina la primera coincidencia de esta expresión regular de las marcas de cliente recibidas.
    # Por defecto elimina el sufijo final " (Velocity)".
    # Usa una cadena vacía para desactivarlo.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:

    # Escribe en la consola diagnósticos de teletransportes, correcciones de posición y resincronizaciones.
    teleports: false

    bedrock-movement:
      # Activa informes detallados de movimiento de Bedrock y los registros de predicción asociados,
      # sujetos a los filtros y al intervalo mínimo indicados abajo.
      enabled: false

      # Incluye también movimientos sin infracciones cuya desviación de validación
      # alcance min-offset.
      log-clean-offsets: false

      # Desviación de validación mínima para informar de movimientos sin infracciones.
      # Solo se usa cuando log-clean-offsets es true.
      min-offset: 1.0e-7

      # Intervalo mínimo entre informes de movimiento de Bedrock por jugador, en segundos.
      # Usa 0 para eliminar el intervalo de espera.
      cooldown-seconds: 10

# The version of the check names this server uses outside punishments.yml: the names each check's
# own settings are written under in this file (AttackEntityVisibility.setbackvl), the names in its
# permission nodes (cult.exempt.attackentityvisibility), and the names alerts, logs, placeholders
# and the API show.
# Cult never changes it. Raise it yourself, after you have renamed those settings and permission nodes:
#   1: AttackMobVisibility, bAttackMobVisibility. InteractEntityVisibility covers players too.
#   2: AttackEntityVisibility, bAttackEntityVisibility. InteractPlayerVisibility covers players,
#      InteractEntityVisibility everything else.
#   3: MultiActionsC, D and H are InventoryA, B and C. MultiActionsI, J, K, L and S are one
#      check, InventoryD, whose verbose names the action. MultiActionsM, N, O, P, Q, R and T
#      are InventoryE to K. MultiActionsE, F and G are MultiActionsC, D and E.
# A file without this line is read as version 1.
check-name-version: 3

config-flavor: V2
config-version: 20
