# Основна конфігурація CultAC
# Вихідний код: https://github.com/CultAC/CultAC
# Авторське право 2025 DefineOutside та співавтори, ліцензія GPLv3.
# Модифіковані бінарні файли або плагіни зі скопійованим кодом cult мають бути приватними
# або з повним вихідним кодом, доступним покупцям без додаткової плати.

alerts:
    # Окрім розсилки сповіщень гравцям, чи надсилати їх також у консоль?
    print-to-console: true
    # Керує тим, чи і як сповіщення передаються між серверами, підключеними до вашого проксі.
    # Якщо використовується Velocity, у його конфігурації має бути ввімкнено 'bungee-plugin-message-channel'.
    proxy:
        # Чи надсилати сповіщення іншим серверам, підключеним до вашого проксі?
        send: false
        # Чи показувати на цьому сервері сповіщення, отримані з інших серверів?
        receive: false
    # Область сповіщень для персоналу, який не обрав її через /cult alerts scope: server або global.
    # global діє лише з увімкненими мережевими сповіщеннями; інакше використовується server.
    default-scope: server

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Бренд клієнта не буде показуватися операторам, якщо він збігається з одним із цих регулярних виразів
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Приховувати всіх спостерігачів із дозволом cult.spectator, незалежно від того, чи вони зараз справді спостерігають
    hide-regardless: false
    # Спостерігачі будуть приховані лише в цих світах; залиште порожнім, щоб дозволити всі світи
    allowed-worlds:
        - ""

# Скільки часу дається гравцям, перш ніж ми кікнемо їх за тайм-аут? За замовчуванням = 60 секунд
max-transaction-time: 60

# Якщо збій стався в самому CultAC (не вдалося підключитися до гравця або версія клієнта не підтримується), дозволити гравцю
# грати без перевірок замість відключення. Кіки за флуд пакетами, краш-експлойти та пінги, на які не відповіли
# довше за max-transaction-time, усе одно застосовуються.
launch-safety:
  fail-open: true

# Увімкніть, щоб Cult не скасовував понги (pong), отримані від гравців.
# Це може покращити сумісність з іншими античитами, але спричинити проблеми з обмежувачами пакетів.
# Не вмикайте, якщо не впевнені, що робите.
disable-pong-cancelling: false

# Чи вимкнути стандартний обробник ресинхронізації блоків?
# За замовчуванням Cult зчитує блоки зі світу сервера й надсилає їх клієнту, щоб виправити розсинхронізацію.
# Якщо ви використовуєте плагіни, що створюють фальшиві блоки на основі пакетів (яких немає у світі сервера),
# встановіть true, щоб Cult не перезаписував їх повітрям/справжніми блоками.
# Це примусово вмикає обробник "NoOp" (без операцій), якщо через API не задано власний.
disable-default-resync-handler: false

# Чи скасовувати дубльований пакет руху?
# Mojang виправила це в 1.21. Це була їхня спроба виправити "розсинхронізацію відра". https://bugs.mojang.com/browse/MC-12363
# Цей параметр стосується лише клієнтів 1.17-1.20.5 на серверах 1.8.
cancel-duplicate-packet: true

# Чи ігнорувати поворот у дубльованих пакетах
ignore-duplicate-packet-rotation: false

# Скільки кліків в інвентарі дозволено за один серверний тік?
# Усі кліки після досягнення цього порогу скасовуються.
# Встановіть -1, щоб вимкнути.
max-clicks-per-tick: 3

# Фіксувати порушення й надсилати сповіщення без жодних дій: без команд покарання, відкатів, скасування пакетів і кіків. Пакети клієнта доходять до сервера в незмінному вигляді.
# CULTAC_OBSERVE_ONLY має пріоритет над цим ключем, якщо дорівнює true, 1 або yes, чи false, 0 або no. Зміна застосовується через /cult reload.
observe-only: false

Simulation:
    # На скільки множити загальну перевагу, коли гравець грає чесно
    # Ось як виглядає конфігурація за замовчуванням (вісь x = секунди, вісь y = 1/1000 блока): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Яке відхилення від руху гравця вважати порушенням?
    # Вимірюється в блоках від можливого руху
    # Ми враховуємо Optifine, перемикаючи тригонометричні таблиці, але зниження цього значення до 0.001 зменшить
    # спрацювання античита на FastMath, якщо ця компенсація не спрацює...
    threshold: 0.001
    # Наскільки велике порушення за один тік, щоб гравця одразу відкотило?
    # -1, щоб вимкнути
    immediate-setback-threshold: 0.1
    # Наскільки велика перевага за всі тіки, щоб ми почали відкочувати гравця?
    # -1, щоб вимкнути
    max-advantage: 1
    # Через 50 секунд зі стандартною конфігурацією перевага гравця зменшиться з 4 блоків до 1 блока
    # Це потрібно, щоб гравець не накопичував стільки порушень, що вже ніколи не зможе їх позбутися
    # Стандартна стеля переваги (вісь x = секунди, вісь y = 1/1000 блока): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Поріг рівня порушень для відкату
    # 1 для старої поведінки
    setback-violation-threshold: 1

# Перевіряє, чи гравець увійшов у блок під час руху
Phase:
    setbackvl: 1 # Проникнення в блоки може дозволити лазити по стінах, до того ж ця перевірка відносно стабільна
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Перевірка NoSlow на основі передбачення
# Cult враховує глючний мережевий код... тут складно отримати хибне спрацювання навіть при спамі правою кнопкою та кнопкою другої руки
# Набагато стабільніше, ніж в інших античитах, але, будь ласка, повідомляйте про хибні спрацювання... я виправив тут купу проблем мережевого коду.
NoSlow:
    # Яке відхилення вважається "читерством"
    # За замовчуванням воно нижче, ніж інші відхилення
    # З увімкненим NoSlow стабільно спрацьовує на 0.03-0.2
    threshold: 0.001
    # Швидко відкочувати на першому ж предметі, щоб прибрати будь-яку перевагу від NoSlow
    setbackvl: 5
    # Зменшується, коли гравець використовує предмет І сповільнюється через нього
    decay: 0.05

Knockback:
    # На скільки множити загальну перевагу, коли гравець грає чесно
    setback-decay-multiplier: 0.999
    # Яке відхилення від швидкості гравця вважати порушенням?
    # Вимірюється в блоках від можливої швидкості
    threshold: 0.001
    # Наскільки велике порушення за один тік, щоб гравця одразу відкотило?
    # -1, щоб вимкнути
    immediate-setback-threshold: 0.1
    # Наскільки велика перевага за всі тіки, щоб ми почали відкочувати гравця?
    # -1, щоб вимкнути
    max-advantage: 1
    # Це потрібно, щоб гравець не накопичував стільки порушень, що вже ніколи не зможе їх позбутися
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # Мілісекунди, які гравець може накопичити, щоб використати пізніше, коли відстає
    # Занадто велике значення потенційно дозволить обходи fast use/fast heal/fast bow на 1.8; 120 мс — схоже, хороший баланс
    drift: 120

# DumbTimer обмежує, наскільки рух може відставати від реального часу.
# Ключ конфігурації TimerLimit збережено для сумісності; саму перевірку TimerLimit видалено.
TimerLimit:
    # Максимальне відновлюване відставання руху в мілісекундах.
    # Великі сплески пакетів понад цей запас можуть спричинити відкати.
    # -1 вимикає обмеження відставання
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Скільки мілісекунд може бути втрачено під час руху, перш ніж почнуться спрацювання
    drift: 1200

# Той самий метод перевірки, що й TimerA, але для транспорту
VehicleTimer:
    # Ціль — таймер 1.005
    setbackvl: 10

PacketOrderI:
    # увімкніть, якщо на гравців спрацьовує перевірка через моди з анімаціями 1.7
    exempt-placing-while-digging: false

Reach:
    # На скільки розширювати хітбокси? 0.0005 має виявляти дальність 3.0005+
    #
    # Через зміни й обмеження протоколу існує примусове розширення 0.03 для 1.9-1.18.1 (не 1.18.2) та деяких
    # комбінацій клієнта й сервера. Ця перевірка найефективніша з клієнтами 1.7/1.8 на серверах 1.8.
    threshold: 0.0005
    # Чи скасовувати удари, які точно неможливі?
    # Удари на 3.00-3.03 можуть проходити, але все одно фіксуватимуться через обмеження порядку пакетів
    block-impossible-hits: true
    # Надсилає додатковий пакет у кінці кожного тіку, щоб підвищити ймовірність виявлення читів
    # Вбудовується в список з'єднань сервера, щоб надіслати фінальний пакет просто перед тим, як сервер виконає flush
    # Увімкнення збільшить використання трафіку для всіх гравців
    # Загальну продуктивність сервера це не знизить
    # Увімкнення дозволить ловити більше читерів.
    # Навіть вимкнений, він усе одно ловитиме читерів і не спричинятиме хибних спрацювань
    # Якщо ваш сервер не орієнтований на PvP 1.8, цей додатковий пакет не рекомендується
    enable-post-packet: false

exploit:
    # Під час стрибків зі спринтом на елітрах можна набрати дуже високу швидкість; значення false запобігає цьому експлойту
    # Mojang зіпсувала мережевий код: політ на елітрах починається на клієнті, а закінчується на сервері
    # Елітри мають горизонтальне тертя 0.99, тож постійне додавання горизонтальної швидкості 0.2 дає дуже високі швидкості.
    allow-sprint-jumping-when-using-elytra: true
    # Пом'якшує встановлення блоків гравцем на блоки-примари, ресинхронізуючи гравця, коли це стається
    allow-building-on-ghostblocks: true
    # Цей параметр, залежний від попереднього, задає відстань для пошуку блоків-примар
    # Допустимий діапазон обмежений від 2 до 4
    distance-to-check-if-ghostblocks: 2

# Увімкніть, щоб під час входу гравця записувати в лог плагіни, які вбудувалися в netty, — для налагодження проблем сумісності
debug-pipeline-on-join: false

# Вмикає експериментальні перевірки
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Cult іноді скасовує недопустимі пакети, наприклад при таймері; після скількох скасованих пакетів за секунду
# варто просто кікнути гравця? Це потрібно, бо деякі обмежувачі пакетів не враховують пакети, скасовані cult.
packet-spam-threshold: 100
# Увімкніть, щоб виводити stacktrace, коли гравця кікнуто через packet-spam-threshold
debug-packet-cancel: false

# Cult може вимагати, щоб у гравця, виведеного зі стану польоту, пінг не перевищував X мілісекунд
# Це тому, що зараз Cult не перевіряє гравців, які літають
# Щоб вимкнути, встановіть -1
max-ping-out-of-flying: 1000

# Максимальний пінг, коли з гравця знімається прискорення від феєрверка.
# Не дає гравцям з високою затримкою використовувати одне прискорення феєрверком на елітрах нескінченно.
max-ping-firework-boost: 1000

# Cult завжди оновлює кешовані дозволи, коли гравець заходить і коли Cult перезавантажується,
# незалежно від того, чи встановлено LuckPerms.
# У звичайних конфігураціях обробники подій LuckPerms також одразу оновлюють кешовані дозволи Cult.
# Це періодичне оновлення потрібне лише для змін дозволів онлайн, які не покриваються
# цими подіями, наприклад власний контекст LuckPerms, що не викликає signalContextUpdate,
# прогалини контекстів у Fabric або інший провайдер дозволів, що змінює їх на льоту.
# Встановіть -1, щоб вимкнути опитування. Встановіть додатне значення, щоб оновлювати кожні X тіків.
update-permission-ticks: -1

# Лише для Velocity: спільний секрет для зв'язку з компаньйоном CultAC на бекенд-серверах.
# Залиште порожнім, щоб використовувати секрет modern-forwarding з Velocity; компаньйон має використовувати те саме значення.
# Використовуйте довге випадкове значення (щонайменше 32 символи): коротке можна підібрати офлайн.
bridge:
  secret: ""

# Вивантаження записаної гри в сервіс прийому даних, який її аналізує. Вимкнено, поки url або api-key порожні;
# обидва значення надає ваш сервіс прийому. CULTAC_CLOUD_URL і CULTAC_CLOUD_API_KEY мають пріоритет над url та api-key,
# якщо задані й не порожні, а порожній proxy-id бере CULTAC_PROXY_ID. Що саме вивантажується, описано в
# docs/cloud-upload.md у вихідному коді CultAC.
cloud:
  # false зупиняє вивантаження, незалежно від CULTAC_CLOUD_*; застосовується через /cult reload.
  enabled: true
  url: ""
  api-key: ""
  # Id сервера для кожного сокета вивантаження. {server} — це назва бекенду на проксі та власна назва сервера на
  # сервері; {proxy} — це proxy-id. Порожнє значення означає {proxy}.{server} на проксі та {server} на сервері.
  # Учасники, що використовують один api-key, повинні мати різні id.
  server-id: ""
  # Ім'я цього проксі серед учасників, що використовують один api-key; обов'язкове, поки server-id містить {proxy}.
  # На сервері це власна назва сервера, і вона обов'язкова.
  proxy-id: ""
  # Якщо true, надсилає в сервіс прийому вибірки стеків CPU та виділення пам'яті цього сервера: короткі профілі на
  # його запит, записані поза головним потоком. За замовчуванням вимкнено; CULTAC_CLOUD_PERF (true/1/yes, false/0/no) має пріоритет, якщо заданий.
  perf: false
  # Якщо true, сокети вивантаження також передають UUID, ім'я та роль у порталі (viewer, moderator або admin)
  # гравців із дозволами cult.portal.viewer, .moderator або .admin, а також збережену роль синхронізованих гравців, які
  # офлайн, коли сервіс прийому про це запитує, — щоб хмарний портал показував їх в організації цього сервера, поки
  # в ній увімкнена синхронізація команди. За замовчуванням вимкнено; CULTAC_CLOUD_TEAM_SYNC (true/1/yes, false/0/no) має пріоритет, якщо заданий.
  team-sync: false
  # Бани з панелі: модератори банять гравця в хмарній панелі, а той один сервер, що забрав бан, виконує його один раз
  # від імені консолі, зокрема й у режимі observe-only. Плейсхолдери: %player% %uuid% %reason% %reason_label% (причина
  # так, як її бачив модератор) %cheat% %cheat_id% %duration% (30m, 12h, 7d; для безстрокового бану — значення, яке ваша
  # політика банів надсилає для Permanent, за замовчуванням порожнє) %seconds% %silent% (прапорець тихого бану,
  # наприклад -s, якщо модератор позначив Silent) %staff% %ban_id% %link% %staff_uuid% (Minecraft UUID модератора, що
  # видав бан, якщо панель його знає) %evidence% (посилання на докази, на яких ґрунтується бан, наприклад повтор);
  # обидва порожні, якщо невідомі.
  # Слово, плейсхолдер якого порожній, пропускається: --sender=%staff_uuid% зникає, а не залишає --sender=.
  # %reason%, %reason_label% і %staff% можуть містити пробіли, тож безпечні лише в кінці: ставте %reason% останнім.
  # На сервері Paper вказуйте команду плагіна банів із простором імен, наприклад litebans:ban, щоб сервер без цього
  # плагіна ніколи не виконав minecraft:ban. Приклади для поширених плагінів банів: docs/cloud-upload.md у вихідному
  # коді CultAC.
  staff-ban:
    # Виконує кожен бан із панелі, якщо містить %duration% ("ban %silent% %uuid% %duration% %reason%" для LiteBans),
    # інакше — безстрокові бани та бани, тривалість яких визначає ваш сервер. Порожнє значення: їх виконує
    # temp-command, якщо може.
    command: ""
    # Необов'язково: виконує тимчасові бани замість command, наприклад "tempban %silent% %player% %duration% %reason%".
    # Порожнє значення: тимчасові бани виконує command, якщо він містить %duration% або %seconds%, інакше цей сервер
    # їх ніколи не бере.
    temp-command: ""

# Дозволяє командам модераторів, автодоповненню та сповіщенням працювати на всіх ваших проксі й серверах.
# Інструкція з налаштування: docs/network.md у вихідному коді CultAC. Зміни застосовуються через /cult reload.
# Будь-який параметр тут можна також задати змінною середовища CULTAC_NETWORK_*, яка має пріоритет.
network:
  # Як ваші сервери спілкуються між собою:
  #   none         Вимкнено. Команди та сповіщення доходять лише до гравців на цьому сервері.
  #   redis        Через сервер Redis (також підходять Valkey, KeyDB і Dragonfly). Заповніть секцію redis.
  #   nats         Через сервер NATS. Заповніть секцію nats.
  #   redisbungee  Проксі Velocity з RedisBungee. Використовує його з'єднання з Redis, більше нічого заповнювати не треба.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Щоб указати кілька серверів, розділіть їх комами.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Лише якщо ваш сервер NATS використовує облікові записи: шлях до вашого файлу .creds.
    credentials-file: ""
    ssl: false
  # Ім'я цього сервера в мережі. Кожен сервер повинен мати власне.
  # Залиште порожнім, щоб використовувати id проксі RedisBungee, потім cloud.proxy-id, потім IP і порт цього сервера.
  instance-id: ""

# Лише для Velocity: нумеровані збірки, що встановлюються через /cult update <build>, /cult update latest [branch] і
# перелічуються через /cult update builds [branch]. Змінна середовища CULTAC_UPDATE_* кожного параметра має пріоритет, якщо задана й не порожня.
update:
  # owner/repo, у релізах GitHub якого лежать збірки. Порожнє значення — репозиторій, з якого зібрано цей jar.
  # CULTAC_UPDATE_REPOSITORY.
  repository: ""
  # Ключ Ed25519 у форматі X.509 base64, яким мають бути підписані маніфести збірок. Порожнє значення — власний ключ збірок CultAC.
  # CULTAC_UPDATE_PUBKEY.
  public-key: ""
  # Файл, що запам'ятовує встановлену збірку, яку наступний запуск завантажить знову. Відносно цієї папки; порожнє значення —
  # update-state.json. CULTAC_UPDATE_STATE.
  state-file: ""
  # Збірка для запуску, поки жодна збірка не запам'ятована. Порожнє значення запускає вбудований jar. CULTAC_UPDATE_BUILD.
  build: ""
  # Надсилається лише на api.github.com і підвищує погодинний ліміт для latest і builds. CULTAC_UPDATE_TOKEN.
  token: ""
  # URL, який отримує рядок результату кожного оновлення. CULTAC_UPDATE_WEBHOOK.
  webhook: ""

# Маркери схеми — змінюйте, лише якщо знаєте, що робите.
#   config-flavor:  V2 = збірка Cult 2.x, V3 = Cult 3.x. Плагін відмовляється
#                   завантажувати конфігурацію, flavor якої не збігається з його
#                   збіркою, тож конфігурація V3, відкрита jar-файлом V2, одразу
#                   спричиняє помилку, а не тихо зливається в неправильні ключі.
#   config-version: збільшується при кожній несумісній зміні структури. Старі
#                   конфігурації автоматично мігрують вбудованим оновлювачем
#                   під час наступного запуску.
config-flavor: V2
config-version: 18
