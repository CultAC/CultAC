# CultACのメイン設定
# ソースコード: https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside and contributors, Licensed under GPLv3.
# 改変されたバイナリやCultのコードをコピーしたプラグインは、私的なものとするか、
# 購入者に追加料金なしで完全なソースコードを公開する必要があります

# "セットバック"は、Cultによってプレイヤーの違反が検知された際、プレイヤーを元の位置/状態に戻すことを意味します。

alerts:
    # アラートを、プレイヤーに送信するだけでなくコンソールにも送信するかどうか。
    print-to-console: true
    # これは、プロキシに接続された他のサーバー間でアラートが共有される方法を制御します。
    # Velocityを使用している場合は、Velocityの設定で 'bungee-plugin-message-channel' を有効にする必要があります。
    proxy:
        # プロキシに接続された他のサーバーにアラートを送信するかどうか。
        send: false
        # プロキシに接続された他のサーバーからのアラートを受信するかどうか。
        receive: false
    # /cult alerts scope で範囲を選んでいないスタッフのアラート範囲: server または global。
    # global はネットワーク全体のアラートが有効な場合のみ適用され、それ以外は server になります。
    default-scope: server

verbose:
    print-to-console: false

client-brand:
    # プレイヤーのクライアントブランドが以下の正規表現のいずれかと一致する場合、オペレータにはそのプレイヤーの情報が送信されません。
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # 'cult.spectator' パーミッションを持つプレイヤーを、実際にスペクテイター状態でなくても非表示にするかどうか。
    hide-regardless: false
    # スペクテイター状態のプレイヤーを指定したワールドでのみ非表示にする。（空欄にするとすべてのワールドで有効）
    allowed-worlds:
        - ""

# プレイヤーがタイムアウトでKickされるまでの時間を設定します。 | デフォルト= 60(秒)
max-transaction-time: 60

# CultAC自体が失敗した場合（プレイヤーに接続できない、クライアントバージョンが非対応）、切断せずに検査なしで
# プレイを続けさせます。パケットフラッド、クラッシュエクスプロイト、max-transaction-time内にpingの応答がない
# 場合のKickは引き続き有効です。
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # プレイヤーが違反をしていない場合、違反の度合いをどれだけ減らすかの倍率。
    # デフォルト設定のグラフ（x軸 = 秒, y軸 = 1/1000ブロック）: https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # プレイヤーの動きが、シミュレーションからどれだけズレた場合に違反とみなすか。
    # シミュレーションされた動きからのズレをブロック単位で設定します。
    # OptifineのFastMath(計算の最適化)に対応するために計算テーブルを切り替え、0.001に下げるとFastMathによる誤検知を軽減します。
    # ただし、この補正がうまく機能しない場合、Cultがプレイヤーを不正と判断する可能性があります...
    threshold: 0.001
    # プレイヤーを即座にセットバックする前に、シミュレーションされた動きとプレイヤーの実際の動きの間にどれだけの違反が必要かを指定します。
    # -1で無効化できます。
    immediate-setback-threshold: 0.1
    # 全ティックでのシミュレーションとの累積ズレがこの値を超えたらリセットを開始します。
    # -1で無効化できます。
    max-advantage: 1
    # デフォルト設定では、50秒経過すると、プレイヤーのアドバンテージが4ブロックから1ブロックに減少します。
    # これは、プレイヤーが違反を蓄積しすぎて、違反を解消できなくなるのを防ぐためです。
    # デフォルトのアドバンテージの上限 (x軸 = 秒, y軸 = 1/1000ブロック): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4

# プレイヤーが移動中にブロックに入ったかどうかをチェックします。
Phase:
    setbackvl: 1 # 1ブロック以上のズレがある場合に違反と判断します。
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# 予測に基づく「NoSlow」チェック
# Cultは、バグのあるネットコードを考慮しており、右クリックやオフハンドボタンを連打しても誤検知が起こりにくくなっています。
# 他のアンチチートよりも安定していますが、もし誤検知があれば報告してください。ネットコードの問題を多数修正しています。
NoSlow:
    # どれだけのズレが「チート」として扱われるか
    # デフォルトで他のズレ基準よりも低めに設定されています
    # NoSlow（速度低下なし）の状態では、0.03〜0.2の範囲で一貫してフラグが立ちます
    threshold: 0.001
    # NoSlowによるアドバンテージを無効化するため、最初の項目で即座にセットバックさせます
    setbackvl: 5
    # プレイヤーがアイテム使用時に速度低下が発生する場合、この値によりアドバンテージの累積が減少します
    decay: 0.05

Knockback:
    # プレイヤーが違反していない場合、総アドバンテージにどれだけの倍率を掛けるか
    setback-decay-multiplier: 0.999
    # プレイヤーの速度からどれだけズレたら違反とみなすか
    # 許容速度からのズレをブロック単位で測定します
    threshold: 0.001
    # プレイヤーが即座にセットバックされる前に、1ティックで発生しなければならない違反のしきい値
    # -1で無効化できます
    immediate-setback-threshold: 0.1
    # 全ティックでの累積アドバンテージがこの値を超えたらセットバックを開始します
    # -1で無効化できます
    max-advantage: 1
    # 違反が過剰に蓄積し、リセットが難しくなるのを防ぐための上限です
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # プレイヤーがネットワーク遅延やラグの影響で操作がサーバーの予測より遅れている場合、
    drift: 120

PacketOrderI:
    # プレイヤーが1.7のアニメーションMODを使用したことで検出されている場合に有効にします
    exempt-placing-while-digging: false

Reach:
    # ヒットボックスをどれだけ拡大するかを設定します。0.0005に設定することで3.0005以上のリーチを検出できます
    #
    # プロトコルの変更や制限により、1.9〜1.18.1（1.18.2を除く）や
    # 一部のクライアント/サーバーの組み合わせでは、強制的に0.03の拡大が適用される場合があります。
    # このチェックは1.7/1.8クライアントが1.8サーバーに接続した際に最も効果的です。
    threshold: 0.0005
    # 不可能なヒット（距離的に届かない攻撃）をキャンセルするか
    # 3.00〜3.03のリーチによるヒットが通る場合がありますが、パケット順序の制限によりフラグが立つこともあります
    block-impossible-hits: true

exploit:
    # エリトラでダッシュジャンプを行うと非常に高い速度を得られるエクスプロイト（意図しない挙動）があります。
    # この設定をfalseにすると、そのエクスプロイトを防ぎます
    # Mojangのネットコードにより、エリトラの動作は開始がクライアント側、終了がサーバー側で処理されるためにズレが生じています。
    # エリトラは水平摩擦0.99を持ち、水平速度0.2が常に追加されると非常に高速度になります。
    allow-sprint-jumping-when-using-elytra: true

    # このオプションは、ゴーストブロックが発生したときにプレイヤーを再同期させることで、
    # ゴーストブロックへのブロック設置をできるだけ制限します
    allow-building-on-ghostblocks: true

    # 上記の設定に基づき、ゴーストブロックのチェック距離を定義します
    # 設定可能な範囲は2から4です
    distance-to-check-if-ghostblocks: 2

# 実験的なチェックを有効にします
experimental-checks: false

# Cultは "Timer" のような違反パケットをキャンセルすることがありますが、1秒間にキャンセルされたパケット数がXを超えた場合、
# プレイヤーを強制的にキックしますか？これは、いくつかのパケットリミッターがCultによってキャンセルされたパケットをカウントしないためです。
packet-spam-threshold: 100

# Cultは、飛行状態を解除されたプレイヤーがXミリ秒以上のPingを持つことを許可しません
# これは、現在Cultが飛行中のプレイヤーをチェックしていないためです
# 無効にするには、-1を設定してください
max-ping-out-of-flying: 1000

# スキーマ用マーカー — 内容を理解した上でのみ変更してください。
#   config-flavor:  V2 = Cult 2.x ビルド、V3 = Cult 3.x。プラグインは自身の
#                   ビルドと flavor が一致しない設定の読み込みを拒否します。
#                   V3 用設定を V2 jar で開いた場合は、誤ったキーへ静かに
#                   マージされず、即座に失敗します。
#   config-version: 互換性のない形式変更があるたびに増加します。古い設定は
#                   次回起動時、同梱の updater が自動で移行します。
# LuckPerms がインストールされているかどうかに関係なく、プレイヤー参加時と
# Cult のリロード時には、Cult は常にキャッシュ済み権限を更新します。
# 通常の構成では、LuckPerms のイベントフックもキャッシュ済みの Cult 権限を
# 即座に更新します。
# この定期的なフォールバックは、それらのイベントで扱われないオンライン中の
# 権限変更にのみ必要です。例: signalContextUpdate を呼ばないカスタム LuckPerms
# コンテキスト、Fabric のコンテキストの不足、または LuckPerms 以外の権限
# プロバイダーが実行中に権限を変更する場合。
# ポーリングを無効化するには -1 にします。正の値にすると X tick ごとに更新します。
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# スタッフ用コマンド、Tab 補完、アラートを、すべてのプロキシとサーバーをまたいで使えるようにします。
# 設定ガイド：CultAC のソース内の docs/network.md。変更は /cult reload で反映されます。
# 次の環境変数は、設定されていて空でなければ、対応するキーより優先されます：
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # サーバー同士のつなぎ方：
  #   none         オフ。コマンドとアラートはこのサーバーのプレイヤーにだけ届きます。
  #   redis        Redis サーバー経由（Valkey、KeyDB、Dragonfly も使えます）。redis の項目を埋めてください。
  #   nats         NATS サーバー経由。nats の項目を埋めてください。
  #   redisbungee  RedisBungee を入れた Velocity プロキシ。その Redis 接続を使うので、ほかに埋める項目はありません。
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # 複数のサーバーを指定するときは、カンマで区切ります。
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # NATS サーバーがアカウントを使う場合のみ：.creds ファイルのパス。
    credentials-file: ""
    ssl: false
  # ネットワーク上でのこのサーバーの名前。サーバーごとに別の名前が必要です。
  # 空にすると RedisBungee のプロキシ ID、なければ cloud.proxy-id、それもなければこのサーバーの IP とポートを使います。
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# CultAC 固有の設定。
cult:
  # Bedrock プレイヤー（Geyser/Floodgate）または Java プレイヤーのすべてのチェックを省略します。
  # 既定では両方のエディションをチェックします。
  exempt-bedrock-players: false
  exempt-java-players: false

  checks:
    bedrock-movement:
      # Bedrock の検証誤差がこの値に達すると違反として検出します。
      # 垂直移動の誤差と、許容範囲を超えた水平入力を含みます。
      position-flag-threshold: 0.001

      # 次の tick のシミュレーション位置を、移動 tick ごとに最大この距離だけ
      # クライアント申告位置へ近づけます。0 で無効になります。
      position-reconciliation-step: 0.0005

      # 現在は診断情報への表示にのみ使用されます。この値によって違反が検出されることはありません。
      velocity-flag-threshold: 0.001

      # Bedrock プレイヤーの位置補正を許可します。
      # 現在は接続時に適用されるため、変更を反映するには再接続が必要です。
      enable-setbacks: true

    fair-reach:
      # FairReach の追跡更新間隔 50 ms に対して許容する時間の変動幅です。
      # 単位はミリ秒です。15 にすると更新の時間枠は 35～65 ms になります。
      max-position-packet-jitter-ms: 15

      # 対象の位置更新を適用するまでの最大待機時間です。単位はミリ秒です。
      # クライアントが受信を確認した更新は、待機時間よりも早く適用されます。
      max-ping-compensation-ms: 300

      # 対象プレイヤーの取り得る最も近い当たり判定までの距離が、攻撃者のバニラのリーチ
      # (entity_interaction_range) にこの値を加えた距離を超える攻撃をキャンセルします。単位はブロックです。
      reach-leniency: 0.1

    autoclicker-limit:
      # この平均クリック数を超えると、オートクリッカー検出の蓄積値が増加します。
      # 単位は毎秒のクリック数で、検査対象となる腕振り 50 回ごとに計算します。
      max-cps: 25

    explosion:
      # 爆発による位置補正には、この検査で設定されている
      # 位置補正用の違反レベルを超えていることも必要です。

      # 位置補正を試みるために必要な、爆発による移動誤差の累積値です。
      max-advantage: 1

      # 累積誤差が max-advantage に達するのを待たずに位置補正を試みるための、
      # 1 回の爆発による誤差のしきい値です。
      immediate-setback-threshold: 0.01

      # 爆発への応答の誤差が Explosion.threshold を下回った場合、
      # 累積誤差にこの値を掛けます。1 に近いほど累積誤差の減少が遅くなります。
      setback-decay-multiplier: 0.98

      # この検査で保持する爆発の累積誤差の上限です。
      max-ceiling: 2

  prediction:
    # 移動補正のみを行う設定です。この割合を超えてもチートによる違反としては記録しません。
    # アイテムの使用を中断・再開した場合や、位置補正が行われた場合も履歴は保持されます。
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # サーバーがアイテムを使用していた実時間（食べる、飲む、引き絞るなど）と、
    # その間にクライアントが申告した減速 tick 数を比較します。max-debt-ticks を超える
    # 不足は ItemUseBurst として検知されます。既定値は遅れたクライアントフレーム 1 回分
    # （10 tick）と丸め誤差を許容します。余剰分は追加の減速 tick からのみ得られます。
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # 想定される使用 tick ごとに、減速 tick で支払う必要がある割合（パーセント）。
      charge-percent: 95

    # ノックバックへの応答を待っている間に許容する、トランザクションの応答遅延、
    # または移動パケットが届かない時間の上限です。単位はミリ秒です。
    # 遅延による位置補正の前に、固定で 50 ms の猶予が加算されます。
    max-knockback-ping-ms: 1000

    # 移動パケットが届かなくなってから、遅延による位置補正を検討するまでの時間です。
    # 単位はミリ秒です。静止し続けることが不正であるとシミュレーションで判定された場合にのみ、
    # 位置補正を行います。
    max-freeze-time-ms: 5000

  networking:
    # 他の生きているエンティティについて通知する体力を 1 HP に置き換えます。
    # 受信側プレイヤー自身の体力、現在の乗り物、および死亡したエンティティは変更しません。
    # cult.showhealth 権限を持つプレイヤーには実際の体力を送信します。
    spoof-health: false

  client-brand:
    # 受信したクライアントブランドから、この正規表現に最初に一致した部分を削除します。
    # 既定では末尾の " (Velocity)" を削除します。
    # 空文字列にすると無効になります。
    strip-pattern: ' \(Velocity\)$'

  diagnostics:

    # テレポート、位置補正、再同期の診断情報をコンソールに出力します。
    teleports: false

    bedrock-movement:
      # Bedrock の詳細な移動レポートと関連する予測ログを有効にします。
      # 以下のフィルターと最小間隔が適用されます。
      enabled: false

      # 違反が検出されていない移動でも、検証誤差が min-offset に達した場合は
      # レポートに含めます。
      log-clean-offsets: false

      # 違反が検出されていない移動を報告するための、検証誤差の最小値です。
      # log-clean-offsets が true の場合にのみ使用されます。
      min-offset: 1.0e-7

      # 各プレイヤーの Bedrock 移動レポートの最小送信間隔です。単位は秒です。
      # 0 にすると待機時間をなくします。
      cooldown-seconds: 10

# The version of the check names this server uses outside punishments.yml: the names each check's
# own settings are written under in this file (AttackEntityVisibility.setbackvl), the names in its
# permission nodes (cult.exempt.attackentityvisibility), and the names alerts, logs, placeholders
# and the API show.
# Cult never changes it. Raise it yourself, after you have renamed those settings and permission nodes:
#   1: AttackMobVisibility, bAttackMobVisibility. InteractEntityVisibility covers players too.
#   2: AttackEntityVisibility, bAttackEntityVisibility. InteractPlayerVisibility covers players,
#      InteractEntityVisibility everything else.
#   3: MultiActionsC, D and H are InventoryA, B and C. MultiActionsI, J, K, L and S are one
#      check, InventoryD, whose verbose names the action. MultiActionsM, N, O, P, Q, R and T
#      are InventoryE to K. MultiActionsE, F and G are MultiActionsC, D and E.
# A file without this line is read as version 1.
check-name-version: 3

config-flavor: V2
config-version: 20
