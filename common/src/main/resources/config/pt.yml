# Configuração padrão do CultAC
# Código fonte: https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside e contribuidores, Sob licença GPLv3.
# Códigos modificados, ou plugins que utilizam o código do Cult, devem ser privados,
# ou seu código deve estar totalmente disponível para compradores sem quaisquer custos adicionais.

alerts:
    # Além de transmitir alertas para jogadores, eles deveriam ser transmitidos para o terminal também?
    print-to-console: true
    # Isso controla se/como os alertas são compartilhados entre os servidores conectados ao proxy.
    # Deve-se ter 'bungee-plugin-message-channel' habilitado na configuração do Velocity se estiver usando.
    proxy:
        # Deviam os alertas ser enviados para outros servidores conectados no mesmo proxy?
        send: false
        # Deviam os alertas ser recebidos de outros servidores conectados no mesmo proxy?
        receive: false
    # Escopo de alertas da staff que não escolheu um com /cult alerts scope: server ou global.
    # global só vale com os alertas de rede ativos; caso contrário, usa-se server.
    default-scope: server

verbose:
    print-to-console: false

client-brand:
    # Isso signifia que, caso a marca do cliente seja igual às listadas abaixo, não será notificado aos
    # administradores.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Esconde todos espectadores com a permissão 'cult.spectator' mesmo se não estiverem ativamente espectando.
    hide-regardless: false
    # Fará os espectadores serem escondidos apenas nos mundos listados abaixo, deixe em branco para habilitar em todos os mundos.
    allowed-worlds:
        - ""

# Quanto tempo os jogadores tem até expulsarmos eles por inatividade? Padrão = 60 segundos.
max-transaction-time: 60

# Quando o próprio CultAC falha (não consegue se anexar a um jogador ou a versão do cliente não é suportada),
# o jogador continua sem inspeção em vez de ser desconectado. Expulsões por flood de pacotes, exploits de crash
# e pings sem resposta além de max-transaction-time continuam valendo.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # Por quanto deve-se multiplicar a vantagem desde a última vez que falhou uma verificação?
    # Isso é como a configuração padrão se parece (eixo X = segundos, eixo Y = 1/1000 blocos): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # O quão longe o jogador deve estar da área simulada para registrar violações?
    # Medido em blocos do último movimento legítmo.
    # Incluímos o Optifine trocando as tabelas trigonométricas; entretanto, abaixar para 0.001 reduzirá o 'FastMath'
    # de falhar, caso essa compensação não funcionar.
    threshold: 0.001
    # O quão longe o jogador deve estar da área simulada para imediatamente recuá-lo?
    # -1 desabilitará
    immediate-setback-threshold: 0.1
    # Qual é a soma do desalinhamento da simulação em todos os ticks até começarmos a recuar?
    # -1 desabilitará
    max-advantage: 1
    # Depois de 50 segundos, com a configuração padrão, o jogador irá de 4 blocos a 1 bloco de vantagem.
    # Isso serve para previnir o jogador de alcançar violações demais e nunca conseguir se livrar delas.
    # Cela de vantagens padrão (eixo X = segundos, eixo Y = 1/1000 blocos): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4

# Verifica se um jogador entrou em um bloco ao se mover.
Phase:
    setbackvl: 1 # Entrar em blocos possibilita escalar paredes, além disso, essa verificação é relativamente estável.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Verificação de NoSlow por simulação.
# Cult considera erros no netcode. Difícil de gerar falsos positivos, até mesmo spamando o blotão direito e a offhand.
# Muito mais estável que outros anticheats, mas por favor, reporte quaisquer falsos positivos. Eu já arrumei diversos
# erros de netcode.
NoSlow:
    # Quanto de desalinhamento é considerado trapaça?
    # Por padrão é menor que os outros.
    # Em 0.03-0.2 detecta com consistência.
    threshold: 0.001
    # Recuo imediato para inibir as vantagens rapidamente.
    setbackvl: 5
    # Decai quando o jogador usa um item e é efetivamente desacelerado.
    decay: 0.05

Knockback:
    # Por quanto deve-se multiplicar a vantagem desde a última vez que falhou na verificação?
    setback-decay-multiplier: 0.999
    # O quão longe da área do recuo recebido o jogador deve estar para registrar violações?
    # Medido em blocos do recuo recebido.
    threshold: 0.001
    # O quão longe o jogador deve estar da área simulada para imediatamente recuá-lo?
    # -1 desabilitará.
    immediate-setback-threshold: 0.1
    # Qual é a soma do desalinhamento da simulação em todos os ticks até começarmos a recuar?
    # -1 desabilitará.
    max-advantage: 1
    # Isso serve para previnir o jogador de alcançar violações demais e nunca conseguir se livrar delas.
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 0

TimerA:
    setbackvl: 10
    # Milissegundos que o jogador pode acumular para depois usar quando eles têm um atraso no ping.
    drift: 120

PacketOrderI:
    # Ativar se os jogadores estão sendo sinalizados por usar mods de animação 1.7
    exempt-placing-while-digging: false

Reach:
    # Por quanto deve-se expandir as caixas de colisão? 0.0005 deve detectar 3.0005+ de alcance.
    #
    # Há 0.03 de expansão forçada nas versões 1.9-1.18.1 (não a 1.18.2), ou algumas combinações de cliente/servidor por
    # conta de mudanças no protocolo e limitações. Essa verificação é mais poderosa com clientes da 1.7/1.8 em servidores
    # da 1.8.
    threshold: 0.0005
    # Deve-se cancelar hits que sabemos que são impossíveis?
    # O alcance de 3.00-3.03 pode acabar passando, por conta da ordem de pacotes, mas continuará registrando violações.
    block-impossible-hits: true

exploit:
    # Você pode ganhar altas velocidades se pular correndo com uma elytra, previne isso de ocorrer quando definido falso.
    # A Mojang vacilou com o netcode por fazer a Elytra iniciar pelo lado do cliente.
    # As Elytras levam 0.99 de fricção horizontal, então constantemente adicionando 0.2 de velocidade horizontal resulta
    # em velocidades altíssimas.
    allow-sprint-jumping-when-using-elytra: true
    # Essa opção mitiga posicionar blocos em blocos fantasma, ressincronizando o jogador quando isso ocorrer.
    allow-building-on-ghostblocks: true
    # Esse ajuste, influído pela opção acima, define a distância para verificar blocos fantasmas.
    # O valor válido é limitado de 2 a 4.
    distance-to-check-if-ghostblocks: 2

# Habilita verificações experimentais.
experimental-checks: false

# Cult às vezes cancela pacotes ilegais como com o timer, depois de X pacotes em um segundo que foram cancelados, quando
# deve-se simplesmente expulsar o jogador? Isso é requirido já que alguns limitadores de pacotes não contam pacotes
# cancelados pelo Cult.
packet-spam-threshold: 100
# Cult pode impor que o jogador fora do estado de voo não possa ter mais de X milissegundos de ping.
# Isso ocorre porque o Cult atualmente não verifica os jogadores que estão voando.
# -1 desabilitará.
max-ping-out-of-flying: 1000

# Marcadores de esquema — toque apenas se souber o que está fazendo.
#   config-flavor:  V2 = build do Cult 2.x, V3 = Cult 3.x. O plugin se recusa
#                   a carregar uma config cujo flavor não bate com seu próprio
#                   build; uma config V3 aberta por um jar V2 falha
#                   imediatamente em vez de mesclar silenciosamente em chaves
#                   erradas.
#   config-version: incrementado a cada mudança de forma incompatível. Configs
#                   antigas são migradas automaticamente pelo updater embutido
#                   na próxima inicialização.
# O Cult sempre atualiza as permissões em cache quando um jogador entra e quando
# o Cult é recarregado, esteja o LuckPerms instalado ou não.
# Os hooks de eventos do LuckPerms também atualizam imediatamente as permissões
# do Cult em cache em configurações normais.
# Este fallback periódico só é necessário para mudanças de permissões online não
# cobertas por esses eventos, como um contexto personalizado do LuckPerms que não
# chama signalContextUpdate, lacunas de contexto no Fabric ou um provedor de
# permissões diferente do LuckPerms que altera permissões ao vivo.
# Defina -1 para desativar a verificação periódica. Use um valor positivo para atualizar a cada X ticks.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# Faz os comandos da staff, o autocompletar e os alertas funcionarem em todos os seus proxies e servidores.
# Guia de configuração: docs/network.md no código-fonte do CultAC. /cult reload aplica as mudanças.
# Estas variáveis de ambiente têm prioridade sobre as suas chaves quando definidas e não vazias:
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # Como os seus servidores conversam entre si:
  #   none         Desligado. Comandos e alertas só chegam aos jogadores deste servidor.
  #   redis        Por um servidor Redis (Valkey, KeyDB e Dragonfly também funcionam). Preencha a seção redis.
  #   nats         Por um servidor NATS. Preencha a seção nats.
  #   redisbungee  Proxies Velocity com RedisBungee. Usa a conexão Redis dele, não há mais nada para preencher.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Para colocar mais de um servidor, separe-os com vírgulas.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Só se o seu servidor NATS usa contas: o caminho para o seu arquivo .creds.
    credentials-file: ""
    ssl: false
  # O nome deste servidor na rede. Cada servidor precisa do seu próprio.
  # Deixe vazio para usar o id de proxy do RedisBungee, senão cloud.proxy-id, senão o IP e a porta deste servidor.
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# Configuração específica do CultAC.
cult:
  # Ignora todas as verificações para jogadores Bedrock (Geyser/Floodgate) ou Java.
  # Por padrão, ambas as edições são verificadas.
  exempt-bedrock-players: false
  exempt-java-players: false

  checks:
    bedrock-movement:
      # Registra uma infração quando o desvio de validação do Bedrock atinge este valor.
      # Inclui o erro de movimento vertical e o excesso de entrada horizontal.
      position-flag-threshold: 0.001

      # Aproxima a posição simulada do próximo tick da posição informada pelo cliente,
      # até esta distância por tick de movimento. 0 desativa esta opção.
      position-reconciliation-step: 0.0005

      # Atualmente aparece apenas nos diagnósticos; este valor não gera infrações.
      velocity-flag-threshold: 0.001

      # Permite corrigir a posição dos jogadores Bedrock.
      # Atualmente é aplicado ao conectar; alterações exigem reconexão.
      enable-setbacks: true

    fair-reach:
      # Variação de tempo em torno do intervalo de rastreamento de 50 ms do FairReach.
      # Em milissegundos; 15 define uma janela de 35–65 ms.
      max-position-packet-jitter-ms: 15

      # Espera máxima antes de aplicar uma atualização de posição do alvo, em milissegundos.
      # Atualizações confirmadas pelo cliente são aplicadas antes.
      max-ping-compensation-ms: 300

      # Cancela ataques a jogadores cuja hitbox mais próxima possível esteja além do alcance
      # vanilla do atacante (entity_interaction_range) mais esta distância, em blocos.
      reach-leniency: 0.1

    autoclicker-limit:
      # Média de cliques por segundo acima da qual o acumulador do autoclicker aumenta.
      # Calculada em grupos de 50 movimentos de braço considerados pela verificação.
      max-cps: 25

    explosion:
      # As correções de posição por explosões também exigem que o nível de infrações
      # definido para correções nesta verificação seja excedido.

      # Erro de movimento acumulado por explosões necessário para tentar corrigir a posição.
      max-advantage: 1

      # Erro de uma única explosão necessário para tentar corrigir a posição
      # sem esperar que o erro acumulado atinja max-advantage.
      immediate-setback-threshold: 0.01

      # Multiplica o erro acumulado por este valor quando o desvio da resposta a uma explosão
      # fica abaixo de Explosion.threshold. Valores próximos de 1 reduzem o erro mais lentamente.
      setback-decay-multiplier: 0.98

      # Erro acumulado máximo de explosões mantido pela verificação.
      max-ceiling: 2

  prediction:
    # Regula apenas as correções de movimento; ultrapassar essa porcentagem nunca registra infrações por trapaça.
    # O histórico é mantido ao interromper ou retomar o uso de um item e após correções de posição.
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # Compara o tempo real em que o servidor usa um item (comer, beber, carregar)
    # com os ticks desacelerados declarados pelo cliente nesse período. Dívida acima de
    # max-debt-ticks sinaliza ItemUseBurst; o padrão cobre um frame atrasado do cliente
    # (10 ticks) mais arredondamento. O crédito só vem de ticks desacelerados adicionais.
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # Percentagem de cada tick de uso esperado que deve ser pago com um tick desacelerado.
      charge-percent: 95

    # Ping de transação ou tempo máximo sem pacotes de movimento tolerado
    # enquanto se aguarda a reação à repulsão, em milissegundos.
    # Uma margem fixa de 50 ms é adicionada antes de corrigir a posição por latência.
    max-knockback-ping-ms: 1000

    # Tempo sem pacotes de movimento antes de avaliar uma correção por latência,
    # em milissegundos. A correção exige que a simulação indique que permanecer
    # parado era inválido.
    max-freeze-time-ms: 5000

  networking:
    # Substitui a vida informada de outras entidades vivas por 1 ponto de vida.
    # Preserva a vida do observador, de sua montaria atual e das entidades mortas.
    # Observadores com cult.showhealth recebem os valores de vida reais.
    spoof-health: false

  client-brand:
    # Remove a primeira correspondência desta expressão regular das marcas de cliente recebidas.
    # Por padrão, remove o sufixo final " (Velocity)".
    # Use uma string vazia para desativar.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:

    # Grava no console os diagnósticos de teletransportes, correções de posição e ressincronizações.
    teleports: false

    bedrock-movement:
      # Ativa relatórios detalhados de movimento Bedrock e os registros de previsão associados,
      # sujeitos aos filtros e ao intervalo mínimo abaixo.
      enabled: false

      # Também relata movimentos sem infrações cujo desvio de validação
      # atinja min-offset.
      log-clean-offsets: false

      # Desvio de validação mínimo para relatar movimentos sem infrações.
      # Usado apenas quando log-clean-offsets é true.
      min-offset: 1.0e-7

      # Intervalo mínimo entre relatórios de movimento Bedrock de cada jogador, em segundos.
      # Use 0 para remover o tempo de espera.
      cooldown-seconds: 10

# The version of the check names this server uses outside punishments.yml: the names each check's
# own settings are written under in this file (AttackEntityVisibility.setbackvl), the names in its
# permission nodes (cult.exempt.attackentityvisibility), and the names alerts, logs, placeholders
# and the API show.
# Cult never changes it. Raise it yourself, after you have renamed those settings and permission nodes:
#   1: AttackMobVisibility, bAttackMobVisibility. InteractEntityVisibility covers players too.
#   2: AttackEntityVisibility, bAttackEntityVisibility. InteractPlayerVisibility covers players,
#      InteractEntityVisibility everything else.
#   3: MultiActionsC, D and H are InventoryA, B and C. MultiActionsI, J, K, L and S are one
#      check, InventoryD, whose verbose names the action. MultiActionsM, N, O, P, Q, R and T
#      are InventoryE to K. MultiActionsE, F and G are MultiActionsC, D and E.
# A file without this line is read as version 1.
check-name-version: 3

config-flavor: V2
config-version: 20
