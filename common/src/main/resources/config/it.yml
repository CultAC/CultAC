alerts:
    # In aggiunta alla trasmissione degli avvisi ai giocatori, dovrebbero essere inviati anche alla console?
    print-to-console: true
    # Questo controlla se e come gli avvisi vengono condivisi tra i server collegati al tuo proxy.
    # Deve essere abilitato 'bungee-plugin-message-channel' nella configurazione di Velocity se Velocity è in uso.
    proxy:
        # Gli avvisi devono essere inviati ad altri server collegati al tuo proxy?
        send: false
        # Gli avvisi ricevuti da altri server devono essere annunciati a questo server?
        receive: false

verbose:
    # Mostra dettagli su console?
    print-to-console: false

check-for-updates: true

client-brand:
    # Ignora i seguenti client nella trasmissione del marchio agli operatori
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Nascondi tutti gli spettatori con il permesso cult.spectator indipendentemente dal fatto che stiano effettivamente spettando attivamente
    hide-regardless: false
    # Renderà gli spettatori nascosti solo in questi mondi, lasciare vuoto per consentire tutti i mondi
    allowed-worlds:
        - ""

max-transaction-time: 60

# Se CultAC stesso fallisce (non riesce ad agganciarsi a un giocatore o la versione del client non è
# supportata), il giocatore continua senza ispezione invece di essere disconnesso. I kick per flood di
# pacchetti, exploit di crash e ping senza risposta oltre max-transaction-time restano attivi.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Il gestore predefinito per la risincronizzazione dei blocchi deve essere disabilitato?
# Di default, Cult legge i blocchi dal mondo del server e li invia al client per correggere il desync.
# Se utilizzi plugin che creano blocchi finti basati su pacchetti (che non esistono nel mondo del server),
# dovresti impostare questo su true per impedire a Cult di sovrascriverli con aria o blocchi reali.
# Questo forza l'uso di un gestore "NoOp" (Nessuna Operazione) a meno che non ne venga fornito uno personalizzato via API.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# CULTAC_OBSERVE_ONLY wins over this key when it is true, 1 or yes, or false, 0 or no. /cult reload applies a change.
observe-only: false

Simulation:
    # Riduce gradualmente l'avanzamento totale del giocatore quando è legittimo
    setback-decay-multiplier: 0.999
    # Limite per creare una violazione rispetto al movimento del giocatore
    threshold: 0.001
    # Soglia per arretrare immediatamente il giocatore dopo una violazione significativa
    immediate-setback-threshold: 0.1
    # Massimo vantaggio ammesso prima di arretrare il giocatore
    max-advantage: 1
    # Limite massimo di vantaggio accumulabile prima di arretrare il giocatore
    max-ceiling: 4
    # Soglia del livello di violazione per il setback
    # 1 per il comportamento precedente
    setback-violation-threshold: 1

Phase:
    # Livello di violazione per il glitch nel blocco
    setbackvl: 1
    # Decadimento per il glitch nel blocco
    decay: 0.005

AirLiquidPlace:
    # Livello di violazione per il piazzamento in aria o liquido
    cancelvl: 0

FabricatedPlace:
    # Livello di violazione per il piazzamento di un blocco fabbricato
    cancelvl: 5

FarPlace:
    # Livello di violazione per il piazzamento in un punto lontano
    cancelvl: 5

RotationPlace:
    # Livello di violazione per il piazzamento con rotazione specifica
    cancelvl: 5

NoSlow:
    # Limite per rilevare l'uso scorretto dell'oggetto
    threshold: 0.001
    # Livello di violazione per l'uso scorretto dell'oggetto
    setbackvl: 5
    # Decadimento per l'uso scorretto dell'oggetto
    decay: 0.05

Knockback:
    # Riduce gradualmente l'avanzamento totale del giocatore quando è legittimo
    setback-decay-multiplier: 0.999
    # Limite per creare una violazione rispetto alla velocità del giocatore
    threshold: 0.001
    # Soglia per arretrare immediatamente il giocatore dopo una violazione significativa
    immediate-setback-threshold: 0.1
    # Massimo vantaggio ammesso prima di arretrare il giocatore
    max-advantage: 1
    # Limite massimo di vantaggio accumulabile prima di arretrare il giocatore
    max-ceiling: 4

Explosion:
    # Limite per rilevare l'esplosione
    threshold: 0.001
    # Livello di violazione per l'esplosione
    setbackvl: 3

TimerA:
    # Livello di violazione per il timer
    setbackvl: 10
    # Millisecondi accumulabili per il timer
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Millisecondi persi prima di rilevare il timer negativo
    drift: 1200

VehicleTimer:
    # Livello di violazione per il timer dei veicoli
    setbackvl: 10

PacketOrderI:
    # Abilitare se i giocatori vengono segnalati per l'uso di mod di animazione 1.7
    exempt-placing-while-digging: false

Reach:
    # Limite per rilevare un attacco oltre la distanza massima
    threshold: 0.0005
    # Annulla gli attacchi impossibili
    block-impossible-hits: true
    # Abilita l'invio di pacchetti aggiuntivi per il rilevamento degli attacchi
    enable-post-packet: false

exploit:
    # Abilita il salto in sprint con l'elytra
    allow-sprint-jumping-when-using-elytra: true
    # Abilita la costruzione su ghost blocks
    allow-building-on-ghostblocks: true
    # Distanza per controllare i ghost blocks
    distance-to-check-if-ghostblocks: 2

# Enable logging plugins who have injected into netty on join to debug compatibility issues
debug-pipeline-on-join: false

# Enables experimental checks
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Cult sometimes cancels illegal packets such as with timer, after X packets in a second cancelled, when should
# we simply kick the player? This is required as some packet limiters don't count packets cancelled by cult.
packet-spam-threshold: 100
# Abilita questa opzione per stampare uno stacktrace quando un giocatore viene espulso a causa del packet-spam-threshold
debug-packet-cancel: false

# Cult può imporre che un giocatore uscito dallo stato di volo non abbia più di X ms di ping
# Questo perché Cult al momento non controlla i giocatori in volo
# Per disattivare, usa -1
max-ping-out-of-flying: 1000

# Ping massimo quando il boost del fuoco d’artificio viene rimosso dal giocatore.
# Impedisce ai giocatori con alta latenza di usare all’infinito un solo boost con fuochi d’artificio ed elytra.
max-ping-firework-boost: 1000

# Marcatori di schema — toccare solo se si sa cosa si sta facendo.
#   config-flavor:  V2 = build di Cult 2.x, V3 = Cult 3.x. Il plugin si rifiuta
#                   di caricare una config il cui flavor non corrisponde al
#                   proprio build; una config V3 aperta da un jar V2 fallisce
#                   subito invece di fondere silenziosamente nelle chiavi
#                   sbagliate.
#   config-version: incrementata a ogni modifica di forma incompatibile. Le
#                   vecchie config vengono migrate automaticamente
#                   dall'updater integrato al prossimo avvio.
# Cult aggiorna sempre i permessi memorizzati nella cache quando un giocatore entra
# e quando Cult viene ricaricato, indipendentemente dal fatto che LuckPerms sia installato.
# Gli hook degli eventi di LuckPerms aggiornano immediatamente anche i permessi
# di Cult in cache nelle configurazioni normali.
# Questo fallback periodico serve solo per modifiche ai permessi online non coperte
# da quegli eventi, ad esempio un contesto LuckPerms personalizzato che non chiama
# signalContextUpdate, lacune nei contesti Fabric o un provider di permessi diverso
# da LuckPerms che modifica i permessi in tempo reale.
# Imposta -1 per disattivare il polling. Imposta un valore positivo per aggiornare ogni X tick.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
bridge:
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_URL and CULTAC_CLOUD_API_KEY win over url and api-key when
# set and not blank, and an empty proxy-id takes CULTAC_PROXY_ID. docs/cloud-upload.md in CultAC's source says
# what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_* says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # When true, sends CPU and allocation stack samples of this server to the intake service: short profiles it asks
  # for, recorded off the main thread. Off by default; CULTAC_CLOUD_PERF (true/1/yes, false/0/no) wins when set.
  perf: false
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default; CULTAC_CLOUD_TEAM_SYNC (true/1/yes, false/0/no) wins when set.
  team-sync: false

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. Each setting's CULTAC_UPDATE_* environment variable wins when set and not blank.
update:
  # owner/repo whose GitHub releases hold the builds. Empty is the repository this jar was built from.
  # CULTAC_UPDATE_REPOSITORY.
  repository: ""
  # X.509 base64 Ed25519 key that build manifests must be signed with. Empty is CultAC's own build key.
  # CULTAC_UPDATE_PUBKEY.
  public-key: ""
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json. CULTAC_UPDATE_STATE.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar. CULTAC_UPDATE_BUILD.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds. CULTAC_UPDATE_TOKEN.
  token: ""
  # URL that receives each update result line. CULTAC_UPDATE_WEBHOOK.
  webhook: ""

config-flavor: V2
config-version: 14
