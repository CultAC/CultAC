# CultAC main configuration
# Source code: https://github.com/CultAC/CultAC
# Copyright 2025 DefineOutside and contributors, Licensed under GPLv3.
# Modified binaries, or plugins with copied cult code, must be private,
# or with full source code available to buyers at no additional cost.

alerts:
    # In aggiunta alla trasmissione degli avvisi ai giocatori, dovrebbero essere inviati anche alla console?
    print-to-console: true
    # Questo controlla se e come gli avvisi vengono condivisi tra i server collegati al tuo proxy.
    # Deve essere abilitato 'bungee-plugin-message-channel' nella configurazione di Velocity se Velocity è in uso.
    proxy:
        # Gli avvisi devono essere inviati ad altri server collegati al tuo proxy?
        send: false
        # Gli avvisi ricevuti da altri server devono essere annunciati a questo server?
        receive: false
    # Ambito degli avvisi dello staff che non ne ha scelto uno con /cult alerts scope: server o global.
    # global vale solo con gli avvisi di rete attivi; altrimenti si usa server.
    default-scope: server

verbose:
    # Mostra dettagli su console?
    print-to-console: false

client-brand:
    # Ignora i seguenti client nella trasmissione del marchio agli operatori
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"

spectators:
    # Nascondi tutti gli spettatori con il permesso cult.spectator indipendentemente dal fatto che stiano effettivamente spettando attivamente
    hide-regardless: false
    # Renderà gli spettatori nascosti solo in questi mondi, lasciare vuoto per consentire tutti i mondi
    allowed-worlds:
        - ""

max-transaction-time: 60

# Se CultAC stesso fallisce (non riesce ad agganciarsi a un giocatore o la versione del client non è
# supportata), il giocatore continua senza ispezione invece di essere disconnesso. I kick per flood di
# pacchetti, exploit di crash e ping senza risposta oltre max-transaction-time restano attivi.
launch-safety:
  fail-open: true

# Enable this to stop Cult cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# How many inventory clicks should we allow per server tick?
# Any clicks after this threshold is reached will be cancelled.
# Set to -1 to disable.
max-clicks-per-tick: 3

# Flag and alert without acting: no punishment commands, setbacks, packet cancels or kicks. Client packets reach the server as sent.
# /cult reload applies a change.
observe-only: false

# CultAC checks no one and frees the memory checking uses.
dormant: false

# Checks that neither flag nor set back, by name.
checks-off: []

# Withhold the punishment commands of punishments.yml; flags, alerts and setbacks keep running.
pause-punishments: false

Simulation:
    # Riduce gradualmente l'avanzamento totale del giocatore quando è legittimo
    setback-decay-multiplier: 0.999
    # Limite per creare una violazione rispetto al movimento del giocatore
    threshold: 0.001
    # Soglia per arretrare immediatamente il giocatore dopo una violazione significativa
    immediate-setback-threshold: 0.1
    # Massimo vantaggio ammesso prima di arretrare il giocatore
    max-advantage: 1
    # Limite massimo di vantaggio accumulabile prima di arretrare il giocatore
    max-ceiling: 4

Phase:
    # Livello di violazione per il glitch nel blocco
    setbackvl: 1
    # Decadimento per il glitch nel blocco
    decay: 0.005

AirLiquidPlace:
    # Livello di violazione per il piazzamento in aria o liquido
    cancelvl: 0

FabricatedPlace:
    # Livello di violazione per il piazzamento di un blocco fabbricato
    cancelvl: 5

FarPlace:
    # Livello di violazione per il piazzamento in un punto lontano
    cancelvl: 5

RotationPlace:
    # Livello di violazione per il piazzamento con rotazione specifica
    cancelvl: 5

NoSlow:
    # Limite per rilevare l'uso scorretto dell'oggetto
    threshold: 0.001
    # Livello di violazione per l'uso scorretto dell'oggetto
    setbackvl: 5
    # Decadimento per l'uso scorretto dell'oggetto
    decay: 0.05

Knockback:
    # Riduce gradualmente l'avanzamento totale del giocatore quando è legittimo
    setback-decay-multiplier: 0.999
    # Limite per creare una violazione rispetto alla velocità del giocatore
    threshold: 0.001
    # Soglia per arretrare immediatamente il giocatore dopo una violazione significativa
    immediate-setback-threshold: 0.1
    # Massimo vantaggio ammesso prima di arretrare il giocatore
    max-advantage: 1
    # Limite massimo di vantaggio accumulabile prima di arretrare il giocatore
    max-ceiling: 4

Explosion:
    # Limite per rilevare l'esplosione
    threshold: 0.001
    # Livello di violazione per l'esplosione
    setbackvl: 0

TimerA:
    # Livello di violazione per il timer
    setbackvl: 10
    # Millisecondi accumulabili per il timer
    drift: 120

PacketOrderI:
    # Abilitare se i giocatori vengono segnalati per l'uso di mod di animazione 1.7
    exempt-placing-while-digging: false

Reach:
    # Limite per rilevare un attacco oltre la distanza massima
    threshold: 0.0005
    # Annulla gli attacchi impossibili
    block-impossible-hits: true

exploit:
    # Abilita il salto in sprint con l'elytra
    allow-sprint-jumping-when-using-elytra: true
    # Abilita la costruzione su ghost blocks
    allow-building-on-ghostblocks: true
    # Distanza per controllare i ghost blocks
    distance-to-check-if-ghostblocks: 2

# Enables experimental checks
experimental-checks: false

# Cult sometimes cancels illegal packets such as with timer, after X packets in a second cancelled, when should
# we simply kick the player? This is required as some packet limiters don't count packets cancelled by cult.
packet-spam-threshold: 100

# Cult può imporre che un giocatore uscito dallo stato di volo non abbia più di X ms di ping
# Questo perché Cult al momento non controlla i giocatori in volo
# Per disattivare, usa -1
max-ping-out-of-flying: 1000

# Marcatori di schema — toccare solo se si sa cosa si sta facendo.
#   config-flavor:  V2 = build di Cult 2.x, V3 = Cult 3.x. Il plugin si rifiuta
#                   di caricare una config il cui flavor non corrisponde al
#                   proprio build; una config V3 aperta da un jar V2 fallisce
#                   subito invece di fondere silenziosamente nelle chiavi
#                   sbagliate.
#   config-version: incrementata a ogni modifica di forma incompatibile. Le
#                   vecchie config vengono migrate automaticamente
#                   dall'updater integrato al prossimo avvio.
# Cult aggiorna sempre i permessi memorizzati nella cache quando un giocatore entra
# e quando Cult viene ricaricato, indipendentemente dal fatto che LuckPerms sia installato.
# Gli hook degli eventi di LuckPerms aggiornano immediatamente anche i permessi
# di Cult in cache nelle configurazioni normali.
# Questo fallback periodico serve solo per modifiche ai permessi online non coperte
# da quegli eventi, ad esempio un contesto LuckPerms personalizzato che non chiama
# signalContextUpdate, lacune nei contesti Fabric o un provider di permessi diverso
# da LuckPerms che modifica i permessi in tempo reale.
# Imposta -1 per disattivare il polling. Imposta un valore positivo per aggiornare ogni X tick.
update-permission-ticks: -1

# Velocity only: shared secret for the bridge to the CultAC companion on backend servers.
# Leave empty to use Velocity's modern-forwarding secret; the companion must use the same value.
# Use a long random value (at least 32 characters): a short one can be guessed offline.
# Set enabled to false to open no bridge and send backend servers nothing on its channel; a change needs a proxy restart.
bridge:
  enabled: true
  secret: ""

# Upload of captured play to an intake service, which analyses it. Off while url or api-key is empty;
# your intake service provides both. CULTAC_CLOUD_API_KEY wins over api-key when set and not blank.
# docs/cloud-upload.md in CultAC's source says what is uploaded.
cloud:
  # false stops the upload, whatever CULTAC_CLOUD_API_KEY says; /cult reload applies it.
  enabled: true
  url: ""
  api-key: ""
  # Each upload socket's server id. {server} is the backend's name on a proxy and this server's own name on a
  # server; {proxy} is proxy-id. Empty picks {proxy}.{server} on a proxy and {server} on a server. Writers that
  # share one api-key need distinct ids.
  server-id: ""
  # Names this proxy among the writers sharing one api-key, required while server-id uses {proxy}. On a server it
  # is the server's own name, and required.
  proxy-id: ""
  # Backends whose players are not captured for the intake service while they are on them, such as lobbies: names
  # as velocity.toml gives them, ignoring case, where * stands for any characters (hub-*). Local checks, alerts and
  # punishments run there as everywhere else. On a server, a name matching proxy-id stops the capture on the whole
  # server. Empty captures every backend.
  uncaptured-servers: []
  # When true, the upload sockets also report the UUID, name and portal role (viewer, moderator or admin) of
  # players holding cult.portal.viewer, .moderator or .admin, and the stored role of synced players who are offline
  # when the intake service asks, so the cloud portal lists them in this server's organization while it has team
  # sync on. Off by default.
  team-sync: false
  # Panel bans: staff ban a player from the cloud panel, and the one server that claims the ban runs it once, as
  # console, in observe-only mode too. Placeholders: %player% %uuid% %reason% %reason_label% (the reason as staff
  # saw it) %cheat% %cheat_id% %duration% (30m, 12h, 7d; for a permanent ban the value your ban policy sends for
  # Permanent, empty by default) %seconds% %silent% (the silent flag, such as -s, when staff ticked Silent) %staff%
  # %ban_id% %link% %staff_uuid% (the banning staff member's Minecraft UUID when the panel knows it) %evidence% (a
  # link to the evidence the ban rests on, such as a replay); both are empty when unknown.
  # A word whose placeholder is empty is left out, so --sender=%staff_uuid% disappears rather than leaving --sender=.
  # %reason%, %reason_label% and %staff% may hold spaces, so they are only safe last: put %reason% at the end.
  # On a Paper server, use the ban plugin's namespaced command, such as litebans:ban, so a server without the plugin
  # never runs minecraft:ban. Examples for common ban plugins: docs/cloud-upload.md in CultAC's source.
  staff-ban:
    # Runs every panel ban when it holds %duration% ("ban %silent% %uuid% %duration% %reason%" for LiteBans), else
    # permanent bans and bans whose length your server decides. Empty: temp-command runs those it can.
    command: ""
    # Optional: runs timed bans in place of command, such as "tempban %silent% %player% %duration% %reason%". Empty:
    # command runs timed bans when it holds %duration% or %seconds%, else this server never takes them.
    temp-command: ""
    # The most panel bans this server claims a minute; the rest run in the minutes after.
    max-per-minute: 300

# Fa funzionare i comandi dello staff, il completamento con Tab e gli avvisi su tutti i tuoi proxy e server.
# Guida all'installazione: docs/network.md nel codice sorgente di CultAC. /cult reload applica le modifiche.
# Queste variabili d'ambiente hanno la precedenza sulle loro chiavi quando sono impostate e non vuote:
#   CULTAC_NETWORK_TYPE, CULTAC_NETWORK_SECRET
#   CULTAC_NETWORK_REDIS_ADDRESS, _USERNAME, _PASSWORD, _SSL
#   CULTAC_NETWORK_NATS_ADDRESS, _USERNAME, _PASSWORD, _TOKEN, _CREDENTIALS_FILE, _SSL
network:
  # Come i tuoi server comunicano tra loro:
  #   none         Spento. Comandi e avvisi raggiungono solo i giocatori di questo server.
  #   redis        Tramite un server Redis (vanno bene anche Valkey, KeyDB e Dragonfly). Compila la sezione redis.
  #   nats         Tramite un server NATS. Compila la sezione nats.
  #   redisbungee  Proxy Velocity con RedisBungee. Usa la sua connessione Redis, nient'altro da compilare.
  type: none
  redis:
    address: localhost:6379
    username: ""
    password: ""
    ssl: false
  nats:
    # Per indicare più server, separali con virgole.
    address: localhost:4222
    username: ""
    password: ""
    token: ""
    # Solo se il tuo server NATS usa gli account: il percorso del tuo file .creds.
    credentials-file: ""
    ssl: false
  # Il nome di questo server nella rete. Ogni server deve averne uno suo.
  # Lascia vuoto per usare l'id proxy di RedisBungee, altrimenti cloud.proxy-id, altrimenti IP e porta di questo server.
  instance-id: ""
  # /cult net <target> <command> runs a command on several servers at once.
  commands:
    # Whether this server runs network commands sent from other servers.
    enabled: true
    # The network commands this server runs; it refuses the others.
    accept: [status, reload, observe, toggle, check, punish, update]
    # What goes to update.webhook: summary (the sending server posts each command and its summary), every (each
    # server posts the command it ran) or none.
    webhook: summary

# Velocity only: numbered builds installed with /cult update <build>, /cult update latest [branch] and listed with
# /cult update builds [branch]. CULTAC_UPDATE_TOKEN wins over token when set and not blank.
update:
  # File remembering the installed build, which the next start fetches again. Relative to this folder; empty is
  # update-state.json.
  state-file: ""
  # Build to start on while no build is remembered. Empty starts the bundled jar.
  build: ""
  # Sent to api.github.com only, raising the hourly limit for latest and builds.
  token: ""
  # URL that receives each update result line.
  webhook: ""

# Configurazione specifica di CultAC.
cult:
  # Salta tutti i controlli per i giocatori Bedrock (Geyser/Floodgate) o Java.
  # Per impostazione predefinita vengono controllate entrambe le edizioni.
  exempt-bedrock-players: false
  exempt-java-players: false

  checks:
    bedrock-movement:
      # Segnala una violazione quando lo scostamento di convalida Bedrock raggiunge questo valore.
      # Include l'errore di movimento verticale e l'eccesso di input orizzontale.
      position-flag-threshold: 0.001

      # Avvicina la posizione simulata del tick successivo a quella dichiarata dal client,
      # fino a questa distanza per tick di movimento. 0 disattiva l'opzione.
      position-reconciliation-step: 0.0005

      # Attualmente compare solo nella diagnostica; questo valore non genera violazioni.
      velocity-flag-threshold: 0.001

      # Consente le correzioni di posizione per i giocatori Bedrock.
      # Attualmente viene applicato alla connessione; le modifiche richiedono di riconnettersi.
      enable-setbacks: true

    fair-reach:
      # Variazione temporale attorno all'intervallo di tracciamento di 50 ms di FairReach.
      # In millisecondi; 15 produce una finestra di 35–65 ms.
      max-position-packet-jitter-ms: 15

      # Attesa massima prima di applicare un aggiornamento della posizione del bersaglio, in millisecondi.
      # Gli aggiornamenti confermati dal client vengono applicati prima.
      max-ping-compensation-ms: 300

      # Annulla gli attacchi ai giocatori la cui hitbox più vicina possibile è più lontana della portata
      # vanilla dell'attaccante (entity_interaction_range) più questa distanza, in blocchi.
      reach-leniency: 0.1

    autoclicker-limit:
      # Media di clic al secondo oltre la quale aumenta l'accumulatore dell'autoclicker.
      # Calcolata su gruppi di 50 oscillazioni del braccio considerate valide dal controllo.
      max-cps: 25

    explosion:
      # Le correzioni di posizione dovute alle esplosioni richiedono anche il superamento
      # del livello di violazioni previsto dal controllo per applicare una correzione.

      # Errore di movimento accumulato dalle esplosioni necessario per tentare una correzione di posizione.
      max-advantage: 1

      # Errore di una singola esplosione necessario per tentare una correzione di posizione
      # senza attendere che l'errore accumulato raggiunga max-advantage.
      immediate-setback-threshold: 0.01

      # Moltiplica l'errore accumulato per questo valore quando lo scostamento della risposta
      # a un'esplosione scende sotto Explosion.threshold. Valori vicini a 1 lo riducono più lentamente.
      setback-decay-multiplier: 0.98

      # Errore massimo accumulato dalle esplosioni conservato dal controllo.
      max-ceiling: 2

  prediction:
    # Regola solo le correzioni del movimento; superare questa percentuale non registra mai violazioni per cheat.
    # La cronologia viene conservata quando si interrompe o si riprende l'uso di un oggetto
    # e quando viene corretta la posizione.
    item-use-desync:
      max-percent: 20
      history-ticks: 100

    # Confronta il tempo reale in cui il server usa un oggetto (mangiare, bere,
    # caricare) con i tick rallentati dichiarati dal client nello stesso periodo. Un debito
    # oltre max-debt-ticks segnala ItemUseBurst; il valore predefinito copre un frame
    # del client in ritardo (10 tick) più l'arrotondamento. Il credito deriva solo da tick rallentati aggiuntivi.
    item-use-burst:
      max-debt-ticks: 11
      max-credit-ticks: 2
      # Percentuale di ogni tick di utilizzo previsto da pagare con un tick rallentato.
      charge-percent: 95

    # Ping delle transazioni o tempo massimo senza pacchetti di movimento tollerato
    # mentre è in attesa una spinta di contraccolpo, in millisecondi.
    # Prima di una correzione per latenza viene aggiunto un margine fisso di 50 ms.
    max-knockback-ping-ms: 1000

    # Tempo senza pacchetti di movimento prima di valutare una correzione per latenza,
    # in millisecondi. La correzione richiede che la simulazione mostri che
    # rimanere fermi non era valido.
    max-freeze-time-ms: 5000

  networking:
    # Sostituisce la salute comunicata delle altre entità viventi con 1 punto salute.
    # Mantiene la salute dell'osservatore, della sua cavalcatura attuale e delle entità morte.
    # Gli osservatori con cult.showhealth ricevono i valori di salute reali.
    spoof-health: false

  client-brand:
    # Rimuove la prima corrispondenza di questa espressione regolare dalle marche dei client ricevute.
    # Per impostazione predefinita rimuove il suffisso finale " (Velocity)".
    # Usare una stringa vuota per disattivare.
    strip-pattern: ' \(Velocity\)$'

  diagnostics:

    # Scrive nella console la diagnostica di teletrasporti, correzioni di posizione e risincronizzazioni.
    teleports: false

    bedrock-movement:
      # Attiva i rapporti dettagliati sul movimento Bedrock e i relativi registri di previsione,
      # soggetti ai filtri e all'intervallo minimo indicati sotto.
      enabled: false

      # Include anche i movimenti senza violazioni il cui scostamento di convalida
      # raggiunge min-offset.
      log-clean-offsets: false

      # Scostamento di convalida minimo per segnalare movimenti senza violazioni.
      # Usato solo quando log-clean-offsets è true.
      min-offset: 1.0e-7

      # Intervallo minimo tra i rapporti di movimento Bedrock per ciascun giocatore, in secondi.
      # Impostare 0 per eliminare l'attesa.
      cooldown-seconds: 10

# The version of the check names this server uses outside punishments.yml: the names each check's
# own settings are written under in this file (AttackEntityVisibility.setbackvl), the names in its
# permission nodes (cult.exempt.attackentityvisibility), and the names alerts, logs, placeholders
# and the API show.
# Cult never changes it. Raise it yourself, after you have renamed those settings and permission nodes:
#   1: AttackMobVisibility, bAttackMobVisibility. InteractEntityVisibility covers players too.
#   2: AttackEntityVisibility, bAttackEntityVisibility. InteractPlayerVisibility covers players,
#      InteractEntityVisibility everything else.
#   3: MultiActionsC, D and H are InventoryA, B and C. MultiActionsI, J, K, L and S are one
#      check, InventoryD, whose verbose names the action. MultiActionsM, N, O, P, Q, R and T
#      are InventoryE to K. MultiActionsE, F and G are MultiActionsC, D and E.
# A file without this line is read as version 1.
check-name-version: 3

config-flavor: V2
config-version: 20
