org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Paperweight's source-generation default is true when CI is not exported.
# The offline PR sandbox does not inherit GitHub Actions' CI environment.
# Use the prebuilt Paperclip jar instead of running Mache decompilation.
# For local IDE Minecraft source browsing, override with:
#   -Ppaperweight.experimental.genSources=true
paperweight.experimental.genSources=false
mavenLocalOverride=true
paperDevBundleVersion=26.3.build.134-beta
# Oldest Paper version the runtime supports; the newest is the dev bundle version.
runtimeHostMinVersion=1.21.2

# Increment only when runtime/shared-loader compatibility breaks.
# When raising it, remove the compat shims for older hosts: grep -rn "TODO(cultLoaderVersion>N)" for N below the new value.
cultLoaderVersion=6
