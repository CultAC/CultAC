name: Bedrock movement regression
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Global signed 64-bit mutation seed
        type: string
        default: '42'
      cult_ref:
        description: Cult revision (empty means this commit in Cult, otherwise main)
        type: string
      scenarios_ref:
        description: Corpus revision (empty means this commit in scenarios, otherwise main)
        type: string
      replay_ref:
        description: Tooling revision (empty means this commit in replay, otherwise master)
        type: string
permissions:
  contents: read
jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify cross-repository checkout access
        env:
          REPLAY_READ_TOKEN: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
        run: |
          if [ -z "$REPLAY_READ_TOKEN" ]; then
            echo "Set SMOKETEST_REPO_TOKEN (or CULTAC_REPLAY_READ_TOKEN) with read access to both private replay repositories." >&2
            exit 1
          fi
      - name: Check out replay tooling
        uses: actions/checkout@v4
        with:
          repository: CultAC/BedrockPacketReplay
          ref: ${{ inputs.replay_ref || (github.repository == 'CultAC/BedrockPacketReplay' && github.sha) || 'master' }}
          path: replay
          token: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
          persist-credentials: false
      - name: Check out movement captures
        uses: actions/checkout@v4
        with:
          repository: CultAC/bedrock-smoketest-scenarios
          ref: ${{ inputs.scenarios_ref || (github.repository == 'CultAC/bedrock-smoketest-scenarios' && github.sha) || 'main' }}
          path: scenarios
          token: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
          persist-credentials: false
      - name: Check out Cult revision under test
        uses: actions/checkout@v4
        with:
          repository: CultAC/CultAC
          ref: ${{ inputs.cult_ref || (github.repository == 'CultAC/CultAC' && github.sha) || 'main' }}
          path: cult
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build replay tooling and Cult
        run: |
          replay/gradlew -p replay build --no-daemon --console=plain
          python3 -m unittest discover -s replay/scripts/tests
          cult/gradlew -p cult :bukkit:shadowJar --no-daemon --console=plain -Dorg.gradle.workers.max=2
      - name: Run live regression suite
        env:
          REPLAY_MUTATION_SEED: ${{ inputs.seed || '42' }}
        run: |
          mkdir -p artifacts
          git -C replay rev-parse HEAD > artifacts/replay-revision.txt
          git -C scenarios rev-parse HEAD > artifacts/scenarios-revision.txt
          git -C cult rev-parse HEAD > artifacts/cult-revision.txt
          python3 - <<'PYRUN'
          import os, pathlib, subprocess
          jars = [p for p in pathlib.Path('cult/bukkit/build/libs').glob('cultac-bukkit-*.jar') if not any(s in p.name for s in ('-sources', '-javadoc', '-plain', '-dev'))]
          if len(jars) != 1:
              raise SystemExit(f'Expected one Cult distributable, got {jars}')
          subprocess.run(['python3', 'replay/scripts/run-movement-regressions.py', '--scenarios', 'scenarios/scenarios', '--cultac-jar', str(jars[0]), '--server-dir', 'server', '--artifacts', 'artifacts', '--seed', os.environ['REPLAY_MUTATION_SEED']], check=True)
          PYRUN
      - name: Upload prediction, correction, and runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bedrock-movement-results
          path: |
            artifacts/**
            replay/build/test-results/**
            server/logs/**
          if-no-files-found: warn
