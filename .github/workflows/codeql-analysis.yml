name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The build needs the JDK 25 toolchain, so CodeQL traces a manual build rather than autobuild.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Compile buildSrc and the build scripts before tracing starts, so CodeQL extracts only the project's Java sources.
      - name: Prepare the Gradle build
        run: ./gradlew --no-daemon --console=plain help

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build
        run: ./gradlew --no-daemon --no-build-cache --console=plain compileJava -x spotlessApply

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
