name: Smoketests

on:
  push:
    branches: [main, experimental, dev]
  # The workflow and CI scripts come from the trusted base, never the PR.
  # Private fixtures are checked out on the host; PR code runs only in Docker.
  pull_request_target:
    branches: [main, experimental, dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoketests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoketest:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/experimental' ||
      github.ref == 'refs/heads/dev'
    name: ${{ matrix.suite }} smoketests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [java, bedrock]
    env:
      SMOKETEST_MAX_WORKERS: '2'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.workers.max=2'

    steps:
      - name: Check out trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: ci
          persist-credentials: false

      - name: Verify private fixture access
        env:
          FIXTURE_TOKEN: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
        run: |
          test -n "$FIXTURE_TOKEN" || {
            echo 'SMOKETEST_REPO_TOKEN with read access to the private smoketest repositories is required.' >&2
            exit 1
          }

      - name: Check out trusted Java harness
        if: matrix.suite == 'java'
        uses: actions/checkout@v4
        with:
          repository: CultAC/mcp-client-smoketest
          ref: master
          path: mcp-client-smoketest
          token: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
          persist-credentials: false

      - name: Check out trusted replay tooling
        if: matrix.suite == 'bedrock'
        uses: actions/checkout@v4
        with:
          repository: CultAC/BedrockPacketReplay
          ref: master
          path: replay
          token: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
          persist-credentials: false

      - name: Check out trusted movement captures
        if: matrix.suite == 'bedrock'
        uses: actions/checkout@v4
        with:
          repository: CultAC/bedrock-smoketest-scenarios
          ref: main
          path: scenarios
          token: ${{ secrets.SMOKETEST_REPO_TOKEN || secrets.CULTAC_REPLAY_READ_TOKEN }}
          persist-credentials: false

      - name: Identify trusted cache inputs
        id: inputs
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = java ]; then source=mcp-client-smoketest; else source=replay; fi
          echo "revision=$(git -C "$source" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore trusted prerequisites
        id: cache
        uses: actions/cache/restore@v4
        with:
          # Separate namespace: never restore caches from the old mixed-trust job.
          key: trusted-smoketest-v1-${{ matrix.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.revision }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mcp-client-smoketest/.real-validation/toolchains/MCP-Reborn
            mcp-client-smoketest/.real-validation/lwjgl-natives/linux-x64
            mcp-client-smoketest/.real-validation/paper
            mcp-client-smoketest/.real-validation/plugins/Geyser-Spigot.jar

      - name: Prepare trusted prerequisites
        env:
          SUITE: ${{ matrix.suite }}
        run: bash ci/.github/scripts/prepare-smoketests.sh "$SUITE"

      - name: Save trusted prerequisites before checking out tested code
        if: >-
          github.event_name != 'pull_request_target' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mcp-client-smoketest/.real-validation/toolchains/MCP-Reborn
            mcp-client-smoketest/.real-validation/lwjgl-natives/linux-x64
            mcp-client-smoketest/.real-validation/paper
            mcp-client-smoketest/.real-validation/plugins/Geyser-Spigot.jar

      - name: Build trusted sandbox image
        run: docker build -t cultac-smoketest ci/.github/scripts/smoketest-container

      - name: Check out CultAC revision under test as data
        uses: actions/checkout@v4
        with:
          # Missing/conflicted merge refs must fail checkout, never test the base.
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          path: cultac
          persist-credentials: false
          # Only the disposable copy is executed, without runner credentials.
          allow-unsafe-pr-checkout: true

      - name: Run selected smoketests without host credentials or writable caches
        id: sandbox
        env:
          SUITE: ${{ matrix.suite }}
        run: bash ci/.github/scripts/run-smoketest-container.sh "$SUITE"

      - name: Collect regular artifact files only
        if: always() && steps.sandbox.outputs.path != ''
        env:
          SANDBOX: ${{ steps.sandbox.outputs.path }}
          SUITE: ${{ matrix.suite }}
        run: >-
          python3 ci/.github/scripts/collect-smoketest-artifacts.py
          "$SANDBOX" "$RUNNER_TEMP/smoketest-artifacts" "$SUITE"

      - name: Upload smoketest evidence
        if: always() && steps.sandbox.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-smoketest-results
          path: ${{ runner.temp }}/smoketest-artifacts
          if-no-files-found: warn
          retention-days: 7
