name: Cult Parity Harness

on:
  push:
    branches:
      - "2.0"
  pull_request:
    branches:
      - "2.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out CultAC with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run parity harness contract tests
        run: ./gradlew :parity:test --no-daemon --console=plain
